# ansible.cfg — auto-loaded when running ansible from this directory
[defaults]
inventory            = inventories/production/hosts.ini
roles_path           = roles
collections_path     = collections
host_key_checking    = false          # freshly cloned VMs constantly get new host keys
retry_files_enabled  = false
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400
stdout_callback      = ansible.builtin.default
result_format        = yaml
#callbacks_enabled    = profile_tasks, timer
deprecation_warnings = False
forks                = 20
interpreter_python   = auto_silent

# SSH straight to root via key — managed nodes are Ubuntu VMs.
# The Proxmox host and Rancher API are called through the uri/proxmox_* modules, so no SSH needed for those.
remote_user          = root
private_key_file     = ~/.ssh/id_ed25519

[ssh_connection]
pipelining           = true           # ~2x faster; requires !requiretty in sudoers (fine for root)
ssh_args             = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
