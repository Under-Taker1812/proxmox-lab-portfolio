# ansible.cfg — tự load khi chạy ansible từ thư mục này
# Tham khảo best-practices.md mục 8 (Performance) + mục 2 (cấu trúc).
[defaults]
inventory            = inventories/production/hosts.ini
roles_path           = roles
collections_path     = collections
host_key_checking    = false          # VM clone mới, host key thay đổi liên tục
retry_files_enabled  = false
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400
stdout_callback      = ansible.builtin.default
result_format        = yaml
#callbacks_enabled    = profile_tasks, timer
deprecation_warnings = False
forks                = 20
interpreter_python   = auto_silent

# SSH thẳng root bằng key (theo Constraints prompt) — managed node là VM Ubuntu.
# Proxmox host và Rancher API gọi qua module uri/proxmox_* nên không cần SSH ở đây.
remote_user          = root
private_key_file     = ~/.ssh/id_ed25519

[ssh_connection]
pipelining           = true           # ~2x nhanh hơn; cần !requiretty trong sudoers (root nên OK)
ssh_args             = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
