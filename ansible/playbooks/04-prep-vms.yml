# 04-prep-vms.yml — Runs on ALL VMs. Every cleanup step has its own VERIFY task (fails loud).
# Handles: a leftover MicroK8s/Wekan crash loop baked into the template, an LVM disk that needs
# extending, swap, sysctl, vm.max_map_count, and package-manager-lock races.
# Principle: never trust a checklist — verify against real output, idempotently.
---
# any_errors_fatal — if one VM drops off SSH mid-play (e.g. sshd briefly bounced by
# unattended-upgrades), Ansible's default behavior is to drop only that VM from THIS play and
# silently continue — every LATER play (join cluster, ceph-csi, verify) targeting that same VM then
# also silently skips it, leaving a half-joined cluster (a worker joining a control plane that was
# never actually prepared) with logs that look clean. any_errors_fatal stops the entire
# ansible-playbook run right here instead of letting the failure propagate silently through 5-6
# later plays.
- name: Prepare the VM environment
  hosts: cluster_vms
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars_files:
    - ../vars/cluster.yml
  tasks:
    # --- 0. Fully update packages (including the kernel), under control, then reboot if needed ---
    # Proxmox's cloud-init defaults `ciupgrade=1`, running an uncontrolled `apt-get dist-upgrade` in
    # the background the moment a VM boots, racing the rest of the Ansible pipeline — in practice
    # this once installed a new kernel without rebooting, and the kernel/userspace version mismatch
    # broke the DHCP client on the workload NIC right as RKE2/systemd-networkd restarted. `ciupgrade`
    # is disabled at clone time (see 01-create-vms.yml) — Ansible does the same upgrade work itself,
    # here, under control: update → upgrade → reboot immediately if needed, before anything else
    # touches the VM. See "Two independent processes fighting over the same package manager lock" in
    # ../TROUBLESHOOTING.md for the full pattern (this is the first of three incidents that pattern
    # covers) — including a later occurrence where Ubuntu's own `apt-daily-upgrade.timer` (unrelated
    # to Proxmox's ciupgrade) held the dpkg lock past the original 300s timeout on a freshly booted
    # VM, fixed the same way: wait for it to finish on its own, then disable the timer so it can't
    # recur on later runs against the same VM.
    - name: Wait for unattended-upgrades to release the dpkg lock, if held — never kill it mid-run
      ansible.builtin.shell:
        cmd: |
          for i in $(seq 1 60); do
            fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || exit 0
            sleep 10
          done
          exit 1
      register: wait_dpkg_lock
      changed_when: false
      failed_when: false

    - name: Fail if the dpkg lock is still held after a 10-minute wait (rare — needs manual investigation)
      ansible.builtin.fail:
        msg: "dpkg lock still held after waiting 600s for unattended-upgrades — SSH in and run 'ps aux | grep apt' to see what's holding it."
      when: wait_dpkg_lock.rc != 0

    - name: Disable the apt-daily timers (unattended-upgrades) — Ansible is the only thing allowed to touch apt from here on
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false

    - name: Update all packages (including the kernel) — replaces Proxmox's background ciupgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        lock_timeout: 300
      register: apt_upgrade_result

    - name: Check whether a reboot is needed after the upgrade (new kernel/glibc, etc.)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot immediately if needed (keeps kernel/userspace in sync before anything else runs)
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: reboot_required_file.stat.exists

    # --- 1. Remove conflicting/leftover snaps baked into the template (MicroK8s + Wekan) ---
    # The "wekan" snap (an unrelated Kanban app pre-installed on the template) ships a "ferretdb"
    # child process that constantly burns 200%+ CPU — enough to flap readiness probes
    # (etcd/apiserver/kubelet failing and recovering repeatedly) and stall RKE2 provisioning for a
    # long time, easy to mistake for a VM under-provisioned on RAM/CPU when it's actually template
    # cruft. This block is the per-VM safety net; the real fix is removing it from template 101
    # itself (clone → start → remove the snap → cloud-init clean → reconvert to template), or every
    # future clone keeps reintroducing it.
    - name: Stop + disable the wekan snap's services before removing it (breaks the crash loop blocking snapd's queue)
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - snap.wekan.ferretdb.service
        - snap.wekan.mongodb.service
        - snap.wekan.wekan.service
      failed_when: false   # service doesn't exist (VM never had wekan) — not an error
      changed_when: false  # best-effort cleanup — the real VERIFY task below decides pass/fail

    # snapd can independently queue an "auto-refresh" change for wekan (distinct from the crash-loop
    # issue above) that holds the transaction lock on its own — `snap remove --purge` then fails with
    # "has \"auto-refresh\" change in progress" even after the services are stopped, since that
    # change isn't caused by the service restarting.
    - name: Abort any in-progress snapd changes (auto-refresh, etc.) before attempting removal
      ansible.builtin.shell:
        cmd: |
          for id in $(snap changes 2>/dev/null | awk '$2 ~ /^(Do|Doing)$/ {print $1}'); do
            snap abort "$id" || true
          done
      changed_when: false
      failed_when: false

    # community.general.snap's return status isn't reliable when removing several snaps ("present
    # and absent" mixed) in one call — real logs showed "snaps_removed": ["wekan"] (a genuine
    # success) while the module still reported "failed", on every retry, even though snapd itself
    # wasn't actually busy. Worked around by dropping the module for a direct `snap remove --purge`
    # shell call, with the verification folded into the SAME retried task, driven by `snap list`
    # (real evidence) rather than trusting any removal command's own return status.
    - name: Remove via shell (not the module) + VERIFY microk8s/nextcloud/wekan are gone — retry until actually clean
      ansible.builtin.shell:
        cmd: |
          for s in microk8s nextcloud wekan; do
            snap list 2>/dev/null | grep -q "^${s} " && snap remove --purge "$s" || true
          done
          snap list 2>/dev/null | grep -iE 'microk8s|wekan'; echo done
      register: snap_check
      changed_when: false
      retries: 5
      delay: 10
      until: "'microk8s' not in snap_check.stdout and 'wekan' not in snap_check.stdout"
      failed_when: "'microk8s' in snap_check.stdout or 'wekan' in snap_check.stdout"

    # --- 2. Remove Docker (its containerd conflicts with RKE2's own) ---
    - name: Remove docker packages
      ansible.builtin.apt:
        name: ["docker", "docker-engine", "docker.io", "containerd", "runc"]
        state: absent
        autoremove: true
      failed_when: false

    # --- 3. Extend the LVM disk to use all provisioned capacity (auto-detects device/VG/LV) ---
    - name: Install cloud-guest-utils (growpart) + lvm2
      ansible.builtin.apt:
        name: ["cloud-guest-utils", "lvm2"]
        state: present
        update_cache: true

    - name: Auto-detect the PV device backing the root LVM (e.g. /dev/sda3 or /dev/vda3)
      ansible.builtin.shell:
        cmd: "pvs --noheadings -o pv_name | tr -d ' ' | head -1"
      register: pv_dev
      changed_when: false

    - name: Auto-detect the root (/) VG + LV
      ansible.builtin.shell:
        cmd: "findmnt -n -o SOURCE / | xargs lsblk -nro NAME | head -1"
      register: root_lv_name
      changed_when: false

    - name: Split disk/partition from the PV device + VG/LV (falls back to vars if detection is empty)
      ansible.builtin.set_fact:
        # /dev/sda3 → device 'sda', part '3'
        detected_disk: "{{ (pv_dev.stdout | regex_replace('^/dev/', '') | regex_replace('[0-9]+$', '')) | default(prep_root_disk, true) }}"
        detected_part: "{{ (pv_dev.stdout | regex_search('([0-9]+)$', '\\1') | first) | default(prep_root_part, true) }}"
        # ubuntu--vg-ubuntu--lv → vg 'ubuntu-vg', lv 'ubuntu-lv'
        # LVM doubles every literal '-' in a VG/LV name into '--'; a lone '-' is the real
        # separator. '--' has to be swapped for a placeholder BEFORE splitting on single '-',
        # otherwise the regex splits on the wrong dash inside a doubled pair (previously produced
        # "ubuntu-" instead of "ubuntu-vg").
        detected_vg: "{{ (root_lv_name.stdout | regex_replace('--', '@@@') | regex_replace('-.*$', '') | replace('@@@', '-')) | default(prep_lvm_vg, true) }}"
        detected_lv: "{{ (root_lv_name.stdout | regex_replace('--', '@@@') | regex_replace('^[^-]*-', '') | replace('@@@', '-')) | default(prep_lvm_lv, true) }}"

    - name: Report the detected device
      ansible.builtin.debug:
        msg: "PV=/dev/{{ detected_disk }}{{ detected_part }}  VG={{ detected_vg }}  LV={{ detected_lv }}"

    - name: growpart the LVM partition
      ansible.builtin.command:
        cmd: "growpart /dev/{{ detected_disk }} {{ detected_part }}"
      register: growpart_out
      changed_when: "'CHANGED' in growpart_out.stdout"
      failed_when:
        - growpart_out.rc != 0
        - "'NOCHANGE' not in growpart_out.stdout"

    - name: pvresize the PV
      ansible.builtin.command:
        cmd: "pvresize /dev/{{ detected_disk }}{{ detected_part }}"
      register: pvresize_out
      changed_when: "'resized' in pvresize_out.stdout"

    - name: lvextend +100%FREE
      community.general.lvol:
        vg: "{{ detected_vg }}"
        lv: "{{ detected_lv }}"
        size: +100%FREE
        resizefs: true
      register: lvextend_out
      failed_when:
        - lvextend_out.failed | default(false)
        - "'matches existing size' not in (lvextend_out.msg | default(''))"
        - "'reached its physical size' not in (lvextend_out.msg | default(''))"

    - name: "VERIFY — root disk has been extended (>25GB)"
      ansible.builtin.shell:
        cmd: "df -BG --output=size / | tail -1 | tr -dc '0-9'"
      register: root_size
      changed_when: false
      failed_when: (root_size.stdout | int) < 25

    # --- 4. Disable swap (K8s requires it) ---
    - name: swapoff -a
      ansible.builtin.command:
        cmd: swapoff -a
      changed_when: false

    - name: Comment out the swap line in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: "VERIFY — swap used = 0"
      ansible.builtin.shell:
        cmd: "free -m | awk '/Swap/ {print $3}'"
      register: swap_used
      changed_when: false
      failed_when: (swap_used.stdout | int) > 0

    # --- 5. sysctl: ip_forward + vm.max_map_count (for Elasticsearch) + bridge-nf ---
    # br_netfilter MUST be loaded first — the net.bridge.bridge-nf-call-iptables sysctl only appears
    # under /proc/sys/net/bridge/ once this module is loaded; otherwise sysctl fails with
    # "cannot stat ... No such file".
    - name: Load the br_netfilter kernel module (required for the bridge-nf sysctl)
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Persist br_netfilter across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: "br_netfilter\n"
        mode: "0644"

    - name: Apply K8s + Elasticsearch sysctls
      ansible.posix.sysctl:
        name: "{{ item.k }}"
        value: "{{ item.v }}"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - { k: "net.ipv4.ip_forward", v: "1" }
        - { k: "vm.max_map_count", v: "262144" }       # Elasticsearch 8.x requires ≥262144 — harmless to keep even on nodes not running ES locally
        - { k: "net.bridge.bridge-nf-call-iptables", v: "1" }
      loop_control:
        label: "{{ item.k }}={{ item.v }}"

    - name: "VERIFY — vm.max_map_count ≥ 262144"
      ansible.builtin.command:
        cmd: "sysctl -n vm.max_map_count"
      register: mmc
      changed_when: false
      failed_when: (mmc.stdout | int) < 262144

    # --- 6. Make sure qemu-guest-agent is running ---
    - name: Enable qemu-guest-agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started

    # --- 7. cloud-init clean machine-id (avoids netplan reverting / duplicate host identity) ---
    - name: cloud-init clean machine-id
      ansible.builtin.command:
        cmd: "cloud-init clean --machine-id"
      changed_when: false
      failed_when: false      # some images don't support this flag — safe to ignore
