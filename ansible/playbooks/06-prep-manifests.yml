# 06-prep-manifests.yml — Stages manifests + config.yaml BEFORE rke2-server/agent ever starts.
# This ordering is the whole point: it prevents the CoreDNS/Calico bugs documented in
# ../../docs/troubleshooting/networking-and-cni.md, instead of patching them after the fact.
# This file is ALWAYS imported (site.yml has no `when` at the import_playbook level) — each play
# inside gates itself on its own scope, deliberately NOT one shared condition for the whole file:
#   Play 1 (CoreDNS/Calico Helm manifests): CP-01 ONLY, new_cluster ONLY (`when: stage_06_manifests`)
#     — server-side, applied cluster-wide through K8s, only needs staging once at cluster creation.
#   Play 2 (resolv-conf + node-ip in config.yaml): EVERY node (cp_nodes+worker_nodes), EVERY mode
#     (including add_node) — not gated on stage_06_manifests, because a node added later via
#     add_node has the exact same two NICs (workload + storage) as CP-01 and needs the same
#     node-ip pinning (see the note above Play 2 below).
---
# `when` at the PLAY level itself (same level as hosts/vars_files, not nested in a task/block) is
# not a valid Ansible Play attribute — it only works at the task level, the block level, or when
# the play is invoked via `import_playbook` (which site.yml already does correctly for this whole
# file). Real error hit: "[ERROR]: 'when' is not a valid attribute for a Play". Fixed by wrapping
# this play's tasks in a `block:` and putting `when` on the block instead (Ansible applies it to
# every task inside, which was the actual intent) — kept as one file, not split further.
- name: Stage preventive manifests on CP-01
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  vars_files:
    - ../vars/network.yml
  vars:
    # No hardcoded IP fallback (a lab-specific one would be wrong elsewhere) — if it can't be
    # determined, the task below fails loudly instead of silently using the wrong lab's IP.
    rancher_ip: "{{ hostvars['localhost'].rancher_ip | default(hostvars['localhost'].new_rancher_ip, true) }}"
  tasks:
    - name: "[new_cluster] Stage the 2 CoreDNS/Calico Helm manifests + verify"
      when: stage_06_manifests | bool
      block:
        - name: Fail if rancher_ip couldn't be determined (missing rancher_instances, or play 05 install_new hasn't run yet)
          ansible.builtin.fail:
            msg: >-
              Could not determine rancher_ip before staging manifests — check that rancher_instances
              (use_existing) is correct, or that play 05 ran BEFORE play 06 when rancher_mode=install_new.
          when: rancher_ip is not defined or rancher_ip | length == 0

        - name: Create the manifests directory
          ansible.builtin.file:
            path: /var/lib/rancher/rke2/server/manifests
            state: directory
            mode: "0755"

        - name: CoreDNS HelmChartConfig (hosts plugin + disabled probes — see networking-and-cni.md Bug #1)
          ansible.builtin.template:
            src: ../templates/rke2-coredns-config.yaml.j2
            dest: /var/lib/rancher/rke2/server/manifests/rke2-coredns-config.yaml
            mode: "0644"

        - name: Calico HelmChartConfig (Legacy backend + CIDRs — see networking-and-cni.md Bug #2 and Root cause B)
          ansible.builtin.template:
            src: ../templates/rke2-calico-config.yaml.j2
            dest: /var/lib/rancher/rke2/server/manifests/rke2-calico-config.yaml
            mode: "0644"

        # A raw FelixConfiguration/default manifest is deliberately NOT applied here. The
        # HelmChartConfig above already sets iptablesBackend: Legacy through the proper channel (it
        # merges into the rke2-calico Helm chart's own values). Creating a FelixConfiguration/default
        # object directly, before the Helm chart runs, makes Helm see an object that already exists
        # but isn't labeled as Helm-owned ("app.kubernetes.io/managed-by: Helm") — Helm then refuses
        # to install, and the helm-install pod CrashLoopBackOffs forever with an empty
        # calico-system. The old .j2 template for this is kept in the repo for reference but is no
        # longer used.

        - name: "VERIFY — both manifests are present"
          ansible.builtin.find:
            paths: /var/lib/rancher/rke2/server/manifests
            patterns: "rke2-coredns-config.yaml,rke2-calico-config.yaml"
          register: manifest_files

        - name: Fail if a manifest is missing
          ansible.builtin.fail:
            msg: "Missing manifest — only found {{ manifest_files.files | map(attribute='path') | list }}"
          when: manifest_files.matched < 2

# The original version had "resolv-conf in config.yaml" and "node-ip pinning" running only in Play
# 1 above — i.e. only on CP-01, only on new_cluster. But CP-02/03 and every worker node (including
# ones added later via add_node) carry the exact same two NICs as CP-01 (a workload NIC and a
# storage NIC — attached to every VM in 01-create-vms.yml, not just CP-01/new_cluster). Since those
# other nodes never got a "node-ip:" line in their own config.yaml, rke2-server/rke2-agent had to
# auto-detect the right NIC at startup — with no guarantee it picked the workload NIC over the
# storage one. That's the real cause behind a node unexpectedly advertising a storage-VLAN address
# instead of its workload-VLAN one, on any node other than CP-01 at new_cluster time.
#
# Fix: split these two tasks into a SEPARATE play in this same file (not a new file) — this play has
# no play-level `when` (always runs, every mode including add_node), targets every cluster node
# (cp_nodes + worker_nodes), and uses each node's own ansible_host (set per-host via add_host in
# 02-discover-ips.yml). This MUST run BEFORE 07-join-cluster.yml — rke2-server/agent reads
# config.yaml at startup, and node-ip can't be added after a node has already joined.
- name: Pin resolv-conf + node-ip on every cluster node (CP + worker), every mode
  hosts: cp_nodes:worker_nodes
  gather_facts: false
  become: true
  vars_files:
    - ../vars/network.yml
  vars:
    node_ip: "{{ ansible_host }}"
  tasks:
    - name: Ensure /etc/rancher/rke2 exists
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        mode: "0755"

    # This file used to only be rendered on CP-01 — but CP-02/03/worker's config.yaml also points at
    # this same path (task below), so it needs to be rendered here on every node. Its content is
    # static (just the net_dns_upstream list), so rendering it identically everywhere is safe.
    - name: /etc/rke2-resolv.conf (applied to every node)
      ansible.builtin.template:
        src: ../templates/rke2-resolv.conf.j2
        dest: /etc/rke2-resolv.conf
        mode: "0644"

    - name: resolv-conf entry in config.yaml (applied to every node)
      ansible.builtin.lineinfile:
        path: /etc/rancher/rke2/config.yaml
        line: "resolv-conf: /etc/rke2-resolv.conf"
        create: true
        mode: "0644"

    - name: Pin node-ip to this node's own workload-VLAN address (prevents kubelet/rke2 from picking the storage NIC by mistake)
      ansible.builtin.lineinfile:
        path: /etc/rancher/rke2/config.yaml
        line: "node-ip: {{ node_ip }}"
        create: true
        mode: "0644"
