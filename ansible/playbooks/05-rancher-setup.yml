# 05-rancher-setup.yml — [rancher_mode=install_new] Installs K3s + Helm + cert-manager + Rancher.
# Target: the rancher_nodes group (needs one role: rancher node in cluster_nodes).
# After completion: logs into the API for a bearer token → overrides rancher_url/rancher_ip/rancher_api_token.
#
# Includes the startup-probe timeout fix for Rancher's first boot — see
# ../../docs/05-rancher-rke2-deployment.md for why the default probe isn't enough.
---
- name: Install Rancher (install_new)
  hosts: rancher_nodes
  gather_facts: true
  become: true
  vars_files:
    - ../vars/versions.yml
    - ../vars/network.yml   # sslip_domain — never hardcode "sslip.io" in a task
  tasks:
    - name: "Fail if there's no role: rancher node"
      ansible.builtin.fail:
        msg: "install_new needs one role: rancher node in cluster_nodes (e.g. {role: rancher, ram: 8192, cpu: 4, disk: 50})"
      when: groups['rancher_nodes'] is not defined or groups['rancher_nodes'] | length == 0
      run_once: true

    - name: Rancher VM's IP (workload VLAN)
      ansible.builtin.set_fact:
        this_rancher_ip: "{{ ansible_host }}"

    - name: "Install K3s (pinned to {{ k3s_version }})"
      ansible.builtin.shell:
        cmd: >
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}"
          sh -s - --write-kubeconfig-mode 644
      args:
        creates: /etc/rancher/k3s/k3s.yaml

    - name: Install Helm
      ansible.builtin.shell:
        cmd: "curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
      args:
        creates: /usr/local/bin/helm

    - name: helm repo add (jetstack + rancher)
      ansible.builtin.command:
        cmd: "helm repo add {{ item.name }} {{ item.url }}"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      loop:
        - "{{ helm_repos.jetstack }}"
        - "{{ helm_repos.rancher }}"
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when:
        - repo_add.rc != 0
        - "'already exists' not in repo_add.stderr"

    - name: helm repo update
      ansible.builtin.command:
        cmd: helm repo update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Install cert-manager (CRDs enabled)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install cert-manager jetstack/cert-manager
          --namespace cert-manager --create-namespace
          --version {{ cert_manager_version }} --set crds.enabled=true --wait
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: certm
      changed_when: "'has been upgraded' in certm.stdout or 'STATUS: deployed' in certm.stdout"

    - name: Create the cattle-system namespace
      ansible.builtin.command:
        cmd: "kubectl create namespace cattle-system"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: ns_create
      changed_when: "'created' in ns_create.stdout"
      failed_when:
        - ns_create.rc != 0
        - "'AlreadyExists' not in ns_create.stderr"

    - name: Install Rancher (sslip.io hostname, bootstrapPassword via --set-string)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install rancher rancher-stable/rancher
          --namespace cattle-system
          --set hostname=rancher.{{ this_rancher_ip }}.{{ sslip_domain }}
          --set-string bootstrapPassword={{ rancher_bootstrap_password }}
          --set replicas=1
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: rancher_install
      changed_when: "'STATUS: deployed' in rancher_install.stdout"

    - name: Patch startupProbe.failureThreshold=60 (default timeout is too short for first boot)
      ansible.builtin.command:
        cmd: >
          kubectl -n cattle-system patch deployment rancher --type=json
          -p=[{"op":"replace","path":"/spec/template/spec/containers/0/startupProbe/failureThreshold","value":60}]
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: probe_patch
      changed_when: "'patched' in probe_patch.stdout"
      failed_when:
        - probe_patch.rc != 0
        - "'not patched' not in probe_patch.stdout"

    - name: "Wait for the Rancher rollout (up to {{ timeout_rancher_bootstrap }}s)"
      ansible.builtin.command:
        cmd: "kubectl -n cattle-system rollout status deploy/rancher --timeout={{ timeout_rancher_bootstrap }}s"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Log into the Rancher API for a bearer token
      ansible.builtin.uri:
        url: "https://rancher.{{ this_rancher_ip }}.{{ sslip_domain }}/v3-public/localProviders/local?action=login"
        method: POST
        body_format: json
        body:
          username: admin
          password: "{{ rancher_bootstrap_password }}"
        validate_certs: false
        status_code: [201, 200]
      register: rancher_login
      retries: 10
      delay: 15
      until: rancher_login.status in [200, 201]

    - name: Override Rancher facts for later plays (set on localhost)
      ansible.builtin.set_fact:
        new_rancher_url: "https://rancher.{{ this_rancher_ip }}.{{ sslip_domain }}"
        new_rancher_ip: "{{ this_rancher_ip }}"
        new_rancher_token: "{{ rancher_login.json.token }}"
      delegate_to: localhost
      delegate_facts: true

- name: Propagate the new Rancher facts to the rest of the run
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Override rancher_url / rancher_ip / rancher_api_token
      ansible.builtin.set_fact:
        rancher_url: "{{ new_rancher_url }}"
        rancher_ip: "{{ new_rancher_ip }}"
        rancher_api_token: "{{ new_rancher_token }}"
      when: new_rancher_url is defined

    # The Rancher instance just created is EPHEMERAL — it only lives in this run's set_fact and is
    # NOT automatically added to rancher_instances (group_vars/all/vars.yml). To reuse it later
    # (rancher_mode=use_existing), manually add an entry to rancher_instances with
    # url = new_rancher_url (printed below), plus a real API token (Rancher UI → Account & API
    # Keys, see ansible/README.md step 3) under vault_rancher_instances.<new-name>.api_token. See
    # the install_new comment in deploy-config.yml for more.
    - name: Print the newly created Rancher's URL (to register as a reusable instance later, if desired)
      ansible.builtin.debug:
        msg: "New Rancher: {{ new_rancher_url }} — token was used for this run only, not saved automatically."
      when: new_rancher_url is defined
