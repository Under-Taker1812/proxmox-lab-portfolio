# 13-data-collector-hub.yml — Tạo MỚI 1 data-collector-hub (Mục 4/5/6 của
# ../data-collector-hub-setup.md): Prometheus remote-write receiver, Elasticsearch + Kibana
# (password CỐ ĐỊNH ngay từ đầu — đúng TODO đã ghi trong tài liệu, chưa từng làm lúc chạy tay lần
# đầu), NodePort Grafana/Kibana, Proxmox VE Firewall (CHỈ cấp VM).
#
# CHỈ dùng khi tạo hub MỚI (dự án khác) — hub hiện có (`hub_instances.default`, VM 201, xem
# vars/hub.yml) vẫn dựng tay, KHÔNG chạy playbook này nhắm vào nó (không idempotent-safe với 1
# stack đã cài dở dang/khác convention).
#
# Hub về bản chất chỉ là 1 cluster RKE2 single-node bình thường (role "cp", không cần worker) —
# TÁI SỬ DỤNG nguyên site.yml/01→02→03→04→07→08 để tạo VM + join Rancher + Ceph CSI, KHÔNG viết
# lại. Playbook này chỉ chứa phần THẬT SỰ mới (Mục 4/5/6), chạy SAU khi cluster đó đã Ready:
#
#   ansible-playbook site.yml -e @.secrets-test -e "cluster_name=hub-project-x" \
#     -e 'cluster_nodes=[{role:"cp",ram:16384,cpu:16,disk:150,type:"general",target_node:"proxmox-2",pin_static_ip:true}]' \
#     -e "run_only=[1,3,4,6,7,8]"   # bỏ 9/10 (hub không tự gửi metrics/log cho chính nó)
#   # pin_static_ip:true (2026-07-22, khuyến nghị BẮT BUỘC cho hub) — chuyển IP DHCP thành static
#   # ngay lúc tạo, tránh đúng Bug #6 (data-collector-hub-setup.md): DHCP đổi IP sau tắt/bật → etcd
#   # bind fail → cả cluster sập. Đọc cảnh báo đầu playbooks/02b-pin-static-ip.yml trước khi bật
#   # (không đụng DHCP server, chỉ đổi phía VM — vẫn còn rủi ro nhỏ nếu DHCP server cấp lại IP này).
#   # 6 (2026-07-28, xem BUG-AND-DEBUG.md): hub cũng là RKE2 cluster join Rancher như mọi cluster
#   # khác + cũng có 2 NIC (net0 VLAN108 + net1 storage) — CẦN manifest CoreDNS/Calico + node-ip
#   # y hệt, ví dụ cũ thiếu "6" ở đây là 1 khoảng trống thật (không phải cố ý), đã bổ sung.
#
#   ansible-playbook -i inventories/production/hosts.ini -i .hosts_hub-project-x.ini \
#     playbooks/13-data-collector-hub.yml -e @.secrets-test -e "cluster_name=hub-project-x" \
#     -e "new_hub_es_password=<password thật>" -e "new_hub_grafana_password=<password thật>"
#
# Lưu ý -i thứ 2 BẮT BUỘC: playbook này chạy RIÊNG lệnh với site.yml ở trên — group cp_nodes
# (add_host in-memory từ play 02) KHÔNG còn sau khi tiến trình ansible-playbook trước đó thoát,
# phải nạp lại qua chính file .hosts_<cluster_name>.ini mà play 02 đã ghi ra đĩa cho đúng mục đích
# này (xem comment đầu playbooks/02-discover-ips.yml).
#
# new_hub_es_password/new_hub_grafana_password: mặc định "123456"/"123" (convention lab cũ) — TỰ
# TRUYỀN qua -e nếu cần password thật khác cho hub production.
#
# Sau khi hub mới lên xong: TỰ THÊM 1 entry mới vào hub_instances (vars/hub.yml — host=IP VM vừa
# tạo, target_node đã ghim, port 30900/30920) + password thật vào
# vault_hub_instances.<tên>.es_password (vault.yml/.secrets-test) để cluster khác dùng được hub
# này qua hub_instance=<tên> — giống cách 05-rancher-setup.yml nhắc đăng ký Rancher mới, KHÔNG tự
# động (hub mới là ephemeral trong phạm vi lần chạy này).
---
- name: Preflight — nạp vm_status, xác nhận hub single-node
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/cluster.yml
  tasks:
    - name: Fail nếu thiếu cluster_name
      ansible.builtin.fail:
        msg: "Bắt buộc -e cluster_name=<tên hub> (đúng tên đã dùng lúc chạy site.yml tạo VM hub)."
      when: cluster_name is not defined or cluster_name | length == 0

    - name: Nạp vm_status (.vmstatus_<cluster>.json — cần vmid/target cho play Firewall)
      ansible.builtin.set_fact:
        vm_status: "{{ lookup('file', playbook_dir + '/../.vmstatus_' + cluster_name + '.json') | from_json }}"

    - name: Fail nếu KHÔNG đúng 1 VM role=cp (hub phải single-node)
      ansible.builtin.fail:
        msg: >-
          playbooks/13-data-collector-hub.yml chỉ dành cho hub single-node (1 VM role "cp").
          .vmstatus_{{ cluster_name }}.json hiện có {{ vm_status | length }} VM — kiểm tra lại
          cluster_nodes lúc tạo VM (site.yml play 01), hoặc cluster_name có đang trỏ nhầm sang 1
          cluster nhiều node khác không.
      when: vm_status | length != 1 or vm_status[0].role != 'cp'

    - name: Set fact vmid/node thật của hub (dùng ở play Firewall)
      ansible.builtin.set_fact:
        hub_vmid: "{{ vm_status[0].vmid }}"
        hub_pve_node: "{{ vm_status[0].target }}"

    # Port NodePort (2026-07-22) — trước hardcode thẳng 30900/30920/30300/30601 trong helm/patch/
    # firewall bên dưới; giờ tự default về đúng giá trị cũ nhưng override được qua -e nếu hạ tầng
    # khác cần port khác (VD tránh trùng NodePort với dịch vụ có sẵn). Idiom "var | default(X)" tự
    # nhận giá trị từ -e nếu người chạy có truyền, không thì dùng default X.
    - name: Set fact port NodePort cho hub (override qua -e nếu cần, mặc định giữ nguyên 30900/30920/30300/30601)
      ansible.builtin.set_fact:
        hub_metrics_nodeport: "{{ new_hub_metrics_port | default(30900) }}"
        hub_logs_nodeport: "{{ new_hub_logs_port | default(30920) }}"
        hub_grafana_nodeport: "{{ new_hub_grafana_port | default(30300) }}"
        hub_kibana_nodeport: "{{ new_hub_kibana_port | default(30601) }}"

    - name: Fail nếu group cp_nodes rỗng (thiếu -i .hosts_<cluster>.ini khi gọi playbook này)
      ansible.builtin.fail:
        msg: >-
          Group 'cp_nodes' rỗng — thiếu inventory từ .hosts_{{ cluster_name }}.ini. Chạy lại kèm
          "-i inventories/production/hosts.ini -i .hosts_{{ cluster_name }}.ini" (xem comment đầu
          file playbook này).
      when: groups['cp_nodes'] is not defined or groups['cp_nodes'] | length == 0

# --- Mục 4: Prometheus remote-write receiver (kube-prometheus-stack, release "data-collector-hub") ---
- name: "[Mục 4] Cài kube-prometheus-stack — remote-write receiver"
  hosts: cp_nodes
  gather_facts: false
  become: true
  vars_files:
    - ../vars/hub.yml
  environment:
    KUBECONFIG: "{{ rke2_kubeconfig }}"
    # Hardcode PATH chuẩn, KHÔNG dùng ansible_env (undefined khi run_only cô lập play này — xem
    # BUG-AND-DEBUG.md "helm not found" 2026-08-18, chi tiết ở 08-ceph-csi.yml).
    PATH: "{{ rke2_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: Helm repo add prometheus-community
      ansible.builtin.command:
        cmd: "helm repo add {{ helm_repos_hub.prometheus_community.name }} {{ helm_repos_hub.prometheus_community.url }}"
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when:
        - repo_add.rc != 0
        - "'already exists' not in repo_add.stderr"

    - name: Helm repo update
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    - name: helm install kube-prometheus-stack (release data-collector-hub, remote-write receiver)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install data-collector-hub {{ kube_prometheus_stack_chart }}
          --namespace observability --create-namespace
          --set prometheus.prometheusSpec.enableRemoteWriteReceiver=true
          --set prometheus.prometheusSpec.retention=30d
          --set prometheus.prometheusSpec.retentionSize=100GB
          --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.storageClassName=csi-rbd-sc
          --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage=100Gi
          --set prometheus.service.type=NodePort
          --set prometheus.service.nodePort={{ hostvars['localhost'].hub_metrics_nodeport }}
          --set-string grafana.adminPassword={{ new_hub_grafana_password | default('changeme') }}
      register: kps_install
      changed_when: "'STATUS: deployed' in kps_install.stdout"

    - name: Chờ pod observability Ready (kube-prometheus-stack — retry theo timeout_es, đủ rộng cho image pull)
      ansible.builtin.shell:
        cmd: "kubectl -n observability get pods --no-headers | grep -v Running | grep -v Completed | wc -l"
      register: kps_pods
      changed_when: false
      retries: "{{ (timeout_es / 15) | int }}"
      delay: 15
      until: kps_pods.stdout | int == 0

    - name: Verify Prometheus remote-write receiver sống (200 /-/ready, 405 GET /api/v1/write)
      ansible.builtin.uri:
        url: "http://localhost:{{ hostvars['localhost'].hub_metrics_nodeport }}/{{ item.path }}"
        method: GET
        status_code: "{{ item.expect }}"
      loop:
        - { path: "-/ready", expect: 200 }
        - { path: "api/v1/write", expect: 405 }
      loop_control:
        label: "{{ item.path }}"

# --- Mục 5: Elasticsearch + Kibana — password CỐ ĐỊNH ngay từ đầu (Secret tạo TRƯỚC helm install,
# đúng TODO đã ghi trong data-collector-hub-setup.md — không cần đổi tay sau như lần chạy đầu). ---
- name: "[Mục 5] Cài Elasticsearch + Kibana — password cố định trước khi helm install"
  hosts: cp_nodes
  gather_facts: false
  become: true
  vars_files:
    - ../vars/versions.yml
  environment:
    KUBECONFIG: "{{ rke2_kubeconfig }}"
    # Hardcode PATH chuẩn, KHÔNG dùng ansible_env (undefined khi run_only cô lập play này — xem
    # BUG-AND-DEBUG.md "helm not found" 2026-08-18, chi tiết ở 08-ceph-csi.yml).
    PATH: "{{ rke2_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: Helm repo add elastic
      ansible.builtin.command:
        cmd: "helm repo add {{ helm_repos.elastic.name }} {{ helm_repos.elastic.url }}"
      register: repo_add_elastic
      changed_when: "'has been added' in repo_add_elastic.stdout"
      failed_when:
        - repo_add_elastic.rc != 0
        - "'already exists' not in repo_add_elastic.stderr"

    - name: Helm repo update
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    - name: Tạo Secret elasticsearch-master-credentials TRƯỚC khi cài (idempotent — bỏ qua nếu đã có)
      ansible.builtin.command:
        cmd: >
          kubectl create secret generic elasticsearch-master-credentials -n observability
          --from-literal=username=elastic
          --from-literal=password={{ new_hub_es_password | default('changeme') }}
      register: es_secret
      changed_when: "'created' in es_secret.stdout"
      failed_when:
        - es_secret.rc != 0
        - "'AlreadyExists' not in es_secret.stderr"

    - name: helm install elasticsearch (namespace observability, NodePort configurable)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install elasticsearch {{ elasticsearch_chart }}
          --namespace observability
          --set replicas=1 --set minimumMasterNodes=1
          --set resources.requests.memory=1Gi --set resources.limits.memory=4Gi
          --set volumeClaimTemplate.storageClassName=csi-rbd-sc
          --set volumeClaimTemplate.resources.requests.storage=100Gi
          --set sysctlInitContainer.enabled=false
          --set service.type=NodePort --set service.nodePort={{ hostvars['localhost'].hub_logs_nodeport }}
      register: es_install
      changed_when: "'STATUS: deployed' in es_install.stdout"

    # --- Bug #7 (2026-07-30, data-collector-hub-setup.md) — readiness của chart elastic/elasticsearch
    # chỉ đòi wait_for_status=green ĐÚNG 1 LẦN (đánh dấu qua file /tmp/.es_start_file, KHÔNG sống
    # sót qua container restart). Cluster 1 node không bao giờ lên green nếu có bất kỳ index nào
    # rep>=1 (kể cả index hệ thống Kibana tự tạo, rep=1 mặc định) — sau 1 lần restart bất kỳ (crash,
    # OOM, node reboot), probe thi lại từ đầu và kẹt yellow-forever, pod 0/1 mãi mãi. Tạo TRƯỚC 1
    # index template default để MỌI index log tương lai (fluent-bit) tự sinh với auto_expand_replicas
    # — tự thích nghi theo số node thật, không cần sửa tay khi hub scale thêm node sau này. Dùng
    # kubectl exec (KHÔNG qua NodePort/Service) vì Service không route tới pod chưa Ready — bypass
    # đúng vòng luẩn quẩn "cần ES trả lời để fix, nhưng ES chưa Ready nên Service chưa route".
    - name: Chờ ES container tự trả lời (qua kubectl exec, bypass Service/Ready-gate)
      ansible.builtin.command:
        cmd: >
          kubectl exec -n observability elasticsearch-master-0 --
          curl -k -s -o /dev/null -w "%{http_code}"
          -u "elastic:{{ new_hub_es_password | default('changeme') }}"
          https://127.0.0.1:9200/
      register: es_internal
      changed_when: false
      retries: "{{ (timeout_es / 15) | int }}"
      delay: 15
      until: es_internal.stdout == "200"

    # Cùng 1 template gánh 2 fix (Bug #7 auto_expand_replicas + Bug #8/mapper_parsing_exception
    # 2026-08-18, xem BUG-AND-DEBUG.md) — composable index template chỉ chọn ĐÚNG 1 cái theo
    # priority cao nhất cho mỗi index mới, không gộp nhiều template độc lập cùng match "k8s-*".
    # 10-logging.yml PUT lại đúng template này (cùng tên, cùng nội dung) mỗi lần cluster mới join —
    # idempotent, không tạo template tên khác dù có vẻ "chỉ liên quan tới logging".
    - name: Tạo index template mặc định cho index log tương lai (pattern k8s-*) — auto_expand_replicas + labels/annotations flattened
      ansible.builtin.command:
        cmd: >
          kubectl exec -n observability elasticsearch-master-0 --
          curl -k -s -u "elastic:{{ new_hub_es_password | default('changeme') }}"
          -X PUT https://127.0.0.1:9200/_index_template/k8s-logs-auto-replica
          -H "Content-Type: application/json"
          -d '{"index_patterns":["k8s-*"],"priority":100,"template":{"settings":{"index.auto_expand_replicas":"0-1"},"mappings":{"properties":{"kubernetes":{"properties":{"labels":{"type":"flattened"},"annotations":{"type":"flattened"}}}}}}}'
      register: es_template
      changed_when: "'\"acknowledged\":true' in es_template.stdout"
      failed_when: "'\"acknowledged\":true' not in es_template.stdout"

    - name: Chờ elasticsearch-master Ready
      ansible.builtin.shell:
        cmd: "kubectl -n observability get pods -l app=elasticsearch-master --no-headers | grep -v Running | wc -l"
      register: es_pods
      changed_when: false
      retries: "{{ (timeout_es / 15) | int }}"
      delay: 15
      until: es_pods.stdout | int == 0

    - name: helm install kibana (namespace observability)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install kibana {{ kibana_chart }}
          --namespace observability
          --set elasticsearchHosts=https://elasticsearch-master:9200
          --set resources.requests.memory=256Mi --set resources.limits.memory=1Gi
      register: kibana_install
      changed_when: "'STATUS: deployed' in kibana_install.stdout"

    - name: Chờ kibana Ready
      ansible.builtin.shell:
        cmd: "kubectl -n observability get pods -l app=kibana --no-headers | grep -v Running | wc -l"
      register: kibana_pods
      changed_when: false
      retries: 20
      delay: 15
      until: kibana_pods.stdout | int == 0

    # Bug #7 (tiếp) — Kibana tự tạo vài index hệ thống (.lists-default-*, .items-default-*, tính
    # năng Security Solution Lists, 0 document, KHÔNG liên quan log thật) ngay lần khởi động đầu
    # tiên, mặc định rep=1 — trên cluster 1 node, 2 shard replica này KHÔNG BAO GIỜ gán được →
    # cluster kẹt yellow. Bình thường vô hại (chỉ mất `wait_for_status=green` MỘT LẦN lúc bootstrap,
    # xem comment Bug #7 ở task ES phía trên) nhưng quét ngay ở đây để ES đạt green thật ngay từ đầu,
    # tránh phải tự debug lại y hệt sau lần restart đầu tiên của hub. Idempotent — an toàn chạy lại,
    # `ignore_errors` vì pattern có thể không match nếu Kibana chưa kịp tạo index (không chặn pipeline).
    - name: Sweep auto_expand_replicas cho index hệ thống Kibana (.lists-default*/.items-default*)
      ansible.builtin.command:
        cmd: >
          kubectl exec -n observability elasticsearch-master-0 --
          curl -k -s -u "elastic:{{ new_hub_es_password | default('changeme') }}"
          -X PUT "https://127.0.0.1:9200/.lists-default*,.items-default*/_settings"
          -H "Content-Type: application/json"
          -d '{"index.auto_expand_replicas":"0-1"}'
      register: kibana_idx_sweep
      changed_when: "'\"acknowledged\":true' in kibana_idx_sweep.stdout"
      failed_when: false
      ignore_errors: true

    - name: Verify ES cluster health qua NodePort (basic-auth elastic/<password>)
      ansible.builtin.uri:
        url: "https://localhost:{{ hostvars['localhost'].hub_logs_nodeport }}/_cluster/health"
        method: GET
        user: "elastic"
        password: "{{ new_hub_es_password | default('changeme') }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: es_health
      retries: 10
      delay: 15
      until: es_health.status == 200

# --- NodePort Grafana + Kibana (patch service — mặc định chỉ ClusterIP sau khi cài) ---
- name: "[Mục 6 bonus] NodePort Grafana + Kibana (port configurable qua new_hub_grafana_port/new_hub_kibana_port)"
  hosts: cp_nodes
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: "{{ rke2_kubeconfig }}"
    # Hardcode PATH chuẩn, KHÔNG dùng ansible_env (undefined khi run_only cô lập play này — xem
    # BUG-AND-DEBUG.md "helm not found" 2026-08-18, chi tiết ở 08-ceph-csi.yml).
    PATH: "{{ rke2_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: Patch Grafana service → NodePort
      ansible.builtin.command:
        cmd: >
          kubectl patch svc data-collector-hub-grafana -n observability
          -p '{"spec":{"type":"NodePort","ports":[{"port":80,"targetPort":3000,"nodePort":{{ hostvars['localhost'].hub_grafana_nodeport }}}]}}'
      register: grafana_patch
      changed_when: "'patched' in grafana_patch.stdout"

    - name: Patch Kibana service → NodePort
      ansible.builtin.command:
        cmd: >
          kubectl patch svc kibana-kibana -n observability
          -p '{"spec":{"type":"NodePort","ports":[{"port":5601,"targetPort":5601,"nodePort":{{ hostvars['localhost'].hub_kibana_nodeport }}}]}}'
      register: kibana_patch
      changed_when: "'patched' in kibana_patch.stdout"

# --- Mục 6: Proxmox VE Firewall — CHỈ cấp VM (/nodes/{node}/qemu/{vmid}/firewall/...). TUYỆT ĐỐI
# KHÔNG đụng /cluster/firewall/... (Datacenter) hay /nodes/{node}/firewall/... (Node) — bài học sự
# cố khoá cả Proxmox host cũ, xem data-collector-hub-setup.md Mục 6 (cảnh báo 🚨 đầu mục). ---
- name: "[Mục 6] Proxmox VE Firewall — chỉ mở 22/30300/30601/30900/30920 từ VLAN 108"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/proxmox.yml
    - ../vars/network.yml
  vars:
    proxmox_api_url: "https://{{ proxmox_api_host }}:{{ proxmox_api_port }}/api2/json"
    api_headers:
      Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    hub_fw_ports: >-
      {{ [22, hostvars['localhost'].hub_grafana_nodeport, hostvars['localhost'].hub_kibana_nodeport,
          hostvars['localhost'].hub_metrics_nodeport, hostvars['localhost'].hub_logs_nodeport] }}
  tasks:
    - name: Bật VM Firewall (option enable=1) — chỉ cấp VM
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ hostvars['localhost'].hub_pve_node }}/qemu/{{ hostvars['localhost'].hub_vmid }}/firewall/options"
        method: PUT
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        body_format: form-urlencoded
        body: { enable: 1 }
        status_code: [200]

    - name: Lấy danh sách rule firewall hiện tại (idempotent check trước khi thêm)
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ hostvars['localhost'].hub_pve_node }}/qemu/{{ hostvars['localhost'].hub_vmid }}/firewall/rules"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
      register: hub_fw_rules

    - name: Thêm rule ACCEPT cho từng port cần thiết (bỏ qua nếu đã tồn tại đúng dport+source)
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ hostvars['localhost'].hub_pve_node }}/qemu/{{ hostvars['localhost'].hub_vmid }}/firewall/rules"
        method: POST
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        body_format: form-urlencoded
        body:
          type: "in"
          action: "ACCEPT"
          proto: "tcp"
          source: "{{ net_vlan_vm.cidr }}"
          dport: "{{ item }}"
          comment: "Ansible managed — playbooks/13-data-collector-hub.yml"
        status_code: [200]
      loop: "{{ hub_fw_ports }}"
      when: >-
        (hub_fw_rules.json.data
         | selectattr('type', 'equalto', 'in') | selectattr('action', 'equalto', 'ACCEPT')
         | selectattr('dport', 'defined') | selectattr('dport', 'equalto', item | string)
         | selectattr('source', 'defined') | selectattr('source', 'equalto', net_vlan_vm.cidr)
         | list | length) == 0

    - name: Thêm rule DROP cuối cùng (catch-all) — bỏ qua nếu đã có
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ hostvars['localhost'].hub_pve_node }}/qemu/{{ hostvars['localhost'].hub_vmid }}/firewall/rules"
        method: POST
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        body_format: form-urlencoded
        body:
          type: "in"
          action: "DROP"
          comment: "Ansible managed — catch-all, playbooks/13-data-collector-hub.yml"
        status_code: [200]
      when: >-
        (hub_fw_rules.json.data
         | selectattr('type', 'equalto', 'in') | selectattr('action', 'equalto', 'DROP')
         | rejectattr('dport', 'defined') | rejectattr('source', 'defined')
         | list | length) == 0

    - name: Báo hoàn tất + URL truy cập + nhắc đăng ký hub mới
      ansible.builtin.debug:
        msg:
          - >-
            Hub '{{ cluster_name }}' đã cài xong: Prometheus :{{ hostvars['localhost'].hub_metrics_nodeport }},
            Grafana :{{ hostvars['localhost'].hub_grafana_nodeport }}, Kibana :{{ hostvars['localhost'].hub_kibana_nodeport }},
            ES :{{ hostvars['localhost'].hub_logs_nodeport }} (IP xem .hosts_{{ cluster_name }}.ini)
          - "TỰ THÊM entry mới vào hub_instances (vars/hub.yml — host/target_node) + password thật vào vault_hub_instances.{{ cluster_name }}.es_password (vault.yml/.secrets-test) để cluster khác dùng được hub này qua hub_instance={{ cluster_name }}."
