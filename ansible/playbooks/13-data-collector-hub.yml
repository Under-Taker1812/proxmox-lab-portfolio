# 13-data-collector-hub.yml — Creates a NEW data-collector hub (see
# ../../docs/08-observability-hub.md for the design): a Prometheus remote-write receiver,
# Elasticsearch + Kibana (with a FIXED password set from the start, not patched in after the fact
# like the very first hand-built hub), NodePort Grafana/Kibana, and Proxmox VE Firewall rules
# (VM-level ONLY).
#
# ONLY use this to create a NEW hub (e.g. for a different project) — the current hub
# (`hub_instances.default`, see vars/hub.yml) was hand-built and this playbook is NOT safe to
# re-run against it (not idempotent against a stack that was partially set up by hand with a
# different convention).
#
# A hub is really just a normal single-node RKE2 cluster (role "cp", no worker needed) — it REUSES
# site.yml's existing 01→02→03→04→07→08 plays to create the VM + join Rancher + set up Ceph CSI,
# nothing is duplicated. This playbook only contains what's genuinely new for a hub, and runs AFTER
# that cluster is already Ready:
#
#   ansible-playbook site.yml -e @.secrets-test -e "cluster_name=hub-project-x" \
#     -e 'cluster_nodes=[{role:"cp",ram:16384,cpu:16,disk:150,type:"general",target_node:"proxmox-2",pin_static_ip:true}]' \
#     -e "run_only=[1,3,4,6,7,8]"   # skip 9/10 (a hub doesn't ship metrics/logs to itself)
#   # pin_static_ip:true (strongly recommended for a hub) — converts the DHCP IP to static right at
#   # creation, avoiding the exact failure mode covered in playbooks/02b-pin-static-ip.yml: a DHCP
#   # IP change after a reboot breaking etcd's bind address and taking down the whole node. Read the
#   # warning at the top of that playbook before enabling it (it only changes the VM side, not the
#   # DHCP server — a small residual risk remains if the server reassigns the same IP elsewhere).
#   # A hub is an RKE2 cluster joining Rancher exactly like any other cluster, and also has two NICs
#   # (workload + storage) — it needs the same CoreDNS/Calico manifests + node-ip pinning as any
#   # other cluster (play 6, included in run_only above).
#
#   ansible-playbook -i inventories/production/hosts.ini -i .hosts_hub-project-x.ini \
#     playbooks/13-data-collector-hub.yml -e @.secrets-test -e "cluster_name=hub-project-x" \
#     -e "new_hub_es_password=<real password>" -e "new_hub_grafana_password=<real password>"
#
# The second -i is MANDATORY: this playbook runs as a SEPARATE ansible-playbook invocation from the
# site.yml run above — the cp_nodes group (built in-memory by play 02's add_host) does not survive
# past that earlier process exiting, so it has to be reloaded from the .hosts_<cluster_name>.ini
# file that play 02 wrote to disk for exactly this purpose (see the note at the top of
# playbooks/02-discover-ips.yml).
#
# new_hub_es_password/new_hub_grafana_password: default to placeholder values if not passed — ALWAYS
# pass real ones via -e for anything beyond a throwaway lab hub.
#
# After a new hub is up: manually add a new entry to hub_instances (vars/hub.yml — host = the new
# VM's IP, its pinned target_node, ports 30900/30920) plus the real password under
# vault_hub_instances.<name>.es_password (vault.yml/.secrets-test) so other clusters can use this hub
# via hub_instance=<name> — the same manual-registration pattern 05-rancher-setup.yml uses for a
# freshly created Rancher instance (a new hub is ephemeral within this run's scope, nothing is
# registered automatically).
---
- name: "Preflight — load vm_status, confirm the hub is single-node"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/cluster.yml
  tasks:
    - name: Fail if cluster_name is missing
      ansible.builtin.fail:
        msg: "-e cluster_name=<hub name> is required (must match the name used when site.yml created the VM)."
      when: cluster_name is not defined or cluster_name | length == 0

    - name: Load vm_status (.vmstatus_<cluster>.json — needed for the vmid/target used by the Firewall play)
      ansible.builtin.set_fact:
        vm_status: "{{ lookup('file', playbook_dir + '/../.vmstatus_' + cluster_name + '.json') | from_json }}"

    - name: Fail unless there's exactly one role=cp VM (a hub must be single-node)
      ansible.builtin.fail:
        msg: >-
          playbooks/13-data-collector-hub.yml is only for a single-node hub (one role "cp" VM).
          .vmstatus_{{ cluster_name }}.json currently has {{ vm_status | length }} VM(s) — check
          cluster_nodes from when the VM was created (site.yml play 01), or whether cluster_name is
          accidentally pointing at a different, multi-node cluster.
      when: vm_status | length != 1 or vm_status[0].role != 'cp'

    - name: Set the hub's real vmid/node facts (used by the Firewall play)
      ansible.builtin.set_fact:
        hub_vmid: "{{ vm_status[0].vmid }}"
        hub_pve_node: "{{ vm_status[0].target }}"

    # NodePort values default to their original hardcoded numbers but are overridable via -e (e.g.
    # to avoid colliding with a NodePort already in use elsewhere). The "var | default(X)" idiom
    # picks up whatever the caller passed via -e, or falls back to X.
    - name: Set the hub's NodePort facts (override via -e if needed; defaults to 30900/30920/30300/30601)
      ansible.builtin.set_fact:
        hub_metrics_nodeport: "{{ new_hub_metrics_port | default(30900) }}"
        hub_logs_nodeport: "{{ new_hub_logs_port | default(30920) }}"
        hub_grafana_nodeport: "{{ new_hub_grafana_port | default(30300) }}"
        hub_kibana_nodeport: "{{ new_hub_kibana_port | default(30601) }}"

    - name: Fail if the cp_nodes group is empty (missing -i .hosts_<cluster>.ini when invoking this playbook)
      ansible.builtin.fail:
        msg: >-
          The 'cp_nodes' group is empty — missing the inventory from .hosts_{{ cluster_name }}.ini.
          Re-run with "-i inventories/production/hosts.ini -i .hosts_{{ cluster_name }}.ini" (see
          the note at the top of this playbook).
      when: groups['cp_nodes'] is not defined or groups['cp_nodes'] | length == 0

# --- Prometheus remote-write receiver (kube-prometheus-stack, release "data-collector-hub") ---
- name: "Install kube-prometheus-stack — the remote-write receiver"
  hosts: cp_nodes
  gather_facts: false
  become: true
  vars_files:
    - ../vars/hub.yml
  environment:
    KUBECONFIG: "{{ rke2_kubeconfig }}"
    # Hardcoded standard PATH, not ansible_env — undefined when run_only isolates this play (see
    # "A PATH that only worked by accident of execution order" in ../TROUBLESHOOTING.md, same bug
    # detailed in 08-ceph-csi.yml).
    PATH: "{{ rke2_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: helm repo add prometheus-community
      ansible.builtin.command:
        cmd: "helm repo add {{ helm_repos_hub.prometheus_community.name }} {{ helm_repos_hub.prometheus_community.url }}"
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when:
        - repo_add.rc != 0
        - "'already exists' not in repo_add.stderr"

    - name: helm repo update
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    - name: helm install kube-prometheus-stack (release data-collector-hub, remote-write receiver enabled)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install data-collector-hub {{ kube_prometheus_stack_chart }}
          --namespace observability --create-namespace
          --set prometheus.prometheusSpec.enableRemoteWriteReceiver=true
          --set prometheus.prometheusSpec.retention=30d
          --set prometheus.prometheusSpec.retentionSize=100GB
          --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.storageClassName=csi-rbd-sc
          --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage=100Gi
          --set prometheus.service.type=NodePort
          --set prometheus.service.nodePort={{ hostvars['localhost'].hub_metrics_nodeport }}
          --set-string grafana.adminPassword={{ new_hub_grafana_password | default('changeme') }}
      register: kps_install
      changed_when: "'STATUS: deployed' in kps_install.stdout"

    - name: "Wait for the observability pods to be Ready (kube-prometheus-stack — retries scale with timeout_es, generous enough for image pulls)"
      ansible.builtin.shell:
        cmd: "kubectl -n observability get pods --no-headers | grep -v Running | grep -v Completed | wc -l"
      register: kps_pods
      changed_when: false
      retries: "{{ (timeout_es / 15) | int }}"
      delay: 15
      until: kps_pods.stdout | int == 0

    - name: Verify the Prometheus remote-write receiver is alive (200 on /-/ready, 405 on GET /api/v1/write)
      ansible.builtin.uri:
        url: "http://localhost:{{ hostvars['localhost'].hub_metrics_nodeport }}/{{ item.path }}"
        method: GET
        status_code: "{{ item.expect }}"
      loop:
        - { path: "-/ready", expect: 200 }
        - { path: "api/v1/write", expect: 405 }
      loop_control:
        label: "{{ item.path }}"

# --- Elasticsearch + Kibana — the credentials Secret is created BEFORE the Helm install, so the
# password is fixed from the very first boot instead of being patched in by hand afterward (as it
# was on the very first, hand-built version of this hub). ---
- name: "Install Elasticsearch + Kibana — password fixed before the Helm install"
  hosts: cp_nodes
  gather_facts: false
  become: true
  vars_files:
    - ../vars/versions.yml
  environment:
    KUBECONFIG: "{{ rke2_kubeconfig }}"
    # Hardcoded standard PATH, not ansible_env — undefined when run_only isolates this play (see
    # "A PATH that only worked by accident of execution order" in ../TROUBLESHOOTING.md, same bug
    # detailed in 08-ceph-csi.yml).
    PATH: "{{ rke2_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: helm repo add elastic
      ansible.builtin.command:
        cmd: "helm repo add {{ helm_repos.elastic.name }} {{ helm_repos.elastic.url }}"
      register: repo_add_elastic
      changed_when: "'has been added' in repo_add_elastic.stdout"
      failed_when:
        - repo_add_elastic.rc != 0
        - "'already exists' not in repo_add_elastic.stderr"

    - name: helm repo update
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    - name: Create the elasticsearch-master-credentials Secret BEFORE installing (idempotent — skipped if it already exists)
      ansible.builtin.command:
        cmd: >
          kubectl create secret generic elasticsearch-master-credentials -n observability
          --from-literal=username=elastic
          --from-literal=password={{ new_hub_es_password | default('changeme') }}
      register: es_secret
      changed_when: "'created' in es_secret.stdout"
      failed_when:
        - es_secret.rc != 0
        - "'AlreadyExists' not in es_secret.stderr"

    - name: helm install elasticsearch (observability namespace, configurable NodePort)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install elasticsearch {{ elasticsearch_chart }}
          --namespace observability
          --set replicas=1 --set minimumMasterNodes=1
          --set resources.requests.memory=1Gi --set resources.limits.memory=4Gi
          --set volumeClaimTemplate.storageClassName=csi-rbd-sc
          --set volumeClaimTemplate.resources.requests.storage=100Gi
          --set sysctlInitContainer.enabled=false
          --set service.type=NodePort --set service.nodePort={{ hostvars['localhost'].hub_logs_nodeport }}
      register: es_install
      changed_when: "'STATUS: deployed' in es_install.stdout"

    # The elastic/elasticsearch chart's own readiness gate only ever requires wait_for_status=green
    # ONCE (tracked via a marker file inside the container that does NOT survive a restart). A
    # single-node cluster can never reach green if ANY index has replicas>=1 (including Kibana's own
    # system indices, which default to replicas=1) — so after any restart (crash, OOM, node reboot),
    # the probe re-runs from scratch and gets stuck yellow-forever, with the pod stuck at 0/1
    # indefinitely. Fixed by creating a default index template FIRST, so every future log index
    # (from fluent-bit) is created with auto_expand_replicas — which adapts automatically to however
    # many nodes actually exist, with no manual fix-up needed if the hub later scales to more nodes.
    # Uses kubectl exec (not the NodePort/Service) because the Service won't route to a pod that
    # isn't Ready yet — this sidesteps the exact chicken-and-egg problem of "need ES to answer in
    # order to fix it, but ES isn't Ready yet so the Service won't route to it."
    - name: Wait for the ES container to answer directly (via kubectl exec, bypassing the Service/Ready gate)
      ansible.builtin.command:
        cmd: >
          kubectl exec -n observability elasticsearch-master-0 --
          curl -k -s -o /dev/null -w "%{http_code}"
          -u "elastic:{{ new_hub_es_password | default('changeme') }}"
          https://127.0.0.1:9200/
      register: es_internal
      changed_when: false
      retries: "{{ (timeout_es / 15) | int }}"
      delay: 15
      until: es_internal.stdout == "200"

    # This one template carries two fixes at once (the auto_expand_replicas fix above, and a
    # mapper_parsing_exception fix for labels/annotations — see 10-logging.yml for the full story) —
    # a composable index template only lets exactly ONE template win by priority for each new index,
    # it never merges several independently matching "k8s-*" templates. 10-logging.yml re-applies
    # this exact same template (same name, same content) every time a new cluster joins — that's
    # idempotent by design, not a separate, logging-specific template despite the name suggesting it.
    - name: "Create the default index template for future log indices (pattern k8s-*) — auto_expand_replicas + flattened labels/annotations"
      ansible.builtin.command:
        cmd: >
          kubectl exec -n observability elasticsearch-master-0 --
          curl -k -s -u "elastic:{{ new_hub_es_password | default('changeme') }}"
          -X PUT https://127.0.0.1:9200/_index_template/k8s-logs-auto-replica
          -H "Content-Type: application/json"
          -d '{"index_patterns":["k8s-*"],"priority":100,"template":{"settings":{"index.auto_expand_replicas":"0-1"},"mappings":{"properties":{"kubernetes":{"properties":{"labels":{"type":"flattened"},"annotations":{"type":"flattened"}}}}}}}'
      register: es_template
      changed_when: "'\"acknowledged\":true' in es_template.stdout"
      failed_when: "'\"acknowledged\":true' not in es_template.stdout"

    - name: Wait for elasticsearch-master to be Ready
      ansible.builtin.shell:
        cmd: "kubectl -n observability get pods -l app=elasticsearch-master --no-headers | grep -v Running | wc -l"
      register: es_pods
      changed_when: false
      retries: "{{ (timeout_es / 15) | int }}"
      delay: 15
      until: es_pods.stdout | int == 0

    - name: helm install kibana (observability namespace)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install kibana {{ kibana_chart }}
          --namespace observability
          --set elasticsearchHosts=https://elasticsearch-master:9200
          --set resources.requests.memory=256Mi --set resources.limits.memory=1Gi
      register: kibana_install
      changed_when: "'STATUS: deployed' in kibana_install.stdout"

    - name: Wait for kibana to be Ready
      ansible.builtin.shell:
        cmd: "kubectl -n observability get pods -l app=kibana --no-headers | grep -v Running | wc -l"
      register: kibana_pods
      changed_when: false
      retries: 20
      delay: 15
      until: kibana_pods.stdout | int == 0

    # Kibana creates a few of its own system indices on first startup (.lists-default-*,
    # .items-default-*, part of the Security Solution Lists feature — 0 documents, unrelated to real
    # log data), defaulting to replicas=1. On a single-node cluster those two replica shards can
    # NEVER be assigned, keeping the cluster stuck yellow. Normally harmless (it only costs the
    # ONE-TIME wait_for_status=green at bootstrap described above), but swept here anyway so the
    # cluster reaches a genuine green immediately instead of needing the same debugging again after
    # the hub's first restart. Idempotent — safe to re-run; `ignore_errors` because the pattern may
    # not match yet if Kibana hasn't created its indices, which shouldn't block the rest of the run.
    - name: Sweep auto_expand_replicas onto Kibana's system indices (.lists-default*/.items-default*)
      ansible.builtin.command:
        cmd: >
          kubectl exec -n observability elasticsearch-master-0 --
          curl -k -s -u "elastic:{{ new_hub_es_password | default('changeme') }}"
          -X PUT "https://127.0.0.1:9200/.lists-default*,.items-default*/_settings"
          -H "Content-Type: application/json"
          -d '{"index.auto_expand_replicas":"0-1"}'
      register: kibana_idx_sweep
      changed_when: "'\"acknowledged\":true' in kibana_idx_sweep.stdout"
      failed_when: false
      ignore_errors: true

    - name: Verify ES cluster health through the NodePort (basic auth, elastic/<password>)
      ansible.builtin.uri:
        url: "https://localhost:{{ hostvars['localhost'].hub_logs_nodeport }}/_cluster/health"
        method: GET
        user: "elastic"
        password: "{{ new_hub_es_password | default('changeme') }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: es_health
      retries: 10
      delay: 15
      until: es_health.status == 200

# --- NodePort for Grafana + Kibana (both charts default to ClusterIP-only after install) ---
- name: "NodePort for Grafana + Kibana (ports configurable via new_hub_grafana_port/new_hub_kibana_port)"
  hosts: cp_nodes
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: "{{ rke2_kubeconfig }}"
    # Hardcoded standard PATH, not ansible_env — undefined when run_only isolates this play (see
    # "A PATH that only worked by accident of execution order" in ../TROUBLESHOOTING.md, same bug
    # detailed in 08-ceph-csi.yml).
    PATH: "{{ rke2_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: Patch the Grafana service → NodePort
      ansible.builtin.command:
        cmd: >
          kubectl patch svc data-collector-hub-grafana -n observability
          -p '{"spec":{"type":"NodePort","ports":[{"port":80,"targetPort":3000,"nodePort":{{ hostvars['localhost'].hub_grafana_nodeport }}}]}}'
      register: grafana_patch
      changed_when: "'patched' in grafana_patch.stdout"

    - name: Patch the Kibana service → NodePort
      ansible.builtin.command:
        cmd: >
          kubectl patch svc kibana-kibana -n observability
          -p '{"spec":{"type":"NodePort","ports":[{"port":5601,"targetPort":5601,"nodePort":{{ hostvars['localhost'].hub_kibana_nodeport }}}]}}'
      register: kibana_patch
      changed_when: "'patched' in kibana_patch.stdout"

# --- Proxmox VE Firewall — VM-LEVEL ONLY (/nodes/{node}/qemu/{vmid}/firewall/...). NEVER touch
# /cluster/firewall/... (Datacenter level) or /nodes/{node}/firewall/... (Node level) here — a past
# incident with a Datacenter/Node-level firewall change locked the team out of the entire Proxmox
# host, not just one VM. Scoping every rule strictly to the VM level is a deliberate, hard boundary. ---
- name: "Proxmox VE Firewall — open only 22/30300/30601/30900/30920 from the workload VLAN"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/proxmox.yml
    - ../vars/network.yml
  vars:
    proxmox_api_url: "https://{{ proxmox_api_host }}:{{ proxmox_api_port }}/api2/json"
    api_headers:
      Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    hub_fw_ports: >-
      {{ [22, hostvars['localhost'].hub_grafana_nodeport, hostvars['localhost'].hub_kibana_nodeport,
          hostvars['localhost'].hub_metrics_nodeport, hostvars['localhost'].hub_logs_nodeport] }}
  tasks:
    - name: Enable the VM Firewall (option enable=1) — VM level only
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ hostvars['localhost'].hub_pve_node }}/qemu/{{ hostvars['localhost'].hub_vmid }}/firewall/options"
        method: PUT
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        body_format: form-urlencoded
        body: { enable: 1 }
        status_code: [200]

    - name: Fetch the current firewall rules (idempotency check before adding new ones)
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ hostvars['localhost'].hub_pve_node }}/qemu/{{ hostvars['localhost'].hub_vmid }}/firewall/rules"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
      register: hub_fw_rules

    - name: Add an ACCEPT rule for each required port (skipped if one already exists for this dport+source)
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ hostvars['localhost'].hub_pve_node }}/qemu/{{ hostvars['localhost'].hub_vmid }}/firewall/rules"
        method: POST
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        body_format: form-urlencoded
        body:
          type: "in"
          action: "ACCEPT"
          proto: "tcp"
          source: "{{ net_vlan_vm.cidr }}"
          dport: "{{ item }}"
          comment: "Ansible managed — playbooks/13-data-collector-hub.yml"
        status_code: [200]
      loop: "{{ hub_fw_ports }}"
      when: >-
        (hub_fw_rules.json.data
         | selectattr('type', 'equalto', 'in') | selectattr('action', 'equalto', 'ACCEPT')
         | selectattr('dport', 'defined') | selectattr('dport', 'equalto', item | string)
         | selectattr('source', 'defined') | selectattr('source', 'equalto', net_vlan_vm.cidr)
         | list | length) == 0

    - name: Add the final catch-all DROP rule (skipped if it already exists)
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ hostvars['localhost'].hub_pve_node }}/qemu/{{ hostvars['localhost'].hub_vmid }}/firewall/rules"
        method: POST
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        body_format: form-urlencoded
        body:
          type: "in"
          action: "DROP"
          comment: "Ansible managed — catch-all, playbooks/13-data-collector-hub.yml"
        status_code: [200]
      when: >-
        (hub_fw_rules.json.data
         | selectattr('type', 'equalto', 'in') | selectattr('action', 'equalto', 'DROP')
         | rejectattr('dport', 'defined') | rejectattr('source', 'defined')
         | list | length) == 0

    - name: Report completion + access URLs + a reminder to register the new hub
      ansible.builtin.debug:
        msg:
          - >-
            Hub '{{ cluster_name }}' is up: Prometheus on :{{ hostvars['localhost'].hub_metrics_nodeport }},
            Grafana on :{{ hostvars['localhost'].hub_grafana_nodeport }}, Kibana on :{{ hostvars['localhost'].hub_kibana_nodeport }},
            ES on :{{ hostvars['localhost'].hub_logs_nodeport }} (IP: see .hosts_{{ cluster_name }}.ini)
          - "Manually add a new entry to hub_instances (vars/hub.yml — host/target_node) plus the real password under vault_hub_instances.{{ cluster_name }}.es_password (vault.yml/.secrets-test) so other clusters can use this hub via hub_instance={{ cluster_name }}."
