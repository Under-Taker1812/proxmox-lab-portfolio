# 09-monitoring.yml — [new_cluster] A lightweight agent that ships metrics to the data-collector hub.
#
# Decision: dropped kube-prometheus-stack entirely (a full Prometheus/Grafana/Alertmanager per test
# cluster — expensive on RAM, unnecessary) in favor of node-exporter (DaemonSet, every node) +
# kube-state-metrics + vmagent, all remote_write'd to the central data-collector hub (see
# ../vars/hub.yml and ../../docs/08-observability-hub.md). This cluster stores no metrics locally.
#
# Decision: dropped pinning kube-state-metrics/vmagent to a dedicated "monitoring" node
# (nodeSelector monitoring=true) — the agents are already light enough (see hub_agent_values in
# vars/hub.yml) that a dedicated node isn't needed. Runs fine on a minimal 1-2 node cluster with no
# type=monitoring node at all.
#
# The cluster={{ cluster_name }} label is attached at the vmagent remote_write stage
# (templates/vmagent-values.yaml.j2), not on the receiving end — every metric arrives with its
# source label already attached, no runtime ConfigMap/env var needed (cluster_name is fixed at
# deploy time and Ansible already knows the value).
---
- name: Monitoring agent (ships metrics to the data-collector hub)
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  vars_files:
    - ../vars/cluster.yml
    - ../vars/hub.yml
  environment:
    KUBECONFIG: "{{ rke2_kubeconfig }}"
    # Hardcoded standard PATH, not ansible_env — undefined when run_only isolates this play (see
    # "A PATH that only worked by accident of execution order" in ../TROUBLESHOOTING.md, same bug
    # detailed in 08-ceph-csi.yml).
    PATH: "{{ rke2_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    # This playbook can run STANDALONE (outside site.yml, similar to how 02-discover-ips.yml
    # reloads its own state), so it can't just rely on site.yml's preflight validation.
    - name: Fail if hub_instance isn't in hub_instances
      ansible.builtin.fail:
        msg: >-
          hub_instance="{{ hub_instance }}" is not in hub_instances ({{ hub_instances.keys() | list }})
          — check deploy-config.yml, or add a new entry to vars/hub.yml (see README.md).
      when: hub_instance not in hub_instances

    - name: helm repo add prometheus-community + victoria-metrics
      ansible.builtin.command:
        cmd: "helm repo add {{ item.name }} {{ item.url }}"
      loop:
        - "{{ helm_repos_hub.prometheus_community }}"
        - "{{ helm_repos_hub.victoria_metrics }}"
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when:
        - repo_add.rc != 0
        - "'already exists' not in repo_add.stderr"

    - name: helm repo update
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    - name: helm install node-exporter (DaemonSet — every node, host metrics, no nodeSelector pin)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install node-exporter {{ node_exporter_chart }}
          --namespace monitoring --create-namespace
          --set resources.requests.memory={{ hub_agent_values.node_exporter_mem_request }}
          --set resources.limits.memory={{ hub_agent_values.node_exporter_mem_limit }}
      register: ne_install
      changed_when: "'STATUS: deployed' in ne_install.stdout"

    - name: helm install kube-state-metrics (no nodeSelector pin)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install kube-state-metrics {{ kube_state_metrics_chart }}
          --namespace monitoring
          --set resources.requests.memory={{ hub_agent_values.kube_state_metrics_mem_request }}
          --set resources.limits.memory={{ hub_agent_values.kube_state_metrics_mem_limit }}
      register: ksm_install
      changed_when: "'STATUS: deployed' in ksm_install.stdout"

    - name: "Render vmagent values (remote_write + external label cluster={{ cluster_name }})"
      ansible.builtin.template:
        src: ../templates/vmagent-values.yaml.j2
        dest: /root/vmagent-values.yaml
        mode: "0644"

    - name: helm install vmagent (remote_write to the hub, cluster label attached, no nodeSelector pin)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install vmagent {{ vmagent_chart }}
          --namespace monitoring
          -f /root/vmagent-values.yaml
      register: vma_install
      changed_when: "'STATUS: deployed' in vma_install.stdout"

    # The original check (`grep -v Running | wc -l`) was a false-pass check: a CrashLoopBackOff pod
    # flaps through "Running" between restarts and slips past it, and "0/1 Running" also contains
    # the word "Running" so it slips past too. Fixed by comparing each pod's own READY x/y count and
    # the node-exporter DaemonSet's DESIRED vs READY count, which also catches the case where a pod
    # was never even scheduled on some node.
    - name: Wait for the monitoring agents to be genuinely Ready (every pod's READY x/x + DaemonSet DESIRED==READY)
      ansible.builtin.shell:
        cmd: |
          total=$(kubectl -n monitoring get pods --no-headers 2>/dev/null | wc -l)
          badpod=$(kubectl -n monitoring get pods --no-headers 2>/dev/null | awk '$3!="Completed"{split($2,a,"/"); if(a[1]!=a[2]) c++} END{print c+0}')
          dsbad=$(kubectl -n monitoring get ds --no-headers 2>/dev/null | awk '$2!=$4 || $4==0 {c++} END{print c+0}')
          echo "pods=$total badpod=$badpod dsbad=$dsbad"
          [ "$total" -gt 0 ] && [ "$badpod" -eq 0 ] && [ "$dsbad" -eq 0 ]
      register: mon_pods
      changed_when: false
      retries: 30
      delay: 10
      until: mon_pods.rc == 0

    - name: Print vmagent's recent logs (a sanity check — real verification has to happen on the hub side)
      ansible.builtin.command:
        cmd: "kubectl -n monitoring logs -l app.kubernetes.io/name=vmagent --tail=30"
      register: vma_log
      changed_when: false
      failed_when: false

    - name: Show vmagent's logs
      ansible.builtin.debug:
        msg: "{{ vma_log.stdout_lines }}"

    - name: Reminder to verify for real (cross-cluster — can't be automated from this playbook)
      ansible.builtin.debug:
        msg: >-
          Final verification has to be done BY HAND on the data-collector hub: open the hub's
          Grafana/Prometheus (http://{{ hub_host }}:{{ hub_metrics_port }}) and check that a series
          with the label cluster="{{ cluster_name }}" is showing up. This playbook can only verify
          that the pods are Ready and not crashing — it can't confirm the data actually reached the
          hub (that spans two different clusters, outside what one playbook can check).
