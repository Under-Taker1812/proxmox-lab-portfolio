# 01-create-vms.yml — Probe Proxmox → build a VM plan → clone from template 101 → resize → NIC2 → start.
# Modules: community.general.proxmox_kvm (clone/config/start), proxmox_disk (resize), uri (API probing).
# Auth: API token. Secrets are NEVER hardcoded — pulled from vault via proxmox_api_token_secret.
---
- name: Build VM plan + clone VMs
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/proxmox.yml
    - ../vars/network.yml
    - ../vars/versions.yml
    - ../vars/cluster.yml
    - ../vars/hub.yml   # hub_instances[*].target_node — needed for the "avoid critical nodes" step below
  vars:
    proxmox_api_url: "https://{{ proxmox_api_host }}:{{ proxmox_api_port }}/api2/json"
    api_headers:
      Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
  tasks:
    # --- Probe: free RAM per node + list of existing VMs ---
    - name: Probe Proxmox node resources
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/cluster/resources?type=node"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
      register: pve_nodes
      failed_when: pve_nodes.status != 200

    - name: Probe existing VMs (VMID + name — detect collisions and the current max ID)
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/cluster/resources?type=vm"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
      register: pve_vms
      failed_when: pve_vms.status != 200

    # --- Multi-template support: each entry in cluster_nodes can declare its own `template_id`
    # (omit it to fall back to the global proxmox_template_id) — e.g. one cluster cloning some VMs
    # from template 101 and others from template 102. Every template_id actually referenced gets
    # validated, not just the default one.
    - name: Collect the template_id values actually used by cluster_nodes this run
      ansible.builtin.set_fact:
        used_template_ids: >-
          {{ cluster_nodes | map(attribute='template_id', default=proxmox_template_id) | map('int') | list | unique }}

    - name: Fail if any template_id referenced by cluster_nodes doesn't exist on the cluster
      ansible.builtin.fail:
        msg: >-
          Template VMID {{ item }} does not exist on the cluster (check cluster_nodes or
          proxmox_template_id) — run ansible-discover/discover.yml to list available templates.
      loop: "{{ used_template_ids }}"
      when: (pve_vms.json.data | selectattr('vmid', 'equalto', item) | list | length) == 0

    # Real bug found on the first multi-node run: the Proxmox clone API
    # (POST /nodes/{node}/qemu/{vmid}/clone) requires {node} in the URL to be the node that HOLDS
    # THE SOURCE TEMPLATE, not the destination node — the destination is passed separately via the
    # 'target' param (valid only when storage is shared, which it is here on Ceph). The clone task
    # used to pass the destination node as the source node by mistake; this stayed hidden as long
    # as auto-select happened to always land on the same node the template lived on, and only
    # surfaced once auto-select started legitimately picking different nodes.
    - name: Map each template_id to the node currently hosting it (used as the SOURCE node for clone)
      ansible.builtin.set_fact:
        template_id_to_node: >-
          {{ template_id_to_node | default({}) | combine({
               (item | string): (pve_vms.json.data | selectattr('vmid', 'equalto', item) | first).node
             }) }}
      loop: "{{ used_template_ids }}"
      loop_control:
        label: "template {{ item }}"

    # A filter that used to restrict candidate nodes to only the one hosting the template
    # effectively disabled multi-node auto-select entirely (despite the old comment claiming
    # "Full Clone + shared Ceph → any node works"). Removed — filtering on status=online is enough.
    - name: Attach 'free'/'usable_free' (after the {{ capacity_buffer_pct }}% buffer) + 'cpu' to every online node
      ansible.builtin.set_fact:
        nodes_with_free: "{{ nodes_with_free | default([]) + [ item | combine({'free': free_bytes, 'usable_free': usable_bytes, 'cpu': (item.cpu | default(0) | float)}) ] }}"
      vars:
        free_bytes: "{{ (item.maxmem | int) - (item.mem | int) }}"
        usable_bytes: "{{ (free_bytes | int) - ((item.maxmem | int) * (capacity_buffer_pct | int) // 100) }}"
      loop: "{{ pve_nodes.json.data | selectattr('status', 'equalto', 'online') | list }}"
      loop_control:
        label: "{{ item.node }}"

    # --- target_node (pinning a specific VM to a specific node, e.g. rancher/hub roles) — validated
    # EARLY so a bad pin fails clearly here instead of mid-clone with a confusing error. Template
    # validity was already checked above (used_template_ids); Full Clone + shared Ceph means the
    # template doesn't need to live on the same node — only "target node is online" matters. ---
    - name: Fail if any pinned target_node is not currently online
      ansible.builtin.fail:
        msg: >-
          target_node="{{ item.target_node }}" (role={{ item.role }}) is not in the list of online
          nodes: {{ nodes_with_free | map(attribute='node') | list }}. Check the spelling and whether
          that node is online.
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.role }} → {{ item.target_node | default('(auto)') }}"
      when: >-
        item.target_node is defined and
        item.target_node not in (nodes_with_free | map(attribute='node') | list)

    - name: Next VMID = max(min, max_id + 1)
      ansible.builtin.set_fact:
        next_vmid: >-
          {{ [ proxmox_vmid_min,
               ((pve_vms.json.data | map(attribute='vmid') | list | max | default(0)) | int) + 1
             ] | max }}

    # --- Map name → {vmid, node} for VMs that already exist (so they get reused instead of re-cloned) ---
    # Only VMs whose name matches the "<cluster_name>-" prefix are picked up — this isolates the
    # cluster from other clusters' VMs or unrelated infrastructure sharing the same Proxmox cluster.
    - name: Initialize the existing-VM map
      ansible.builtin.set_fact:
        existing_by_name: {}

    - name: Build the existing-VM map — only VMs belonging to cluster '{{ cluster_name }}' (name → real vmid/node)
      ansible.builtin.set_fact:
        existing_by_name: "{{ existing_by_name | combine({ item.name: {'vmid': item.vmid, 'node': item.node} }) }}"
      loop: "{{ pve_vms.json.data }}"
      loop_control:
        label: "{{ item.name | default('(no name)') }}"
      when: item.name is defined and item.name is match('^' + (cluster_name | regex_escape) + '-')

    # --- Pre-generate the planned name (<cluster>-<grp>-<nn>) for each cluster_nodes entry, in loop order.
    # Naming used to only happen while building the plan (below), i.e. AFTER the RAM-check block — so
    # the RAM check had no way to know which entry corresponded to an already-existing VM, and ended up
    # demanding RAM for VMs that were already created. Naming was pulled up here so both the RAM check
    # and the plan-build step share a single source of truth, instead of two places independently
    # assuming the same naming rule and silently drifting apart. ---
    - name: Initialize the list of planned names
      ansible.builtin.set_fact:
        planned_names: []
        planned_counters: { cp: 0, mon: 0, general: 0, rancher: 0 }

    - name: Generate the planned name for each cluster_nodes entry
      ansible.builtin.set_fact:
        planned_names: "{{ planned_names + [ cluster_name ~ '-' ~ grp ~ '-' ~ seq ] }}"
        planned_counters: "{{ planned_counters | combine({ grp: (planned_counters[grp] | int) + 1 }) }}"
      vars:
        grp: "{{ 'rancher' if item.role == 'rancher' else ('cp' if item.role == 'cp' else ('mon' if (item.type | default('general')) == 'monitoring' else 'general')) }}"
        seq: "{{ '%02d' | format((planned_counters[grp] | int) + 1) }}"
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.role }}/{{ item.type | default('general') }}"

    - name: Attach the planned name to each cluster_nodes entry (for the real-RAM check below)
      ansible.builtin.set_fact:
        nodes_with_planned_name: "{{ nodes_with_planned_name | default([]) + [ item | combine({'planned_name': planned_names[idx]}) ] }}"
      loop: "{{ cluster_nodes }}"
      loop_control:
        index_var: idx
        label: "{{ item.role }}/{{ item.type | default('general') }}"

    # --- Absolute priority: if this cluster already has a saved plan (.vmstatus_<cluster>.json exists),
    #     reuse THAT as the source of truth for names/roles/config — never rebuild it from the current
    #     cluster_nodes. Reason: cluster_nodes.yml may have changed (entries added/removed/reordered)
    #     between runs — rebuilding from the current file risks matching an existing vmid/node to a
    #     DIFFERENT role/config than the one it was actually created with.
    - name: Check whether a saved vm_status already exists for cluster '{{ cluster_name }}'
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../.vmstatus_{{ cluster_name }}.json"
      register: vmstatus_file

    - name: Load the saved vm_status (source of truth — not rebuilt from current cluster_nodes)
      ansible.builtin.set_fact:
        vm_status: "{{ lookup('file', playbook_dir + '/../.vmstatus_' + cluster_name + '.json') | from_json }}"
      when: vmstatus_file.stat.exists

    # --- Auto-select node scoring — ONLY runs when actually building a brand-new plan (no
    # .vmstatus_<cluster>.json yet). This used to run unconditionally, before it was even known
    # whether the VMs existed — so re-running against an already-created cluster still demanded
    # fresh RAM for the whole set and failed with a false "not enough RAM," even though nothing new
    # needed to be created. RAM/node selection now only runs on the "build a new plan" branch —
    # a reused plan already carries its committed target, no re-selection needed. ---
    - name: "[New plan only] Avoid critical nodes + check available RAM + auto-select a node"
      when: not vmstatus_file.stat.exists
      block:
        # --- Avoid "critical" nodes (currently hosting Rancher/the hub) during auto-select for
        # regular CP/worker clusters — lesson from a real incident where rancher-mgmt and the
        # data-collector hub ended up on the same node and nearly exhausted its RAM into swap.
        # Dynamic node lookup: for instances that declare a 'vmid', the REAL current node is looked
        # up live via the API (already probed as pve_vms) instead of trusting a static target_node
        # (in case a VM was migrated manually outside Ansible without updating config). Instances
        # without a 'vmid', or not found during the probe, fall back to their declared target_node.
        # Only affects auto-select — an item that pins its own target_node is never overridden. ---
        - name: Merge rancher_instances + hub_instances into one list
          ansible.builtin.set_fact:
            critical_instances: >-
              {{ (rancher_instances | default({}) | dict2items | map(attribute='value') | list)
                 + (hub_instances | default({}) | dict2items | map(attribute='value') | list) }}

        - name: For each critical instance, record the node to avoid (live vmid lookup takes priority over static target_node)
          ansible.builtin.set_fact:
            reserved_nodes: "{{ reserved_nodes | default([]) + ([resolved_node] if resolved_node != '' else []) }}"
          vars:
            live_node: >-
              {{ ((pve_vms.json.data | selectattr('vmid', 'equalto', item.vmid | default(-1) | int) | first).node | default(''))
                 if item.vmid is defined else '' }}
            resolved_node: "{{ live_node if live_node != '' else (item.target_node | default('')) }}"
          loop: "{{ critical_instances }}"
          loop_control:
            label: "vmid={{ item.vmid | default('(none)') }} target_node={{ item.target_node | default('(none)') }}"

        - name: Deduplicate reserved_nodes
          ansible.builtin.set_fact:
            reserved_nodes: "{{ reserved_nodes | default([]) | unique }}"

        # --- Hard constraint: a candidate node must have enough available RAM for the TOTAL of all
        # auto-selected VMs landing on it (previously best_node only picked the node with the most
        # free RAM, without checking whether that RAM covered the whole batch — the exact mechanism
        # that could reproduce the swap incident if several VMs piled onto one node at once). ---
        # Fixed later: the RAM total used to include VMs that already exist on Proxmox — so re-running
        # after a clone timed out (VM created but the module reported failure before
        # `.vmstatus_<cluster>.json` got written) failed with a false "not enough RAM" even though no
        # extra bytes of RAM were actually needed. The `when: not vmstatus_file.stat.exists` guard only
        # protects against a missing snapshot FILE, not a VM that exists for real but wasn't recorded
        # yet — so the RAM total is now filtered against Proxmox's actual state (`existing_by_name`),
        # the same way the Ceph capacity check below already does (`rejectattr('already_exists')`).
        - name: "[DEBUG] Compare planned names against VMs that actually exist on Proxmox"
          ansible.builtin.debug:
            msg: >-
              planned_names={{ planned_names }}
              | existing_by_name={{ existing_by_name.keys() | list }}
              | already matched (excluded from RAM demand)={{ planned_names | select('in', existing_by_name.keys() | list) | list }}

        - name: Total RAM (bytes) needed for auto-selected VMs NOT yet existing on Proxmox
          ansible.builtin.set_fact:
            auto_select_ram_needed: >-
              {{ (nodes_with_planned_name
                  | selectattr('target_node', 'undefined')
                  | rejectattr('planned_name', 'in', existing_by_name.keys() | list)
                  | map(attribute='ram') | map('int') | list | sum) * 1024 * 1024 }}

        - name: Filter to nodes with enough available RAM for the total demand (hard constraint, applies to every node including critical ones)
          ansible.builtin.set_fact:
            nodes_capacity_ok: "{{ nodes_with_free | selectattr('usable_free', '>=', auto_select_ram_needed | int) | list }}"

        - name: Fail if no node has enough available RAM for the total auto-select demand
          ansible.builtin.fail:
            msg: >-
              No Proxmox node has enough available RAM (after the {{ capacity_buffer_pct }}% buffer) for
              the total {{ (auto_select_ram_needed | int / 1024 / 1024) | round(0) }}MB of auto-selected VMs.
              Available RAM per node: {{ dict(nodes_with_free | map(attribute='node') | zip(nodes_with_free | map(attribute='usable_free'))) }}.
              Reduce cluster_nodes, free up RAM, or add a Proxmox node.
          when: (nodes_capacity_ok | length) == 0

        # --- Among nodes that already pass the hard RAM constraint, prefer non-critical nodes (soft
        # preference). CPU is the tie-break: nodes are bucketed by whole GB of available RAM (to avoid
        # comparing meaningless byte-level differences), and within a bucket the less-busy-CPU node
        # wins — RAM stays the primary criterion because Proxmox actually reserves RAM for a VM (run
        # out and you get swap/OOM), while vCPU is usually overcommitted safely and rarely the cause
        # of an outage. ---
        - name: Initialize nodes_capacity_scored as empty
          ansible.builtin.set_fact:
            nodes_capacity_scored: []

        - name: Attach sort_score (bucketed by available GB of RAM, tie-broken by free CPU) to each node that passed the hard constraint
          ansible.builtin.set_fact:
            nodes_capacity_scored: "{{ nodes_capacity_scored + [ item | combine({'sort_score': score}) ] }}"
          vars:
            score: "{{ (((item.usable_free | int) // (1024*1024*1024)) * 1000) - ((item.cpu | float) * 1000 | int) }}"
          loop: "{{ nodes_capacity_ok }}"
          loop_control:
            label: "{{ item.node }}"

        - name: Use nodes_capacity_scored as the official nodes_capacity_ok
          ansible.builtin.set_fact:
            nodes_capacity_ok: "{{ nodes_capacity_scored }}"

        - name: Pick a node — prefer avoiding reserved_nodes, then pick the highest sort_score among what's left
          ansible.builtin.set_fact:
            best_node: >-
              {{ (nodes_unreserved | sort(attribute='sort_score') | last).node
                 if (nodes_unreserved | length) > 0
                 else (nodes_capacity_ok | sort(attribute='sort_score') | last).node }}
          vars:
            nodes_unreserved: "{{ nodes_capacity_ok | rejectattr('node', 'in', reserved_nodes) | list }}"

        - name: Warn if forced to fall back onto a critical node (every RAM-eligible node left is hosting Rancher/the hub)
          ansible.builtin.debug:
            msg: >-
              ⚠️ Every RAM-eligible node outside the avoid-list {{ reserved_nodes }} is gone — auto-select
              is forced onto {{ best_node }} (currently hosting Rancher/hub). Consider freeing RAM or
              adding a Proxmox node.
          when: (nodes_capacity_ok | rejectattr('node', 'in', reserved_nodes) | list | length) == 0

        - name: Report available RAM per node + the avoid-list (live) + the chosen node
          ansible.builtin.debug:
            msg: >-
              usable_free={{ dict(nodes_with_free | map(attribute='node') | zip(nodes_with_free | map(attribute='usable_free'))) }}
              | needs {{ (auto_select_ram_needed | int / 1024 / 1024) | round(0) }}MB for auto-selected VMs
              | avoiding (rancher/hub, live lookup): {{ reserved_nodes }}
              → fallback (no target_node pinned) will use {{ best_node }}

    # --- Build a NEW plan: only runs when no saved plan exists yet for this cluster (first run, or a missing file) ---
    - name: Initialize an empty plan
      ansible.builtin.set_fact:
        vm_status: []
      when: not vmstatus_file.stat.exists

    # Names come straight from `planned_names`, generated at the top of the play — grp/seq are
    # NOT recomputed here (avoids two places holding the same naming rule and drifting apart, see
    # the note where planned_names is generated).
    - name: Build the per-VM plan (name = <cluster>-<group>-<nn>, vmid incrementing from next_vmid)
      ansible.builtin.set_fact:
        vm_status: "{{ vm_status + [ plan_item ] }}"
      vars:
        plan_item:
          name: "{{ planned_names[idx] }}"
          vmid: "{{ (next_vmid | int) + idx }}"
          # A manually pinned target_node (e.g. rancher/hub wanting one specific node) is used as-is.
          # Otherwise (default cp/worker) fall back to the auto-selected best_node (most free RAM).
          target: "{{ item.target_node | default(best_node) }}"
          role: "{{ item.role }}"
          type: "{{ item.type | default('general') }}"
          ram: "{{ item.ram }}"
          cpu: "{{ item.cpu }}"
          disk: "{{ item.disk }}"
          # template_id/storage_id — declared per-VM in cluster_nodes to pick the right
          # template/pool (see ansible-discover/output/). If omitted, falls back to the global
          # default (proxmox_template_id/proxmox_vm_storage) for backward compatibility.
          template_id: "{{ item.template_id | default(proxmox_template_id) }}"
          storage_id: "{{ item.storage_id | default(proxmox_vm_storage) }}"
          # pin_static_ip: true = play 02b converts the DHCP-assigned IP to static (see
          # playbooks/02b-pin-static-ip.yml). Defaults to false — most K8s cluster VMs don't need it.
          pin_static_ip: "{{ item.pin_static_ip | default(false) }}"
      loop: "{{ cluster_nodes }}"
      loop_control:
        index_var: idx
      when: not vmstatus_file.stat.exists

    # --- Sync already_exists + the REAL vmid/node for every item in vm_status (applies to both branches above) ---
    # Always reconciled against current Proxmox state BY NAME (never trust a vmid recorded in a saved
    # file/plan blindly) — covers a VM deleted manually outside Ansible, or a previous run that
    # crashed partway through before it could start the VM.
    - name: Initialize vm_status_final as empty
      ansible.builtin.set_fact:
        vm_status_final: []

    - name: Attach already_exists + real vmid/node (if the VM already exists) to each item, per current Proxmox state
      ansible.builtin.set_fact:
        vm_status_final: >-
          {{ vm_status_final + [ item | combine({
               'already_exists': is_existing,
               'vmid': (existing_by_name[item.name].vmid if is_existing else item.vmid),
               'target': (existing_by_name[item.name].node if is_existing else item.target)
             }) ] }}
      vars:
        is_existing: "{{ item.name in existing_by_name }}"
      loop: "{{ vm_status }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Use vm_status_final as the official vm_status
      ansible.builtin.set_fact:
        vm_status: "{{ vm_status_final }}"

    # A task name that embedded conditional Jinja gets templated even when the whole play is
    # skipped by run_only, at which point the fact it references was never registered — the same
    # class of "Ansible renders some fields regardless of skip state" bug documented for
    # loop_control.label in ../TROUBLESHOOTING.md. Fixed by moving the conditional text into the
    # debug message (only evaluated when the task actually runs) and keeping the task name static.
    - name: "Show VM status (already_exists=true → skip clone, config/resize/start still run)"
      ansible.builtin.debug:
        msg:
          - "Source: {{ 'saved file' if vmstatus_file.stat.exists else 'freshly built' }}"
          - "{{ vm_status }}"

    # --- Check capacity on each Ceph pool holding VM disks — ONCE PER POOL, GLOBALLY (unlike RAM,
    # which is checked per node): each storage_id is an RBD pool shared across all 4 Proxmox nodes
    # (Full Clone, shared Ceph), so "which node has room" is meaningless for disk — any one node
    # gives the correct cluster-wide figure. Multi-pool support: each VM can declare its own
    # storage_id (see ansible-discover/ for the list of available pools) — grouped by storage_id and
    # checked per pool, not lumped into one pool like before. Only counts VMs that don't already
    # exist (already_exists=false) — an existing VM's disk usage was already counted previously. ---
    - name: Initialize disk_needed_by_storage as empty
      ansible.builtin.set_fact:
        disk_needed_by_storage: {}

    - name: Sum needed disk space by storage_id (new VMs only)
      ansible.builtin.set_fact:
        disk_needed_by_storage: >-
          {{ disk_needed_by_storage | combine({ item.storage_id: (disk_needed_by_storage[item.storage_id] | default(0) | int) + (item.disk | int) }) }}
      loop: "{{ vm_status | rejectattr('already_exists') | list }}"
      loop_control:
        label: "{{ item.name }} → {{ item.storage_id }}"

    - name: Probe capacity on each Ceph pool needed this run
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ probe_node }}/storage/{{ item.key }}/status"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
      register: storage_status_results
      failed_when: false   # a clear failure message is raised separately below (bad/nonexistent storage_id)
      vars:
        probe_node: "{{ (pve_nodes.json.data | selectattr('status', 'equalto', 'online') | first).node }}"
      loop: "{{ disk_needed_by_storage | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Fail if a storage_id couldn't be probed (wrong/nonexistent pool name)
      ansible.builtin.fail:
        msg: >-
          storage_id '{{ item.item.key }}' could not be probed (HTTP {{ item.status | default('?') }}) —
          check the pool name, see ansible-discover/output/ for the list of available pools.
      loop: "{{ storage_status_results.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: item.status is not defined or item.status != 200

    - name: Report + fail if a pool doesn't have enough capacity for the new VMs (after the {{ capacity_buffer_pct }}% buffer)
      ansible.builtin.fail:
        msg: >-
          Ceph pool '{{ item.item.key }}' doesn't have enough capacity: needs {{ item.item.value }}GB, only
          {{ usable_gb | round(1) }}GB available (after the {{ capacity_buffer_pct }}% buffer). Reduce disk
          sizes in cluster_nodes, clean up old VMs/snapshots, or expand the pool before continuing.
      loop: "{{ storage_status_results.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      vars:
        usable_gb: >-
          {{ ((item.json.data.avail | int) - (item.json.data.total | int) * (capacity_buffer_pct | int) // 100) / 1024 / 1024 / 1024 }}
      when: (item.item.value | int) > (usable_gb | float)

    - name: Report per-pool needed vs. available capacity (log only, never fails)
      ansible.builtin.debug:
        msg: >-
          Pool '{{ item.item.key }}': needs {{ item.item.value }}GB, available
          {{ ((item.json.data.avail | int) - (item.json.data.total | int) * (capacity_buffer_pct | int) // 100) / 1024 / 1024 / 1024 | round(1) }}GB
          (after the {{ capacity_buffer_pct }}% buffer).
      loop: "{{ storage_status_results.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    # --- Clone (new VMs only) + configure + start (ALWAYS runs for every VM, including reused ones — idempotent) ---
    # storage (community.general.proxmox_kvm's 'storage' param for Full Clone destination) —
    # # REVIEW: not yet hand-verified against the pinned module version (same caveat as other
    # # REVIEW markers in this repo, e.g. plays 07/09) — if it errors "unsupported parameter" at
    # runtime, check `ansible-doc community.general.proxmox_kvm` for the correct name first.
    #
    # 'node' MUST be the node holding the SOURCE template (template_id_to_node), NOT the destination
    # — see the note above at "Map each template_id to the node currently hosting it" for the full
    # story. The destination is passed separately via 'target' (the correct Proxmox param for this
    # when storage is shared, as it is here on Ceph).
    - name: Clone VM from template (per-item template_id, defaulting to proxmox_template_id — skipped if it already exists)
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        node: "{{ template_id_to_node[item.template_id | string] }}"
        target: "{{ item.target }}"
        clone: "{{ item.template_id }}"
        vmid: "{{ item.template_id }}"
        newid: "{{ item.vmid }}"
        name: "{{ item.name }}"
        full: "{{ proxmox_full_clone }}"
        storage: "{{ item.storage_id }}"
        pool: "{{ proxmox_resource_pool }}"
        timeout: 300
      when: not item.already_exists
      loop: "{{ vm_status }}"
      loop_control:
        label: "{{ item.name }} (vmid {{ item.vmid }}, template={{ item.template_id }}, storage={{ item.storage_id }}, already_exists={{ item.already_exists }})"

    # --- Snapshot after every phase: write .vmstatus_<cluster>.json right after EACH step (clone,
    #     config, resize), not just once at the end. If the run crashes anywhere, the next run
    #     loads the latest file — VM identity (name/vmid/node) is already locked in and doesn't
    #     depend on cluster_nodes.yml staying unchanged. vm_status content itself doesn't change
    #     between phases — this exists purely to get the file on disk as early as possible in case
    #     of a crash.
    - name: "Snapshot #1 — save vm_status right after clone (before config)"
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../.vmstatus_{{ cluster_name }}.json"
        content: "{{ vm_status | to_nice_json }}"
        mode: "0644"

    # community.general.proxmox_kvm always fails with a generic "Unable to update vm ... = 'net1'"
    # error when adding a net1 interface to a freshly cloned VM — confirmed a module bug, not a
    # Proxmox one, by successfully running the exact same parameters through `qm set` by hand on a
    # clean VM. Worked around by calling the REST API directly (PUT .../config) via
    # ansible.builtin.uri — the same API `qm set` itself uses. net0 is left untouched: Full Clone
    # already carries the correct net0 (model+MAC, bridge, VLAN tag) from the template, and
    # re-setting it without a MAC gets rejected by Proxmox as a duplicate key.
    #
    # A wrong hypothesis, tried and reverted: suspected net1 needed a matching ipconfig1 to avoid
    # losing IPv4 on both NICs, and tried `ipconfig1: "ip=manual"` — but Proxmox's `ipconfig[n]`
    # only accepts "dhcp" or a real CIDR, not "manual"; it failed hard at VM start with
    # "not a CIDR: manual". Reverted — no ipconfig1 is set at all.
    #
    # Root cause actually confirmed (via journalctl + apt history.log on a live VM): the "VM loses
    # net0's IPv4 mid-boot" symptom was unrelated to ipconfig1 — Proxmox's cloud-init defaults
    # `ciupgrade=1` ("Upgrade packages"), which runs a full `apt-get dist-upgrade` (including a new
    # kernel) in the background on first boot, racing the rest of the Ansible pipeline. The upgrade
    # installed a new kernel package moments before systemd-networkd restarted while the VM was
    # still running the OLD kernel — the userspace/kernel version mismatch made the DHCP client fail
    # on eth0. This is the same "two things fighting over the package manager" pattern documented in
    # ../TROUBLESHOOTING.md ("Two independent processes fighting over the same package manager
    # lock") — the fix here is disabling `ciupgrade` so Ansible's own, controlled apt upgrade
    # (playbooks/04-prep-vms.yml) is the only thing ever touching packages/kernel on a fresh VM.
    - name: Set RAM/CPU + NIC2 (storage VLAN) + cloud-init DHCP (direct REST API call — works around a proxmox_kvm bug)
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ item.target }}/qemu/{{ item.vmid }}/config"
        method: PUT
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        body_format: form-urlencoded
        body:
          memory: "{{ item.ram }}"
          cores: "{{ item.cpu }}"
          net1: "virtio,bridge={{ proxmox_bridge_storage }}"
          ipconfig0: "ip=dhcp"
          ciupgrade: 0
          agent: "enabled=1"
        status_code: [200]
      register: config_result
      until: config_result is succeeded
      retries: 6
      delay: 15
      changed_when: true
      loop: "{{ vm_status }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Snapshot #2 — save vm_status right after config (before resize)"
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../.vmstatus_{{ cluster_name }}.json"
        content: "{{ vm_status | to_nice_json }}"
        mode: "0644"

    # NOTE: runs for every VM, including reused ones (already_exists=true). proxmox_disk
    # state=resized sets an ABSOLUTE size (not a delta), so re-applying the same size is normally a
    # safe no-op. If a "cannot resize" error shows up on a VM that's already at the target size,
    # add `when: not item.already_exists`.
    - name: "Resize the root disk ({{ proxmox_root_disk }}) to <disk>G (clone doesn't apply the configured size)"
      community.general.proxmox_disk:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        vmid: "{{ item.vmid }}"
        disk: "{{ proxmox_root_disk }}"
        size: "{{ item.disk }}G"
        state: resized
      loop: "{{ vm_status }}"
      loop_control:
        label: "{{ item.name }} → {{ item.disk }}G"

    - name: "Snapshot #3 — save vm_status right after resize (before start)"
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../.vmstatus_{{ cluster_name }}.json"
        content: "{{ vm_status | to_nice_json }}"
        mode: "0644"

    - name: Start VM
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        node: "{{ item.target }}"
        vmid: "{{ item.vmid }}"
        state: started
      loop: "{{ vm_status }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Snapshot #4 (final) — save vm_status after start, for later plays to use (discover-ips, cleanup)"
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../.vmstatus_{{ cluster_name }}.json"
        content: "{{ vm_status | to_nice_json }}"
        mode: "0644"

    # --- SMOKE TEST, phase 01 — this play used to have no final confirmation that VMs were actually
    # "running" after Start; proxmox_kvm's state=started only means "the start command was SENT," not
    # that Proxmox finished booting it. Play 02 (discover IP) has its own retries so a failure would
    # eventually surface there too, but LATE and hard to trace back to "the VM never started in play
    # 01." Polling the Proxmox API directly until every VM is running fails loudly, right at the
    # phase that actually caused the problem. ---
    - name: "SMOKE TEST, phase 01 — wait until every VM is actually 'running' on Proxmox (not just started)"
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ item.target }}/qemu/{{ item.vmid }}/status/current"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
      register: vm_status_check
      until: vm_status_check.json.data.status == 'running'
      retries: 12
      delay: 10
      loop: "{{ vm_status }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "SMOKE TEST, phase 01 — PASS"
      ansible.builtin.debug:
        msg: "All {{ vm_status | length }} VMs in cluster '{{ cluster_name }}' are running. Ready for play 02 (discover IP)."
