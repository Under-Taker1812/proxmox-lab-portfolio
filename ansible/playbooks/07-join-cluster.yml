# 07-join-cluster.yml — Tạo/khớp cluster trên Rancher → lấy registration token → join.
# Thứ tự: GỬI lệnh join CP-01 → CP-02/03 → worker gần như liền nhau (KHÔNG chờ Ready giữa
# chừng — Rancher RKE2 planner cần thấy đủ role control-plane/etcd/worker đăng ký cùng lúc
# mới bắt đầu cài, chờ Ready quá sớm gây deadlock). Chờ Ready + verify dồn vào 1 play cuối.
#
# ⚠️ REVIEW (GAP #1): luồng Rancher API tạo cluster RKE2 CHƯA chạy tay lần nào.
#   Dùng Steve API v1 (provisioning.cattle.io) tạo cluster + v3 clusterregistrationtoken
#   lấy insecureNodeCommand. Cần test kỹ field names trên Rancher v2.14.
---
- name: Rancher API — tạo/khớp cluster + lấy join command
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/network.yml
    - ../vars/versions.yml
    - ../vars/cluster.yml
  vars:
    api: "{{ rancher_url }}"
    auth_header:
      Authorization: "Bearer {{ rancher_api_token }}"
  tasks:
    # Playbook này có thể chạy ĐỘC LẬP (không qua site.yml), nên KHÔNG được chỉ dựa vào validate
    # ở site.yml preflight — tự bảo vệ mình. Hiện tại "an toàn" nhờ check rancher_api_token rỗng
    # chạy TRƯỚC khi rancher_url bị dùng (task ngay dưới) — nhưng đó là an toàn tình cờ theo thứ
    # tự task, không phải validate thật. Check tường minh để không phụ thuộc vào thứ tự nữa.
    - name: Fail nếu rancher_instance không tồn tại trong rancher_instances (chỉ khi use_existing)
      ansible.builtin.fail:
        msg: >-
          rancher_instance="{{ rancher_instance }}" không có trong rancher_instances
          ({{ rancher_instances.keys() | list }}) — kiểm tra deploy-config.yml, hoặc thêm entry
          mới vào group_vars/all/vars.yml (xem README.md).
      when: rancher_mode == 'use_existing' and rancher_instance not in rancher_instances

    - name: Fail nếu thiếu rancher_api_token
      ansible.builtin.fail:
        msg: "Thiếu rancher_api_token (use_existing: set trong vault; install_new: play 05 tự set)."
      when: rancher_api_token is not defined or rancher_api_token | length == 0

    - name: Verify Rancher API sống
      ansible.builtin.uri:
        url: "{{ api }}/v3"
        method: GET
        headers: "{{ auth_header }}"
        validate_certs: false
        status_code: [200]
      register: rancher_ping
      retries: 5
      delay: 10
      until: rancher_ping.status == 200

    # --- new_cluster: tạo provisioning cluster qua Steve API ---
    - name: "[new_cluster] Render provisioning cluster JSON"
      ansible.builtin.set_fact:
        prov_body:
          type: "provisioning.cattle.io.cluster"
          metadata:
            name: "{{ cluster_name }}"
            namespace: "fleet-default"
          spec:
            kubernetesVersion: "{{ rke2_version }}"
            rkeConfig: {}
      when: mode == 'new_cluster'

    - name: "[new_cluster] POST tạo cluster (idempotent — bỏ qua nếu đã tồn tại)"
      ansible.builtin.uri:
        url: "{{ api }}/v1/provisioning.cattle.io.clusters"
        method: POST
        headers: "{{ auth_header }}"
        body_format: json
        body: "{{ prov_body }}"
        validate_certs: false
        status_code: [201, 200, 409]
      register: create_cluster
      when: mode == 'new_cluster'

    - name: "Lấy provisioning cluster để map mgmt clusterName"
      ansible.builtin.uri:
        url: "{{ api }}/v1/provisioning.cattle.io.clusters/fleet-default/{{ cluster_name }}"
        method: GET
        headers: "{{ auth_header }}"
        validate_certs: false
        status_code: [200]
      register: prov_cluster
      retries: 20
      delay: 10
      until:
        - prov_cluster.status == 200
        - prov_cluster.json.status.clusterName is defined
        - prov_cluster.json.status.clusterName | length > 0

    - name: Set mgmt cluster id (c-m-xxxx)
      ansible.builtin.set_fact:
        mgmt_cluster_id: "{{ prov_cluster.json.status.clusterName }}"

    - name: Lấy clusterRegistrationToken (insecureNodeCommand)
      ansible.builtin.uri:
        url: "{{ api }}/v3/clusterregistrationtoken?clusterId={{ mgmt_cluster_id }}"
        method: GET
        headers: "{{ auth_header }}"
        validate_certs: false
        status_code: [200]
      register: crt
      retries: 20
      delay: 10
      until:
        - crt.status == 200
        - crt.json.data | length > 0
        - crt.json.data[0].insecureNodeCommand is defined
        - crt.json.data[0].insecureNodeCommand | length > 0

    - name: Set base join command (chưa có role flag)
      ansible.builtin.set_fact:
        join_base: "{{ crt.json.data[0].insecureNodeCommand }}"

    - name: Lưu clusterID ra file (cleanup dùng)
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../.cluster_{{ cluster_name }}.id"
        content: "{{ mgmt_cluster_id }}\n"
        mode: "0644"

    - name: Báo join command
      ansible.builtin.debug:
        msg: "mgmt cluster {{ mgmt_cluster_id }} | join base: {{ join_base }}"

# --- BUG FIX (2026-07-01, xem BUG-AND-DEBUG.md): Rancher RKE2 planner cần thấy CẢ 3 role
# (control plane, etcd, worker) ĐÃ ĐĂNG KÝ thì mới bắt đầu generate plan cài đặt cho BẤT KỲ
# node nào — kể cả CP. Thiết kế cũ "join CP → chờ CP Ready qua kubectl → mới join worker" bị
# deadlock vòng tròn: CP không bao giờ Ready vì Rancher chờ worker đăng ký, mà worker chưa được
# lệnh join vì đang bị chặn ở bước chờ CP. Fix: tách "gửi lệnh join" và "chờ Ready" — join CP-01,
# CP-02/03, Worker gần như đồng thời (không đợi node trước Ready), rồi mới chờ Ready TẤT CẢ ở cuối.

# any_errors_fatal (2026-07-24, xem BUG-AND-DEBUG.md) — nếu CP-01 rớt SSH ở ĐÂY, các play join sau
# (CP-02/03, worker) vẫn ÂM THẦM chạy tiếp và gửi join trỏ vào 1 cluster chưa hề có control-plane —
# để lại trạng thái tệ nhất (worker join treo vô thời hạn chờ CP không tồn tại) mà không fail loud
# ở đâu cả. Dừng ngay tại đây an toàn hơn nhiều so với chạy tiếp rồi phát hiện muộn ở verify.
# --- CP-01: GỬI lệnh join etcd + control-plane (KHÔNG chờ Ready ở đây) ---
- name: Join CP-01 (etcd + control-plane) — chỉ gửi lệnh, chưa chờ Ready
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Chạy join command (etcd + controlplane)
      ansible.builtin.shell:
        cmd: "{{ hostvars['localhost'].join_base }} --etcd --controlplane"
      args:
        creates: /var/lib/rancher/rke2/server/node-token
      register: cp_join

# --- CP-02/03 (nếu có): GỬI lệnh join (KHÔNG chờ Ready ở đây) ---
- name: Join CP-02/03 — chỉ gửi lệnh, chưa chờ Ready
  hosts: cp_nodes
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Skip cp-01 (đã gửi lệnh join ở play trên)
      ansible.builtin.meta: end_host
      when: inventory_hostname == groups['cp_nodes'][0]

    - name: Chạy join (etcd + controlplane)
      ansible.builtin.shell:
        cmd: "{{ hostvars['localhost'].join_base }} --etcd --controlplane"
      args:
        creates: /var/lib/rancher/rke2/agent/kubelet.kubeconfig
      register: cp_join2

# --- Workers: GỬI lệnh join NGAY (không đợi CP Ready) — đây chính là fix deadlock ---
- name: Join workers — chỉ gửi lệnh, chưa chờ Ready
  hosts: worker_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Chạy join (worker)
      ansible.builtin.shell:
        cmd: "{{ hostvars['localhost'].join_base }} --worker"
      args:
        creates: /var/lib/rancher/rke2/agent/kubelet.kubeconfig
      register: worker_join

# --- Sau khi TẤT CẢ node (CP + worker) đã được gửi lệnh join, mới chờ Ready + verify ---
- name: Chờ toàn bộ cluster Ready + verify (chạy từ CP-01)
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    all_cluster_nodes: "{{ (groups['cp_nodes'] | default([])) + (groups['worker_nodes'] | default([])) }}"
    # Scale retries theo tổng số node (2026-07-24, xem BUG-AND-DEBUG.md) — CP+worker join gần như
    # đồng thời (fix deadlock 2026-07-01) nên cluster càng nhiều node, mỗi node càng chậm Ready hơn
    # (contention CPU/network dùng chung khi tất cả cùng pull ảnh/khởi tạo Calico 1 lượt). Timeout
    # tĩnh cũ (30 lần cố định, không đổi theo số node) chắc chắn không đủ với cluster nhiều CP/worker.
    node_ready_retries_effective: "{{ (node_ready_retries_base | int) + (node_ready_retries_per_node | int) * ((all_cluster_nodes | length) - 1) }}"
  tasks:
    - name: Chờ CP-01 Ready (etcd+controlplane phải Ready trước, node khác mới join được)
      ansible.builtin.shell:
        cmd: "{{ rke2_kubectl }} get node $(hostname) -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}'"
      register: cp_ready
      changed_when: false
      retries: "{{ node_ready_retries_effective }}"
      delay: "{{ node_ready_delay }}"
      until: cp_ready.stdout == "True"

    - name: Chờ mọi node còn lại (CP-02/03, worker) Ready — kiểm tra từ CP-01
      ansible.builtin.shell:
        cmd: "{{ rke2_kubectl }} get node {{ item }} -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}'"
      register: node_ready
      changed_when: false
      retries: "{{ node_ready_retries_effective }}"
      delay: "{{ node_ready_delay }}"
      until: node_ready.stdout == "True"
      loop: "{{ all_cluster_nodes | reject('equalto', inventory_hostname) | list }}"
      loop_control:
        label: "{{ item }}"

    # BUG (xác nhận 2026-07-10, xem rke2-calico-netfilter-bugs.md Bug #5 + #6): ĐÃ BỎ HẲN việc patch
    # FelixConfiguration.iptablesBackend=Legacy — 2 lý do:
    # 1. `installation.calicoNetwork.iptablesBackend` không phải field hợp lệ trong CRD Installation
    #    (Bug #5) — không có cách nào set qua HelmChartConfig nữa, chỉ patch trực tiếp được thôi.
    # 2. Test thật trên `data-collector-hub` xác nhận: Ubuntu 24.04 + Calico v3.32 mặc định dùng
    #    NFT nhất quán với kube-proxy — KHÔNG cần ép Legacy. Patch Legacy rồi revert lại (lúc debug)
    #    để lại ruleset iptables-legacy MỒ CÔI, cả 2 backend cùng bị kernel enforce song song, pod
    #    mới tạo sau đó bị stale catch-all "Unknown interface -> DROP" chặn hoàn toàn — pod-to-pod
    #    100% mất gói dù routes/nft rules đều đúng. Xem Bug #6 để hiểu đầy đủ cơ chế.
    # → Bài học: ĐỪNG bật/tắt iptablesBackend qua lại trên cluster đã chạy. Nếu môi trường mới cần
    #   Legacy thật (kube-proxy dùng iptables-legacy), set 1 LẦN DUY NHẤT ngay từ đầu, và luôn kèm
    #   flush backend cũ (task dưới) để tránh dual-dataplane orphan rules.
    - name: Flush iptables-legacy phòng ngừa dual-dataplane orphan rules (Bug #6)
      ansible.builtin.shell:
        cmd: >
          iptables-legacy -F; iptables-legacy -X;
          iptables-legacy -t nat -F; iptables-legacy -t nat -X;
          iptables-legacy -t mangle -F; iptables-legacy -t mangle -X;
          iptables-legacy -t raw -F; iptables-legacy -t raw -X;
          true
      changed_when: false

    - name: VERIFY — CoreDNS Running
      ansible.builtin.shell:
        cmd: "{{ rke2_kubectl }} -n kube-system get pods -l k8s-app=kube-dns -o jsonpath='{.items[0].status.containerStatuses[0].ready}'"
      register: coredns
      changed_when: false
      retries: 20
      delay: 10
      until: coredns.stdout == "true"

    # Test chức năng THẬT thay cho giả định trạng thái nft/Legacy — đây mới là bằng chứng đáng tin.
    - name: VERIFY — DNS resolve thật (kubernetes.default.svc.cluster.local)
      ansible.builtin.shell:
        cmd: >
          {{ rke2_kubectl }} run dnsverify-{{ 999999 | random }} --image=busybox:1.36 --rm -i
          --restart=Never --command -- nslookup kubernetes.default.svc.cluster.local
      register: dns_verify
      changed_when: false
      retries: 5
      delay: 15
      until: "'Address' in dns_verify.stdout and 'connection timed out' not in dns_verify.stdout"
      failed_when: "'Address' not in dns_verify.stdout"

# --- add_node: patch Calico Installation trên CLUSTER CŨ (Bug #4) ---
- name: "[add_node] Patch Calico Installation cidrs (chạy trên cp-01 cluster hiện có)"
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  vars_files:
    - ../vars/network.yml
  tasks:
    - name: Patch nodeAddressAutodetectionV4.cidrs (type=json replace — không merge)
      ansible.builtin.shell:
        cmd: >
          {{ rke2_kubectl }} patch installation default --type=json
          -p='[{"op":"replace","path":"/spec/calicoNetwork/nodeAddressAutodetectionV4","value":{"cidrs":["{{ calico_vm_cidr }}"]}}]'
      register: calico_patch
      changed_when: "'patched' in calico_patch.stdout"
      failed_when:
        - calico_patch.rc != 0
        - "'no change' not in calico_patch.stdout"
      when: mode == 'add_node'

# ─────────────────────────────────────────────────────────────────────────────
# Watchdog TỰ LÀNH cho deadlock "rancher-webhook chặn tạo namespace calico-system"
# (Bug #8 — chi tiết đầy đủ + bằng chứng ở data-collector-hub-setup.md)
#
# VÌ SAO ĐẶT Ở PLAY 07 chứ không chỉ ở 13-data-collector-hub.yml:
#   Bug này KHÔNG riêng của hub — nó nằm ở cấu hình webhook mà Rancher áp cho MỌI
#   downstream cluster: `rancher.cattle.io.namespaces.create-non-kubesystem` có
#   failurePolicy=Fail và chỉ miễn trừ `kube-system`, KHÔNG miễn trừ `calico-system`.
#   Đã verify 2026-08-14: `k8s-demo` có y nguyên cấu hình đó → cũng dễ vỡ, chỉ chưa
#   nổ vì chưa reboot lần nào. Đặt ở play 07 thì MỌI cluster đều có sẵn, kể cả hub
#   mới (vì tạo hub cũng chạy qua play 07: run_only=[1,3,4,7,8]).
#
# VÌ SAO CHỈ CÀI TRÊN CP-01, không cài mọi CP:
#   Nếu nhiều CP cùng chạy watchdog, chúng có thể đồng thời quyết định "sửa đầy đủ"
#   (xoá webhook config) và đè lên nhau. Mọi thao tác cluster-wide trong repo này
#   đều chạy từ cp-01 — giữ đúng quy ước đó. Đánh đổi đã biết: token CNI là file
#   NODE-LOCAL nên watchdog chỉ tự thấy token của cp-01; bù lại 2 check quan trọng
#   (namespace + DaemonSet) là cluster-wide, và lệnh sửa cũng tác động mọi node.
- name: Cài watchdog tự lành Calico (Bug #8) trên CP-01
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  tasks:
    - name: Copy script + unit systemd
      ansible.builtin.copy:
        src: "../files/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: "calico-selfheal.sh",      dest: "/usr/local/sbin/calico-selfheal.sh",        mode: "0755" }
        - { src: "calico-selfheal.service", dest: "/etc/systemd/system/calico-selfheal.service", mode: "0644" }
        - { src: "calico-selfheal.timer",   dest: "/etc/systemd/system/calico-selfheal.timer",   mode: "0644" }
      register: selfheal_files

    - name: Kiểm cú pháp script trước khi bật (không bật script lỗi)
      ansible.builtin.command:
        cmd: "bash -n /usr/local/sbin/calico-selfheal.sh"
      changed_when: false

    - name: daemon-reload + enable timer
      ansible.builtin.systemd_service:
        name: calico-selfheal.timer
        daemon_reload: true
        enabled: true
        state: started

    # Chạy 1 lần ngay để xác nhận script hoạt động trên cụm này. Trên cụm LÀNH nó
    # phải thoát 0 và KHÔNG ghi log gì — đó là tiêu chí đúng.
    - name: SMOKE-TEST — chạy 1 lần trên cụm đang lành, phải exit 0 và im lặng
      ansible.builtin.command:
        cmd: "/usr/local/sbin/calico-selfheal.sh"
      register: selfheal_smoke
      changed_when: false

    - name: Fail nếu smoke-test có output (nghĩa là script tưởng cụm đang hỏng)
      ansible.builtin.fail:
        msg: >-
          Watchdog vừa cài báo cụm KHÔNG lành ngay sau khi join xong:
          {{ selfheal_smoke.stdout }}
          — kiểm tra namespace calico-system / DaemonSet calico-node / token CNI.
      when: selfheal_smoke.stdout | length > 0

    - name: Báo trạng thái watchdog
      ansible.builtin.debug:
        msg: "Watchdog tự lành Calico đã bật trên {{ inventory_hostname }} — chạy mỗi 3 phút + 150s sau mỗi lần boot. Xem: journalctl -t calico-selfheal"
