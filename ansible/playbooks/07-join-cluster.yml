# 07-join-cluster.yml — Create/match the cluster in Rancher → get a registration token → join.
# Order: SEND the join command to CP-01 → CP-02/03 → workers almost simultaneously (does NOT wait
# for Ready in between — the Rancher RKE2 planner needs to see all three roles
# (control-plane/etcd/worker) registered before it starts installing anything, even the control
# plane; waiting for Ready too early causes a deadlock). Waiting for Ready + verification is all
# done in one final play.
#
# ⚠️ REVIEW (open gap): the Rancher-API cluster-creation flow has never been hand-verified end to
#   end. Uses the Steve API v1 (provisioning.cattle.io) to create the cluster, plus the v3
#   clusterregistrationtoken endpoint for insecureNodeCommand. Field names should be re-checked
#   against whatever Rancher version is actually deployed.
---
- name: "Rancher API — create/match the cluster + get the join command"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/network.yml
    - ../vars/versions.yml
    - ../vars/cluster.yml
  vars:
    api: "{{ rancher_url }}"
    auth_header:
      Authorization: "Bearer {{ rancher_api_token }}"
  tasks:
    # This playbook can run STANDALONE (outside site.yml), so it can't just rely on site.yml's
    # preflight validation — it needs its own guard. It happens to be "safe" today only because the
    # rancher_api_token check below runs before rancher_url gets used — that's accidental task
    # ordering, not a real validation. Made explicit here so it doesn't depend on ordering anymore.
    - name: Fail if rancher_instance isn't in rancher_instances (use_existing only)
      ansible.builtin.fail:
        msg: >-
          rancher_instance="{{ rancher_instance }}" is not in rancher_instances
          ({{ rancher_instances.keys() | list }}) — check deploy-config.yml, or add a new entry
          to group_vars/all/vars.yml (see README.md).
      when: rancher_mode == 'use_existing' and rancher_instance not in rancher_instances

    - name: Fail if rancher_api_token is missing
      ansible.builtin.fail:
        msg: "Missing rancher_api_token (use_existing: set it in the vault; install_new: play 05 sets it automatically)."
      when: rancher_api_token is not defined or rancher_api_token | length == 0

    - name: Verify the Rancher API is alive
      ansible.builtin.uri:
        url: "{{ api }}/v3"
        method: GET
        headers: "{{ auth_header }}"
        validate_certs: false
        status_code: [200]
      register: rancher_ping
      retries: 5
      delay: 10
      until: rancher_ping.status == 200

    # --- new_cluster: create the provisioning cluster via the Steve API ---
    - name: "[new_cluster] Render the provisioning cluster JSON"
      ansible.builtin.set_fact:
        prov_body:
          type: "provisioning.cattle.io.cluster"
          metadata:
            name: "{{ cluster_name }}"
            namespace: "fleet-default"
          spec:
            kubernetesVersion: "{{ rke2_version }}"
            rkeConfig: {}
      when: mode == 'new_cluster'

    - name: "[new_cluster] POST to create the cluster (idempotent — skipped if it already exists)"
      ansible.builtin.uri:
        url: "{{ api }}/v1/provisioning.cattle.io.clusters"
        method: POST
        headers: "{{ auth_header }}"
        body_format: json
        body: "{{ prov_body }}"
        validate_certs: false
        status_code: [201, 200, 409]
      register: create_cluster
      when: mode == 'new_cluster'

    - name: Fetch the provisioning cluster to map its management clusterName
      ansible.builtin.uri:
        url: "{{ api }}/v1/provisioning.cattle.io.clusters/fleet-default/{{ cluster_name }}"
        method: GET
        headers: "{{ auth_header }}"
        validate_certs: false
        status_code: [200]
      register: prov_cluster
      retries: 20
      delay: 10
      until:
        - prov_cluster.status == 200
        - prov_cluster.json.status.clusterName is defined
        - prov_cluster.json.status.clusterName | length > 0

    - name: Set the management cluster id (c-m-xxxx)
      ansible.builtin.set_fact:
        mgmt_cluster_id: "{{ prov_cluster.json.status.clusterName }}"

    - name: Fetch the clusterRegistrationToken (insecureNodeCommand)
      ansible.builtin.uri:
        url: "{{ api }}/v3/clusterregistrationtoken?clusterId={{ mgmt_cluster_id }}"
        method: GET
        headers: "{{ auth_header }}"
        validate_certs: false
        status_code: [200]
      register: crt
      retries: 20
      delay: 10
      until:
        - crt.status == 200
        - crt.json.data | length > 0
        - crt.json.data[0].insecureNodeCommand is defined
        - crt.json.data[0].insecureNodeCommand | length > 0

    - name: Set the base join command (no role flag yet)
      ansible.builtin.set_fact:
        join_base: "{{ crt.json.data[0].insecureNodeCommand }}"

    - name: Save the cluster ID to a file (used by cleanup.yml)
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../.cluster_{{ cluster_name }}.id"
        content: "{{ mgmt_cluster_id }}\n"
        mode: "0644"

    - name: Report the join command
      ansible.builtin.debug:
        msg: "mgmt cluster {{ mgmt_cluster_id }} | join base: {{ join_base }}"

# The Rancher RKE2 planner needs to see all three roles (control-plane, etcd, worker) REGISTERED
# before it starts generating an install plan for ANY node, including the control plane. An earlier
# design ("join CP → wait for CP Ready via kubectl → only then join workers") deadlocked in a
# circle: the CP never became Ready because Rancher was waiting for a worker to register, and the
# worker was never told to join because it was stuck behind the wait for CP. Fixed by separating
# "send the join command" from "wait for Ready" — CP-01, CP-02/03, and workers all get their join
# command sent almost simultaneously (none waits for an earlier node to be Ready), and only the very
# last play waits for every node to become Ready.

# any_errors_fatal — if CP-01 drops off SSH here, the later join plays (CP-02/03, workers) would
# otherwise silently continue and send join commands pointing at a cluster with no control plane at
# all — the worst possible outcome (workers hang indefinitely waiting for a control plane that
# doesn't exist) with nothing failing loudly anywhere. Stopping immediately here is far safer than
# continuing and only discovering it later during verification.
# --- CP-01: SEND the etcd + control-plane join command (does not wait for Ready here) ---
- name: "Join CP-01 (etcd + control-plane) — send the command only, don't wait for Ready"
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Run the join command (etcd + controlplane)
      ansible.builtin.shell:
        cmd: "{{ hostvars['localhost'].join_base }} --etcd --controlplane"
      args:
        creates: /var/lib/rancher/rke2/server/node-token
      register: cp_join

# --- CP-02/03 (if any): SEND the join command (does not wait for Ready here) ---
- name: "Join CP-02/03 — send the command only, don't wait for Ready"
  hosts: cp_nodes
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Skip CP-01 (its join command was already sent above)
      ansible.builtin.meta: end_host
      when: inventory_hostname == groups['cp_nodes'][0]

    - name: Run the join command (etcd + controlplane)
      ansible.builtin.shell:
        cmd: "{{ hostvars['localhost'].join_base }} --etcd --controlplane"
      args:
        creates: /var/lib/rancher/rke2/agent/kubelet.kubeconfig
      register: cp_join2

# --- Workers: SEND the join command RIGHT AWAY (doesn't wait for CP to be Ready) — this is the deadlock fix ---
- name: "Join workers — send the command only, don't wait for Ready"
  hosts: worker_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Run the join command (worker)
      ansible.builtin.shell:
        cmd: "{{ hostvars['localhost'].join_base }} --worker"
      args:
        creates: /var/lib/rancher/rke2/agent/kubelet.kubeconfig
      register: worker_join

# --- Only after EVERY node (CP + worker) has been sent its join command do we wait for Ready + verify ---
- name: "Wait for the whole cluster to be Ready + verify (run from CP-01)"
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    all_cluster_nodes: "{{ (groups['cp_nodes'] | default([])) + (groups['worker_nodes'] | default([])) }}"
    # Retries scale with node count — since CP+worker now join almost simultaneously (the deadlock
    # fix above), a bigger cluster means every node takes longer to become Ready (shared CPU/network
    # contention from everyone pulling images and bootstrapping Calico at once). A fixed retry count
    # that doesn't scale with cluster size isn't enough once there are several CP/worker nodes.
    node_ready_retries_effective: "{{ (node_ready_retries_base | int) + (node_ready_retries_per_node | int) * ((all_cluster_nodes | length) - 1) }}"
  tasks:
    - name: Wait for CP-01 to be Ready (etcd+controlplane must be Ready before other nodes can join)
      ansible.builtin.shell:
        cmd: "{{ rke2_kubectl }} get node $(hostname) -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}'"
      register: cp_ready
      changed_when: false
      retries: "{{ node_ready_retries_effective }}"
      delay: "{{ node_ready_delay }}"
      until: cp_ready.stdout == "True"

    - name: Wait for every remaining node (CP-02/03, workers) to be Ready — checked from CP-01
      ansible.builtin.shell:
        cmd: "{{ rke2_kubectl }} get node {{ item }} -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}'"
      register: node_ready
      changed_when: false
      retries: "{{ node_ready_retries_effective }}"
      delay: "{{ node_ready_delay }}"
      until: node_ready.stdout == "True"
      loop: "{{ all_cluster_nodes | reject('equalto', inventory_hostname) | list }}"
      loop_control:
        label: "{{ item }}"

    # Patching FelixConfiguration.iptablesBackend=Legacy was tried and abandoned entirely — two
    # reasons: (1) `installation.calicoNetwork.iptablesBackend` isn't actually a valid field on the
    # Installation CRD, so it can't be set through HelmChartConfig at all, only via a direct patch;
    # (2) real testing confirmed Ubuntu 24.04 + this Calico version default to nft consistently with
    # kube-proxy — forcing Legacy isn't needed. Patching to Legacy and then reverting it (while
    # debugging) left an orphaned iptables-legacy ruleset behind, with both backends enforced by the
    # kernel at once — any pod created afterward hit a stale catch-all "unknown interface → DROP"
    # rule and lost 100% of its traffic despite correct routes/nft rules. Full mechanism in
    # ../../docs/troubleshooting/networking-and-cni.md (Bug #2's callout and Bug #3).
    # Lesson: never toggle iptablesBackend back and forth on a live cluster. If a new environment
    # genuinely needs Legacy (because kube-proxy uses iptables-legacy), set it ONCE up front, and
    # always pair it with flushing the old backend (task below) to avoid dual-dataplane orphan rules.
    - name: Flush iptables-legacy as a precaution against dual-dataplane orphan rules
      ansible.builtin.shell:
        cmd: >
          iptables-legacy -F; iptables-legacy -X;
          iptables-legacy -t nat -F; iptables-legacy -t nat -X;
          iptables-legacy -t mangle -F; iptables-legacy -t mangle -X;
          iptables-legacy -t raw -F; iptables-legacy -t raw -X;
          true
      changed_when: false

    - name: "VERIFY — CoreDNS is Running"
      ansible.builtin.shell:
        cmd: "{{ rke2_kubectl }} -n kube-system get pods -l k8s-app=kube-dns -o jsonpath='{.items[0].status.containerStatuses[0].ready}'"
      register: coredns
      changed_when: false
      retries: 20
      delay: 10
      until: coredns.stdout == "true"

    # A real functional test instead of assuming nft/Legacy state from configuration — actual DNS
    # resolution is the only evidence that actually matters here.
    - name: "VERIFY — real DNS resolution (kubernetes.default.svc.cluster.local)"
      ansible.builtin.shell:
        cmd: >
          {{ rke2_kubectl }} run dnsverify-{{ 999999 | random }} --image=busybox:1.36 --rm -i
          --restart=Never --command -- nslookup kubernetes.default.svc.cluster.local
      register: dns_verify
      changed_when: false
      retries: 5
      delay: 15
      until: "'Address' in dns_verify.stdout and 'connection timed out' not in dns_verify.stdout"
      failed_when: "'Address' not in dns_verify.stdout"

# --- add_node: patch the Calico Installation on the EXISTING cluster (CIDR autodetection fix) ---
- name: "[add_node] Patch the Calico Installation's CIDRs (runs on cp-01 of the existing cluster)"
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  vars_files:
    - ../vars/network.yml
  tasks:
    - name: Patch nodeAddressAutodetectionV4.cidrs (type=json replace — not a merge)
      ansible.builtin.shell:
        cmd: >
          {{ rke2_kubectl }} patch installation default --type=json
          -p='[{"op":"replace","path":"/spec/calicoNetwork/nodeAddressAutodetectionV4","value":{"cidrs":["{{ calico_vm_cidr }}"]}}]'
      register: calico_patch
      changed_when: "'patched' in calico_patch.stdout"
      failed_when:
        - calico_patch.rc != 0
        - "'no change' not in calico_patch.stdout"
      when: mode == 'add_node'

# ─────────────────────────────────────────────────────────────────────────────
# Self-healing watchdog for the "rancher-webhook blocks creating the calico-system namespace"
# deadlock. Full story (what the deadlock is, why a one-time patch can never close it) is in
# ../../docs/troubleshooting/observability-hub.md#bug-8; the watchdog design itself is in
# ../TROUBLESHOOTING.md.
#
# WHY THIS LIVES IN PLAY 07, NOT ONLY IN 13-data-collector-hub.yml:
#   This bug isn't specific to the hub — it comes from the webhook config Rancher applies to
#   EVERY downstream cluster: `rancher.cattle.io.namespaces.create-non-kubesystem` has
#   failurePolicy=Fail and only exempts `kube-system`, never `calico-system`. Confirmed that a
#   regular workload cluster carries the exact same config and is equally exposed — it just
#   hadn't hit a reboot yet to trigger it. Placing this in play 07 means every cluster gets it,
#   including a freshly created hub (hub creation also runs through play 07).
#
# WHY ONLY ON CP-01, NOT EVERY CP:
#   If multiple CPs ran the watchdog, they could simultaneously decide to run the invasive full
#   repair (removing the webhook config) and step on each other. Every cluster-wide operation in
#   this repo runs from cp-01 — kept consistent with that convention here too. Known trade-off:
#   the CNI token file is node-local, so the watchdog only ever sees cp-01's own token; in
#   exchange, its two key checks (namespace + DaemonSet) are cluster-wide, and its repair actions
#   affect every node.
- name: Install the Calico self-healing watchdog on CP-01
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  tasks:
    - name: Copy the script + systemd units
      ansible.builtin.copy:
        src: "../files/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: "calico-selfheal.sh",      dest: "/usr/local/sbin/calico-selfheal.sh",        mode: "0755" }
        - { src: "calico-selfheal.service", dest: "/etc/systemd/system/calico-selfheal.service", mode: "0644" }
        - { src: "calico-selfheal.timer",   dest: "/etc/systemd/system/calico-selfheal.timer",   mode: "0644" }
      register: selfheal_files

    - name: Check the script's syntax before enabling it (never enable a broken script)
      ansible.builtin.command:
        cmd: "bash -n /usr/local/sbin/calico-selfheal.sh"
      changed_when: false

    - name: daemon-reload + enable the timer
      ansible.builtin.systemd_service:
        name: calico-selfheal.timer
        daemon_reload: true
        enabled: true
        state: started

    # Run it once immediately to confirm it actually works on this cluster. On a healthy cluster it
    # must exit 0 and log nothing at all — that's the pass criterion.
    - name: "SMOKE TEST — run once against a healthy cluster, must exit 0 and stay silent"
      ansible.builtin.command:
        cmd: "/usr/local/sbin/calico-selfheal.sh"
      register: selfheal_smoke
      changed_when: false

    - name: Fail if the smoke test produced any output (means it thinks the cluster is broken)
      ansible.builtin.fail:
        msg: >-
          The watchdog just reported the cluster as UNHEALTHY right after joining finished:
          {{ selfheal_smoke.stdout }}
          — check the calico-system namespace / calico-node DaemonSet / CNI token.
      when: selfheal_smoke.stdout | length > 0

    - name: Report the watchdog's status
      ansible.builtin.debug:
        msg: "Calico self-healing watchdog enabled on {{ inventory_hostname }} — runs every 3 minutes, plus 150s after every boot. See: journalctl -t calico-selfheal"
