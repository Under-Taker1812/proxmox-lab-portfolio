# 12-verify.yml — Full test suite. Fail LOUD nếu bất kỳ check nào sai (không pass lặng lẽ).
# Chạy từ cp-01. Check động (không hardcode số pod).
---
- name: Verify cluster end-to-end
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  vars_files:
    - ../vars/network.yml
    - ../vars/cluster.yml
  environment:
    KUBECONFIG: "{{ rke2_kubeconfig }}"
    # Hardcode PATH chuẩn, KHÔNG dùng ansible_env (undefined khi run_only cô lập play này — xem
    # BUG-AND-DEBUG.md "helm not found" 2026-08-18, chi tiết ở 08-ceph-csi.yml). Play này hiện chỉ
    # gọi kubectl (đã có sẵn qua rke2_bin) nhưng để nhất quán, tránh lặp lại bug nếu sau này thêm
    # task cần helm/binary khác trong /usr/local/bin.
    PATH: "{{ rke2_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: "[1] Tất cả node Ready"
      ansible.builtin.shell:
        cmd: "kubectl get nodes --no-headers | grep -vw Ready | wc -l"
      register: nodes_notready
      changed_when: false
      failed_when: nodes_notready.stdout | int != 0

    # BUG (2026-07-10, xem rke2-calico-netfilter-bugs.md Bug #5+#6): ĐÃ BỎ check "nft nat KHÔNG tồn
    # tại" + "FelixConfiguration=Legacy" — 2 giả định này SAI trên Ubuntu 24.04 (mặc định dùng NFT
    # nhất quán với kube-proxy, không cần/không nên ép Legacy). Check [5] DNS resolve thật bên dưới
    # mới là bằng chứng đáng tin cho việc mạng pod-to-pod hoạt động đúng, không phải trạng thái
    # Legacy/nft giả định. Chỉ còn giữ lại flush phòng ngừa dual-dataplane orphan rules (Bug #6) —
    # an toàn dù cluster có từng bị patch Legacy/revert qua lại hay không.
    - name: "[2] Flush iptables-legacy phòng ngừa dual-dataplane orphan rules (Bug #6)"
      ansible.builtin.shell:
        cmd: >
          iptables-legacy -F; iptables-legacy -X;
          iptables-legacy -t nat -F; iptables-legacy -t nat -X;
          iptables-legacy -t mangle -F; iptables-legacy -t mangle -X;
          iptables-legacy -t raw -F; iptables-legacy -t raw -X;
          true
      changed_when: false

    # BUG #5 (2026-08-14 chiều, xem data-collector-hub-setup.md Bug #8): mọi check hiện có đều
    # hỏi "cái đang tồn tại có KHOẺ không" — KHÔNG cái nào hỏi "cái phải tồn tại có TỒN TẠI không".
    # Hệ quả thật: hub VM 201 mất SẠCH namespace `calico-system` (Rancher webhook chặn tạo lại),
    # cụm không tạo được pod mới nào — nhưng check `READY x/y` vẫn báo "0 pod chưa ready", vì
    # namespace rỗng thì KHÔNG CÓ pod nào để bị tính là chưa ready. Xanh giả hoàn toàn.
    # Đây là mắt thứ tư của cùng chuỗi lỗi: phase Running → container Ready → delivery OK →
    # COMPONENT EXISTS. Check này bịt chiều còn lại.
    #
    # Dùng DaemonSet desiredNumberScheduled vs numberReady, KHÔNG đếm "≥1 pod Ready" — trên cụm
    # nhiều node, mất Calico ở 1 node mà node kia còn thì "≥1" vẫn PASS trong khi cụm hỏng một nửa.
    - name: "[3] Thành phần BẮT BUỘC PHẢI TỒN TẠI (Calico ns + DaemonSet đủ trên mọi node)"
      ansible.builtin.shell:
        cmd: >
          set -e;
          kubectl get --raw=/readyz >/dev/null 2>&1 ||
            { echo "KHONG GOI DUOC APISERVER (kubectl loi/kubeconfig sai/PATH thieu) — KHONG ket luan duoc ve calico"; exit 0; };
          kubectl get ns calico-system >/dev/null 2>&1 || { echo "THIEU HAN namespace calico-system"; exit 0; };
          out=$(kubectl -n calico-system get ds calico-node
                -o jsonpath='{.status.desiredNumberScheduled}|{.status.numberReady}' 2>/dev/null || true);
          d=${out%%|*}; r=${out##*|};
          if [ -z "$d" ]; then echo "THIEU HAN DaemonSet calico-node"; exit 0; fi;
          if [ "$d" -lt 1 ]; then echo "DaemonSet calico-node desired=0 (khong nham node nao)"; exit 0; fi;
          if [ "${r:-0}" -ne "$d" ]; then echo "calico-node CHUA DU: ready=${r:-0}/$d"; exit 0; fi;
          true
      register: required_components
      changed_when: false
      failed_when: required_components.stdout | length > 0

    - name: "[3b] Watchdog tự lành Calico đang bật (phòng deadlock webhook lúc boot)"
      ansible.builtin.shell:
        cmd: "systemctl is-enabled calico-selfheal.timer 2>/dev/null || echo CHUA-CAI"
      register: selfheal_timer
      changed_when: false
      failed_when: false

    - name: "[3b] Cảnh báo nếu watchdog chưa bật (không fail — chỉ nhắc)"
      ansible.builtin.debug:
        msg: >-
          ⚠️ Watchdog `calico-selfheal.timer` CHƯA được bật trên node này
          ({{ selfheal_timer.stdout | trim }}). Cụm vẫn chạy, nhưng nếu reboot mà trúng
          deadlock webhook ⟷ Calico thì sẽ KHÔNG tự phục hồi. Xem
          data-collector-hub-setup.md Bug #8 / self-heal/.
      when: "'enabled' not in selfheal_timer.stdout"

    # BUG #4 (2026-08-14): bản cũ `grep -v Running | wc -l` có HAI lỗ pass giả cùng lúc:
    #   (a) pod `0/1 Running` (phase Running nhưng container chưa Ready) vẫn lọt — đúng loại lỗi
    #       đã để data-collector-hub sống "xác sống" 3 ngày 07→11/08 mà không ai biết;
    #   (b) KHÔNG có pod CoreDNS nào thì output rỗng → `wc -l` = 0 → PASS, tức mất sạch DNS lại
    #       báo xanh. So READY x/y thật + đếm số pod, in ra pod nào sai để fail loud.
    - name: "[4] CoreDNS đủ pod + Ready thật (bắt cả 0/1 Running lẫn 'không có pod nào')"
      ansible.builtin.shell:
        cmd: >
          kubectl -n kube-system get pods -l k8s-app=kube-dns --no-headers |
          awk 'BEGIN{n=0} { n++; split($2,a,"/"); if (a[1] != a[2] || $3 != "Running") print "CHUA READY: "$0 }
               END{ if (n == 0) print "KHONG CO POD CoreDNS NAO" }'
      register: coredns
      changed_when: false
      failed_when: coredns.stdout | length > 0

    - name: Fail nếu không xác định được rancher_ip trước khi verify DNS (không còn fallback IP cứng)
      ansible.builtin.fail:
        msg: "hostvars['localhost'].rancher_ip rỗng/chưa xác định — kiểm tra rancher_instances/play 05."
      when: hostvars['localhost'].rancher_ip is not defined or hostvars['localhost'].rancher_ip | length == 0

    # BUG (2026-07-15, tên pod): bản cũ dùng $RANDOM trong tên pod — $RANDOM là bash builtin, nhưng
    # ansible.builtin.shell mặc định chạy qua /bin/sh (dash trên Ubuntu), không hiểu $RANDOM
    # nên nó bị thay bằng chuỗi rỗng → tên pod "dns-verify-" (kết thúc bằng dấu gạch ngang)
    # → K8s từ chối vì vi phạm RFC 1123. Dùng đúng pattern đã an toàn ở 07-join-cluster.yml:
    # để Ansible tự render số ngẫu nhiên qua Jinja (| random) TRƯỚC khi shell nhận lệnh, không
    # phụ thuộc shell nào đang chạy.
    #
    # BUG #2 (2026-07-30, xem BUG-AND-DEBUG.md): `kubectl run --rm -i` KHÔNG có TTY thật khi chạy
    # qua ansible.builtin.shell (không phải interactive terminal) — client attach vào stdout của
    # pod và bản thân pod (nslookup chạy xong trong ~1s rồi exit, --rm xoá NGAY) đua nhau; client
    # có thể attach XONG SAU khi container đã bị xoá, mất trắng output dù DNS resolve đúng thật.
    # Thử `--tty`/`-t` KHÔNG giải quyết được (cùng lý do: không có TTY thật để gán). Fix triệt để:
    # tách hẳn 3 bước — tạo pod KHÔNG --rm → chờ phase Succeeded (bằng chứng thật, không đoán thời
    # gian) → đọc log qua `kubectl logs` (không phụ thuộc attach stream nữa) → dọn pod ở `always`
    # (chạy dù bước nào ở trên fail, không để lại rác).
    # BUG #3 (2026-08-14): tên pod đặt trong `vars:` cấp block → Ansible render biến LƯỜI, lặp lại
    # ở TỪNG task, nên `999999 | random` sinh số MỚI mỗi lần: [5a] tạo pod tên A, [5b] chờ tên B
    # (NotFound → fail), [5d] xoá tên C (pod A thành rác). Cùng họ với 2 bug tên pod ở trên: giá trị
    # phải được VẬT CHẤT HOÁ 1 lần rồi mới dùng. `set_fact` lưu ra chuỗi thật, không phải biểu thức.
    - name: "[5] Chốt tên pod test DNS (1 lần duy nhất cho cả block)"
      ansible.builtin.set_fact:
        dns_pod_name: "dns-verify-{{ 999999 | random }}"

    - name: "[5] DNS resolve từ pod tạm → đúng IP Rancher"
      block:
        - name: "[5a] Tạo pod test DNS (không --rm, tránh race attach/xoá)"
          ansible.builtin.command:
            cmd: >
              kubectl run {{ dns_pod_name }} --image=busybox --restart=Never --
              nslookup rancher.{{ hostvars['localhost'].rancher_ip }}.{{ sslip_domain }}
          changed_when: true

        - name: "[5b] Chờ pod Succeeded (bằng chứng thật thay vì đoán thời gian)"
          ansible.builtin.command:
            cmd: "kubectl wait --for=jsonpath={.status.phase}=Succeeded pod/{{ dns_pod_name }} --timeout=60s"
          changed_when: false

        - name: "[5c] Đọc log thật qua kubectl logs (không phụ thuộc attach stream)"
          ansible.builtin.command:
            cmd: "kubectl logs {{ dns_pod_name }}"
          register: dns_test
          changed_when: false
          failed_when: hostvars['localhost'].rancher_ip not in dns_test.stdout
      always:
        - name: "[5d] Dọn pod test DNS"
          ansible.builtin.command:
            cmd: "kubectl delete pod {{ dns_pod_name }} --ignore-not-found --wait=false"
          changed_when: false
          failed_when: false

    - name: "[6] cattle-cluster-agent Running"
      ansible.builtin.shell:
        cmd: "kubectl -n cattle-system get pods -l app=cattle-cluster-agent --no-headers | grep -c Running || true"
      register: agent
      changed_when: false
      failed_when: agent.stdout | int < 1

    # BUG #4 (2026-08-14, xem [4] ở trên): `grep -v Running` KHÔNG bắt được `0/1 Running`.
    # So thẳng cột READY (x/y) thay vì tin vào cột STATUS; loại Completed (job chạy xong,
    # READY 0/1 là đúng). In tên pod sai để log nói thẳng cái nào hỏng, không chỉ đếm số.
    - name: "[7] Không pod nào lỗi toàn cluster (bắt cả 0/1 Running)"
      ansible.builtin.shell:
        cmd: >
          kubectl get pods -A --no-headers |
          awk '$4 != "Completed" { split($3,a,"/"); if (a[1] != a[2]) print $1"/"$2"  READY="$3"  STATUS="$4 }'
      register: bad_pods
      changed_when: false
      failed_when: bad_pods.stdout | length > 0

    - name: "[8a] Namespace ceph-csi-rbd tồn tại (new_cluster)"
      ansible.builtin.command:
        cmd: kubectl get namespace ceph-csi-rbd
      register: csi_ns
      changed_when: false
      failed_when: csi_ns.rc != 0
      when: mode == 'new_cluster'

    - name: "[8b] ceph-csi pods Running (new_cluster)"
      ansible.builtin.shell:
        cmd: "kubectl -n ceph-csi-rbd get pods --no-headers | grep -v Running | wc -l"
      register: csi
      changed_when: false
      failed_when: csi.stdout | int != 0
      when: mode == 'new_cluster'

    - name: "[9] PVC smoke test Bound (new_cluster)"
      ansible.builtin.shell:
        cmd: |
          cat <<'EOF' | kubectl apply -f - >/dev/null
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata: { name: verify-pvc, namespace: default }
          spec:
            accessModes: ["ReadWriteOnce"]
            resources: { requests: { storage: 1Gi } }
            storageClassName: csi-rbd-sc
          EOF
          for i in $(seq 1 10); do
            s=$(kubectl get pvc verify-pvc -n default -o jsonpath='{.status.phase}')
            [ "$s" = "Bound" ] && break; sleep 3
          done
          echo "PHASE=$s"; kubectl delete pvc verify-pvc -n default --wait=false >/dev/null
      register: pvc_verify
      changed_when: false
      failed_when: "'PHASE=Bound' not in pvc_verify.stdout"
      when: mode == 'new_cluster'

    # --- Check [10]/[11] cập nhật 2026-07-15: cluster test không còn cài Prometheus/ES/Kibana
    # local nữa (xem playbooks/09-monitoring.yml + 10-logging.yml) — agent nhẹ nằm ở namespace
    # `monitoring`/`logging`. Check cũ trỏ `cattle-monitoring-system`/`cattle-logging-system` đã
    # BỎ vì namespace đó không còn tồn tại → `kubectl get pods` trả rỗng → check cũ PASS LẶNG LẼ
    # dù không verify được gì thật (đúng loại bug repo này từng gặp — "không tin checklist").
    # Verify dữ liệu THẬT sự đã tới data-collector-hub vẫn phải làm TAY ở phía hub (cross-cluster,
    # ngoài phạm vi 1 playbook) — xem debug task cuối 09-monitoring.yml/10-logging.yml.
    - name: "[10a] Namespace monitoring tồn tại (new_cluster)"
      # Check riêng bắt buộc — pipeline "kubectl | grep | wc -l" ở [10b] có rc luôn = 0 (rc của
      # wc, không phải kubectl) nên tự nó KHÔNG phát hiện được namespace thiếu (silent-pass bug
      # vừa fix ở check [11]).
      ansible.builtin.command:
        cmd: kubectl get namespace monitoring
      register: mon_ns
      changed_when: false
      failed_when: mon_ns.rc != 0
      when: mode == 'new_cluster'

    - name: "[10b] Monitoring agent pods Running — namespace monitoring (new_cluster)"
      ansible.builtin.shell:
        cmd: "kubectl -n monitoring get pods --no-headers | grep -v Running | grep -v Completed | wc -l"
      register: mon
      changed_when: false
      failed_when: mon.stdout | int != 0
      when: mode == 'new_cluster'

    - name: "[11] Fluent Bit DaemonSet đủ pod mỗi node — namespace logging (new_cluster)"
      ansible.builtin.shell:
        cmd: >
          kubectl -n logging get ds -o jsonpath='{range .items[*]}{.status.desiredNumberScheduled}-{.status.numberReady} {end}'
      register: ds
      changed_when: false
      # KHÔNG dùng "2>/dev/null || echo 0-0" như bản cũ — fallback đó khiến check PASS lặng lẽ
      # khi namespace không tồn tại (đúng bug vừa fix ở check [10]/[11] phía trên). Thay vào đó
      # fail rõ ràng ở CẢ 3 trường hợp: lệnh lỗi (rc!=0, vd namespace không tồn tại), 0 DaemonSet
      # nào tìm thấy (stdout rỗng dù rc=0), hoặc có DaemonSet nhưng desired != ready.
      failed_when: >-
        ds.rc != 0 or
        ds.stdout | trim | length == 0 or
        (ds.stdout.split() | map('trim') | list | map('regex_replace', '^(\\d+)-(\\d+)$', '\\1') | list) !=
        (ds.stdout.split() | map('trim') | list | map('regex_replace', '^(\\d+)-(\\d+)$', '\\2') | list)
      when: mode == 'new_cluster'

    - name: ✅ VERIFY PASS
      ansible.builtin.debug:
        msg: "Tất cả check pass cho cluster {{ cluster_name }} (mode {{ mode }})."
