# 08-ceph-csi.yml — [new_cluster] Connects RKE2 to Ceph.
#   ceph_create_pool=false (default): reuse the existing 'kubernetes' pool + 'kubernetes' user (safe).
#   ceph_create_pool=true: create a '<cluster>-pvc' pool + a dedicated user (isolation, costs PG budget).
# Several real bugs fixed along the way are encoded directly into ceph-csi-values.yaml.j2 and the
# tasks below (DaemonSet taint scheduling, dynamic provisioner replica count).
#
# ⚠️ REVIEW (open gap): the create_pool=true branch touches the Ceph layer directly (ceph osd pool
#   create). Defaults to false. Only enable it if you understand the PG budget (8 OSDs ≈ 800 PGs,
#   32 PGs per pool here).
---
- name: Decide the pool + user (on the control node)
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/cluster.yml
  tasks:
    - name: Set pool/user based on ceph_create_pool
      ansible.builtin.set_fact:
        ceph_pool: "{{ (cluster_name + '-pvc') if ceph_create_pool else ceph_pool_reuse_name }}"
        ceph_csi_user: "{{ cluster_name if ceph_create_pool else ceph_pool_reuse_user }}"

- name: "[Proxmox] Prepare the pool + keyring"
  hosts: "{{ (groups['proxmox_hosts'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  vars_files:
    - ../vars/network.yml
    - ../vars/cluster.yml
  vars:
    ceph_pool: "{{ hostvars['localhost'].ceph_pool }}"
    ceph_csi_user: "{{ hostvars['localhost'].ceph_csi_user }}"
  tasks:
    - name: Verify Ceph HEALTH (stop condition if not OK)
      ansible.builtin.command:
        cmd: ceph health
      register: ceph_health
      changed_when: false
      failed_when: "'HEALTH_ERR' in ceph_health.stdout"

    - name: "[create_pool] Create the RBD pool"
      ansible.builtin.command:
        cmd: "ceph osd pool create {{ ceph_pool }} {{ ceph_pool_pg_num }}"
      register: pool_create
      changed_when: "'created' in pool_create.stdout"
      failed_when:
        - pool_create.rc != 0
        - "'already exists' not in pool_create.stderr"
      when: ceph_create_pool | bool

    - name: "[create_pool] Enable the rbd application + set a quota"
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - "ceph osd pool application enable {{ ceph_pool }} rbd"
        - "ceph osd pool set-quota {{ ceph_pool }} max_bytes {{ ceph_pool_quota }}"
      changed_when: true
      when: ceph_create_pool | bool

    - name: "[create_pool] Create a user scoped to this pool"
      ansible.builtin.command:
        cmd: >
          ceph auth get-or-create client.{{ ceph_csi_user }}
          mon 'profile rbd'
          osd 'profile rbd pool={{ ceph_pool }}'
          mgr 'profile rbd pool={{ ceph_pool }}'
      changed_when: true
      when: ceph_create_pool | bool

    - name: Fetch the user's key (read directly — avoids l/I transcription typos)
      ansible.builtin.command:
        cmd: "ceph auth get-key client.{{ ceph_csi_user }}"
      register: ceph_key
      changed_when: false

    - name: Pass the key to localhost
      ansible.builtin.set_fact:
        ceph_csi_user_key: "{{ ceph_key.stdout | trim }}"
      delegate_to: localhost
      delegate_facts: true

- name: "[CP-01] Install ceph-csi + Secret + StorageClass + test PVC"
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  vars_files:
    - ../vars/network.yml
    - ../vars/versions.yml
    - ../vars/cluster.yml
  vars:
    ceph_pool: "{{ hostvars['localhost'].ceph_pool }}"
    ceph_csi_user: "{{ hostvars['localhost'].ceph_csi_user }}"
    ceph_csi_user_key: "{{ hostvars['localhost'].ceph_csi_user_key }}"
    # The ceph-csi-rbd DaemonSet (node-plugin) runs on every node, and every node pulls its ~760MB
    # image AT THE SAME TIME over the same slow lab network — the more nodes, the more concurrent
    # pulls, the slower it gets. A wait time that scales with node count replaces a fixed timeout
    # that stopped being enough once the cluster grew past a couple of nodes.
    total_cluster_nodes: "{{ (groups['cp_nodes'] | default([]) | length) + (groups['worker_nodes'] | default([]) | length) }}"
    ceph_csi_wait_effective: "{{ (ceph_csi_wait_base | int) + (ceph_csi_wait_per_node | int) * ((total_cluster_nodes | int) - 1) }}"
    # ceph-csi-values.yaml.j2 used to hardcode `provisioner.replicaCount: 2`, intended to match "how
    # many workers can actually schedule it" (the provisioner binds hostPort 8681, so at most 1
    # pod/node, and CPs are tainted so they don't count) — correct for the topology at the time (1
    # CP + 2 workers). Once the default cluster shrank to 1 CP + 1 worker, nobody updated that
    # hardcoded "2" — the second replica stayed Pending forever ("didn't have free ports" on the one
    # worker already running a replica, "untolerated taint" on the CP — no node could take it).
    # Fixed by computing the replica count dynamically from the real number of workers (the original
    # intent of the old comment, just not hardcoded) — it now matches automatically whether the
    # cluster has 1, 2, or more workers. Floored at 1 as a safety minimum.
    ceph_csi_provisioner_replicas: "{{ [(groups['worker_nodes'] | default([]) | length), 1] | max }}"
  environment:
    KUBECONFIG: "{{ rke2_kubeconfig }}"
    # Never rely on ansible_env.PATH here — this play has gather_facts: false, so ansible_env is
    # only populated if some OTHER play happened to gather facts earlier in the SAME
    # `ansible-playbook` invocation (facts are cached per host for the whole run, not per play).
    # Running the full site.yml pipeline works by accident (04-prep-vms.yml gathers facts first),
    # but running this play in isolation via `run_only` leaves ansible_env.PATH on its hardcoded
    # fallback, missing /usr/local/bin (where get-helm-3 installs helm) — "helm: command not found".
    # Hardcoded to the standard Debian/Ubuntu PATH instead, independent of gather_facts.
    PATH: "{{ rke2_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: Install Helm on cp-01 (if not already present)
      ansible.builtin.shell:
        cmd: "curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
      args:
        creates: /usr/local/bin/helm

    - name: helm repo add ceph-csi
      ansible.builtin.command:
        cmd: "helm repo add {{ helm_repos.ceph_csi.name }} {{ helm_repos.ceph_csi.url }}"
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when:
        - repo_add.rc != 0
        - "'already exists' not in repo_add.stderr"

    - name: helm repo update
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    - name: Render the ceph-csi values file
      ansible.builtin.template:
        src: ../templates/ceph-csi-values.yaml.j2
        dest: /root/ceph-csi-values.yaml
        mode: "0600"

    - name: helm install ceph-csi-rbd
      ansible.builtin.command:
        cmd: >
          helm upgrade --install ceph-csi-rbd {{ ceph_csi_chart }}
          --namespace ceph-csi-rbd --create-namespace
          -f /root/ceph-csi-values.yaml
      register: csi_install
      changed_when: "'STATUS: deployed' in csi_install.stdout"

    - name: "Wait for ceph-csi pods to be Ready (~760MB image × {{ total_cluster_nodes }} nodes pulling concurrently on a slow lab network)"
      ansible.builtin.shell:
        cmd: "kubectl -n ceph-csi-rbd get pods --no-headers | grep -v Running | grep -v Completed | wc -l"
      register: csi_pods
      changed_when: false
      retries: "{{ (ceph_csi_wait_effective | int / 15) | int }}"
      delay: 15
      until: csi_pods.stdout | int == 0

    # The PVC test right after this used to fail with "PHASE=Pending" after 30s — initially blamed
    # on too short a timeout, but the real cause was that "pod Running" above only confirms the
    # container started, NOT that node-driver-registrar has finished registering the driver with
    # kubelet's plugin-watcher (a separate step with its own delay). Waits on real evidence from
    # `csinodes` instead of blindly raising a timeout — this repo's "never trust a checklist"
    # principle applied here too.
    #
    # A second bug in this exact task, only surfacing the first time it actually ran end to end:
    #   (a) Wrong comparison: the original version compared "registered" against the TOTAL count of
    #       csinodes. The ceph-csi node-plugin DaemonSet has no toleration, so it deliberately never
    #       runs on the tainted CP node — that CP's csinode permanently reports `spec.drivers = nil`
    #       — so the condition could never be true on a cluster with a dedicated CP. Real numbers:
    #       DaemonSet desired=1, ready=1, only the worker ever registers.
    #   (b) A crash: the jsonpath filter `[?(@.name==...)]` breaks on a `drivers: nil` value
    #       ("<nil> is not array or slice and cannot be filtered"), making the whole command return a
    #       nonzero exit code and registered=0 even though the worker HAD registered — fixing (a)
    #       alone wouldn't have helped while this jsonpath stayed in place.
    # Fixed by comparing against the DaemonSet's own `desiredNumberScheduled` (which already accounts
    # for taints/nodeSelector — no node-count guessing needed), and reading it with
    # `custom-columns` (prints `<none>` on nil instead of crashing) instead of a jsonpath filter.
    - name: Wait for the CSI driver to register with kubelet on every node the DaemonSet actually targets (real evidence, not a guess)
      ansible.builtin.shell:
        cmd: |
          desired=$(kubectl -n ceph-csi-rbd get ds ceph-csi-rbd-nodeplugin -o jsonpath='{.status.desiredNumberScheduled}')
          registered=$(kubectl get csinodes -o custom-columns=DRIVERS:.spec.drivers[*].name --no-headers | grep -c 'rbd.csi.ceph.com' || true)
          echo "registered=$registered desired=${desired:-0}"
          [ -n "$desired" ] && [ "$desired" -gt 0 ] && [ "$registered" -ge "$desired" ]
      register: csi_registered
      changed_when: false
      retries: 12
      delay: 5
      until: csi_registered.rc == 0

    - name: Render the Secret + StorageClass
      ansible.builtin.template:
        src: "../templates/{{ item }}.j2"
        dest: "/root/{{ item }}"
        mode: "0600"
      loop:
        - csi-rbd-secret.yaml
        - csi-rbd-storageclass.yaml

    - name: Apply the Secret + StorageClass
      ansible.builtin.command:
        cmd: "kubectl apply -f /root/{{ item }}"
      loop:
        - csi-rbd-secret.yaml
        - csi-rbd-storageclass.yaml
      register: sc_apply
      changed_when: "'created' in sc_apply.stdout or 'configured' in sc_apply.stdout"

    - name: Test that a PVC binds (create → wait → delete)
      ansible.builtin.shell:
        cmd: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: csi-smoke-test
            namespace: default
          spec:
            accessModes: ["ReadWriteOnce"]
            resources: { requests: { storage: 1Gi } }
            storageClassName: csi-rbd-sc
          EOF
          for i in $(seq 1 {{ (timeout_pvc_bound / 3) | int }}); do
            s=$(kubectl get pvc csi-smoke-test -n default -o jsonpath='{.status.phase}')
            [ "$s" = "Bound" ] && break
            sleep 3
          done
          echo "PHASE=$s"
          kubectl delete pvc csi-smoke-test -n default --wait=false
      register: pvc_test
      changed_when: false
      failed_when: "'PHASE=Bound' not in pvc_test.stdout"
