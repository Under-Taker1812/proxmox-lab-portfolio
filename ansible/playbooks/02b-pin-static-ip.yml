# 02b-pin-static-ip.yml — [OPTIONAL, opt-in via pin_static_ip: true in cluster_nodes] Converts the
# workload-VLAN NIC from DHCP to static, reusing the SAME IP that was already assigned via DHCP at
# clone time (the IP doesn't change — it just stops being re-requested on every boot). Runs right
# after play 02 (DHCP IP + SSH already up), always imported in site.yml like play 02, but is a
# no-op if no VM has pin_static_ip enabled.
#
# For VMs that need a permanently stable IP — typically the Rancher management node (role: rancher)
# and the single-node observability hub (see playbooks/13-data-collector-hub.yml). Root cause this
# solves: on a single-node control plane, a DHCP-assigned IP that changes across a reboot no longer
# matches the node-ip hardcoded into RKE2's config at install time — etcd fails to bind, and the
# whole node cascades down from there. This does NOT apply to a normal multi-node K8s cluster's
# CP/worker VMs — nothing in a multi-node cluster hard-depends on one fixed IP the way a
# single-node etcd advertise-address does.
#
# How to enable it (deploy-config.yml, cluster_nodes):
#   - { role: "rancher", ram: 8192, cpu: 4, disk: 50, target_node: "proxmox-1", pin_static_ip: true }
#
# ⚠️ IMPORTANT LIMITATION (read before enabling) — this playbook only changes configuration ON THE
# VM SIDE (netplan); it never touches the DHCP server managing the workload VLAN:
#   - Risk: if that IP's old DHCP lease expires WHILE the VM has already switched to static (so it's
#     no longer sending renewal requests), the DHCP server COULD hand that same IP to a different
#     device/VM — an IP conflict. True safety needs one extra step AT THE DHCP SERVER (exclude this
#     IP from the dynamic pool, or add a MAC-based reservation) — that's outside this repo's scope
#     (it's the router/DHCP server's job, not Proxmox's) and has to be done by hand.
#   - The upside in exchange: when the VM is destroyed (cleanup.yml), there's nothing extra to clean
#     up on the Ansible side — the IP automatically becomes available again for the DHCP server to
#     hand out, because Ansible never created a hard reservation at the server layer, only
#     configuration at the client (VM) layer — once the client is gone, so is its static config,
#     with no separate cleanup needed.
#
# Technique: the original DHCP netplan file is never deleted (its exact filename on template 101
# isn't guaranteed, so deleting it blind is risky). Instead this reuses the netplan merge behavior
# already relied on elsewhere in this repo (see templates/60-storage.yaml.j2): multiple netplan
# files for the SAME interface get merged, and for a key present in more than one file, the file
# that sorts LAST alphabetically wins — so file 61-... (sorting after the default 50-cloud-init)
# setting dhcp4:false overrides that one key from the original file, without needing to know or
# touch its name.
---
- name: Pin a static IP (reusing the existing DHCP-assigned IP) for VMs that need one
  hosts: static_ip_pending
  gather_facts: false
  become: true
  vars_files:
    - ../vars/network.yml
  tasks:
    - name: Auto-detect the interface currently holding the DHCP IP (ansible_host) — never assume the NIC name
      ansible.builtin.shell:
        cmd: "ip -4 -o addr show | grep '{{ ansible_host }}/' | awk '{print $2}'"
      register: detected_iface
      changed_when: false
      failed_when: detected_iface.stdout | trim == ''

    - name: Auto-detect the current gateway (read from the live DHCP lease, never hardcoded)
      ansible.builtin.shell:
        cmd: "ip route show default | awk '{print $3}' | head -1"
      register: detected_gw
      changed_when: false
      failed_when: detected_gw.stdout | trim == ''

    - name: Set the interface/gateway facts
      ansible.builtin.set_fact:
        vlan_vm_iface: "{{ detected_iface.stdout | trim }}"
        vlan_vm_gateway: "{{ detected_gw.stdout | trim }}"

    - name: Render the static netplan file (reuses the existing DHCP IP, netmask from net_vlan_vm.cidr, gateway/DNS auto-detected)
      ansible.builtin.template:
        src: ../templates/61-vlan-vm-static.yaml.j2
        dest: /etc/netplan/61-vlan-vm-static.yaml
        mode: "0600"
      register: netplan_static_file

    - name: netplan apply
      ansible.builtin.command:
        cmd: netplan apply
      when: netplan_static_file.changed

    - name: VERIFY — SSH is still alive on the same old IP (a bad netplan would drop the connection right here)
      ansible.builtin.wait_for_connection:
        timeout: 60
        delay: 5

    - name: VERIFY — gateway is still reachable (only DHCP renewal should be gone, real routing must be intact)
      ansible.builtin.command:
        cmd: "ping -c 2 -W 2 {{ vlan_vm_gateway }}"
      register: gw_ping
      changed_when: false
      retries: 3
      delay: 5
      until: gw_ping.rc == 0

    - name: "SMOKE TEST, phase 02b — PASS"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: IP {{ ansible_host }} switched from DHCP to static
          (interface {{ vlan_vm_iface }}, gateway {{ vlan_vm_gateway }}). Reminder: the workload
          VLAN's DHCP server has NOT yet had this IP excluded from its dynamic pool — see the
          warning at the top of this playbook.
