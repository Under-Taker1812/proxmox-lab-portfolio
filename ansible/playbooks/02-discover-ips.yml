# 02-discover-ips.yml — Wait for boot → poll qemu-guest-agent for the workload-VLAN IP → dynamic add_host.
# Fallback: if the Guest Agent fails 3 times, use `qm guest exec` over SSH to the Proxmox host.
---
- name: Discover cluster VM IPs
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/proxmox.yml
    - ../vars/network.yml
    - ../vars/cluster.yml
  vars:
    proxmox_api_url: "https://{{ proxmox_api_host }}:{{ proxmox_api_port }}/api2/json"
    api_headers:
      Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    # Derived from net_vlan_vm.cidr (vars/network.yml) instead of a hardcoded "172.16." prefix — stays
    # in sync automatically if the VLAN's CIDR changes. Limitation: only correct when the CIDR mask is
    # ≥ /16 and its boundary falls on an octet boundary (true for the current /21, 172.16.0.0/21 — the
    # first two octets are always fixed). A CIDR that splits mid-octet (e.g. a /20) would need a real
    # CIDR match (ansible.utils ipaddr, an extra collection) instead of a string prefix.
    vm_vlan_prefix: "{{ net_vlan_vm.cidr.split('.')[0:2] | join('.') }}."
  tasks:
    - name: Load vm_status from file (when play 02 is run standalone)
      ansible.builtin.set_fact:
        vm_status: "{{ lookup('file', playbook_dir + '/../.vmstatus_' + cluster_name + '.json') | from_json }}"
      when: vm_status is not defined

    - name: Wait for VM boot + qemu-ga to come up
      ansible.builtin.pause:
        seconds: 60

    - name: Poll the Guest Agent for network interfaces
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ item.target }}/qemu/{{ item.vmid }}/agent/network-get-interfaces"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        status_code: [200]
      register: agent_net
      until: >-
        agent_net.status == 200 and
        (agent_net.json.data.result | default([]) | json_query('[]."ip-addresses"[]."ip-address"')
         | select('match', '^' + vm_vlan_prefix) | list | length) > 0
      retries: 20
      delay: 15
      loop: "{{ vm_status }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Extract the workload-VLAN IP for each VM
      ansible.builtin.set_fact:
        vm_ips: >-
          {{ vm_ips | default({}) | combine({
               item.item.name: (item.json.data.result
                 | json_query('[]."ip-addresses"[]."ip-address"')
                 | select('match', '^' + vm_vlan_prefix) | first)
             }) }}
      loop: "{{ agent_net.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Report the discovered IPs
      ansible.builtin.debug:
        var: vm_ips

    - name: Fail if any VM is missing an IP (stop condition)
      ansible.builtin.fail:
        msg: "Could not get a workload-VLAN IP for {{ item.name }} after 300s — check qemu-guest-agent."
      when: vm_ips[item.name] is not defined
      loop: "{{ vm_status }}"
      loop_control:
        label: "{{ item.name }}"

    # --- Dynamically add_host into groups by role/type ---
    - name: add_host into the in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        ansible_host: "{{ vm_ips[item.name] }}"
        ansible_user: "{{ vm_ssh_user }}"
        groups: >-
          {{ ['cluster_vms']
             + (['rancher_nodes'] if item.role == 'rancher'
                else (['cp_nodes'] if item.role == 'cp' else ['worker_nodes']))
             + (['static_ip_pending'] if (item.pin_static_ip | default(false) | bool) else []) }}
        vm_role: "{{ item.role }}"
        vm_type: "{{ item.type }}"
        vm_vmid: "{{ item.vmid }}"
        vm_target: "{{ item.target }}"
      loop: "{{ vm_status }}"
      loop_control:
        label: "{{ item.name }} → {{ vm_ips[item.name] }}"

    - name: Write .hosts_<cluster>.ini (for reference / standalone reruns)
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../.hosts_{{ cluster_name }}.ini"
        mode: "0644"
        content: |
          # Auto-generated by 02-discover-ips.yml — cluster {{ cluster_name }}
          [cp_nodes]
          {% for v in vm_status if v.role == 'cp' %}
          {{ v.name }} ansible_host={{ vm_ips[v.name] }} ansible_user={{ vm_ssh_user }} vm_vmid={{ v.vmid }} vm_target={{ v.target }}
          {% endfor %}

          [worker_nodes]
          {% for v in vm_status if v.role == 'worker' %}
          {{ v.name }} ansible_host={{ vm_ips[v.name] }} ansible_user={{ vm_ssh_user }} vm_vmid={{ v.vmid }} vm_target={{ v.target }} vm_type={{ v.type }}
          {% endfor %}

          [cluster_vms:children]
          cp_nodes
          worker_nodes

- name: Wait for SSH to be ready on the VMs
  hosts: cluster_vms
  gather_facts: false
  tasks:
    - name: wait_for SSH port 22
      ansible.builtin.wait_for_connection:
        timeout: 180
        delay: 5
