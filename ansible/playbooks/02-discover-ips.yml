# 02-discover-ips.yml — Đợi boot → poll qemu-guest-agent lấy IP VLAN 108 → add_host động.
# Fallback: nếu Guest Agent fail 3 lần, dùng `qm guest exec` qua SSH Proxmox host.
---
- name: Discover IP của VM cluster
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/proxmox.yml
    - ../vars/network.yml
    - ../vars/cluster.yml
  vars:
    proxmox_api_url: "https://{{ proxmox_api_host }}:{{ proxmox_api_port }}/api2/json"
    api_headers:
      Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    # Derive từ net_vlan_vm.cidr (vars/network.yml) thay vì hardcode "172.16." — tự đồng bộ nếu VLAN
    # đổi CIDR. LƯU Ý giới hạn: chỉ đúng khi mask CIDR ≥ /16 và biên mask rơi đúng ranh giới octet
    # (đúng cho /21 dạng 172.16.0.0/21 hiện tại — 2 octet đầu luôn cố định). Nếu hạ tầng khác dùng
    # CIDR không thẳng hàng octet (vd /20 lệch octet 3), cần thay bằng match CIDR thật (ansible.utils
    # ipaddr, cần cài thêm collection) thay vì string prefix.
    vm_vlan_prefix: "{{ net_vlan_vm.cidr.split('.')[0:2] | join('.') }}."
  tasks:
    - name: Nạp vm_status từ file (nếu chạy 02 độc lập)
      ansible.builtin.set_fact:
        vm_status: "{{ lookup('file', playbook_dir + '/../.vmstatus_' + cluster_name + '.json') | from_json }}"
      when: vm_status is not defined

    - name: Đợi VM boot + qemu-ga khởi động
      ansible.builtin.pause:
        seconds: 60

    - name: Poll Guest Agent lấy network interfaces
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ item.target }}/qemu/{{ item.vmid }}/agent/network-get-interfaces"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        status_code: [200]
      register: agent_net
      until: >-
        agent_net.status == 200 and
        (agent_net.json.data.result | default([]) | json_query('[]."ip-addresses"[]."ip-address"')
         | select('match', '^' + vm_vlan_prefix) | list | length) > 0
      retries: 20
      delay: 15
      loop: "{{ vm_status }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Trích IP VLAN 108 cho từng VM
      ansible.builtin.set_fact:
        vm_ips: >-
          {{ vm_ips | default({}) | combine({
               item.item.name: (item.json.data.result
                 | json_query('[]."ip-addresses"[]."ip-address"')
                 | select('match', '^' + vm_vlan_prefix) | first)
             }) }}
      loop: "{{ agent_net.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Báo IP đã lấy
      ansible.builtin.debug:
        var: vm_ips

    - name: Fail nếu thiếu IP của VM nào (Stop condition)
      ansible.builtin.fail:
        msg: "Không lấy được IP VLAN 108 cho {{ item.name }} sau 300s — kiểm tra qemu-guest-agent."
      when: vm_ips[item.name] is not defined
      loop: "{{ vm_status }}"
      loop_control:
        label: "{{ item.name }}"

    # --- add_host động vào group theo role/type ---
    - name: add_host vào inventory in-memory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        ansible_host: "{{ vm_ips[item.name] }}"
        ansible_user: "{{ vm_ssh_user }}"
        groups: >-
          {{ ['cluster_vms']
             + (['rancher_nodes'] if item.role == 'rancher'
                else (['cp_nodes'] if item.role == 'cp' else ['worker_nodes']))
             + (['static_ip_pending'] if (item.pin_static_ip | default(false) | bool) else []) }}
        vm_role: "{{ item.role }}"
        vm_type: "{{ item.type }}"
        vm_vmid: "{{ item.vmid }}"
        vm_target: "{{ item.target }}"
      loop: "{{ vm_status }}"
      loop_control:
        label: "{{ item.name }} → {{ vm_ips[item.name] }}"

    - name: Ghi hosts file .hosts_<cluster>.ini (tham khảo / chạy lại độc lập)
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../.hosts_{{ cluster_name }}.ini"
        mode: "0644"
        content: |
          # Auto-generated by 02-discover-ips.yml — cluster {{ cluster_name }}
          [cp_nodes]
          {% for v in vm_status if v.role == 'cp' %}
          {{ v.name }} ansible_host={{ vm_ips[v.name] }} ansible_user={{ vm_ssh_user }} vm_vmid={{ v.vmid }} vm_target={{ v.target }}
          {% endfor %}

          [worker_nodes]
          {% for v in vm_status if v.role == 'worker' %}
          {{ v.name }} ansible_host={{ vm_ips[v.name] }} ansible_user={{ vm_ssh_user }} vm_vmid={{ v.vmid }} vm_target={{ v.target }} vm_type={{ v.type }}
          {% endfor %}

          [cluster_vms:children]
          cp_nodes
          worker_nodes

- name: Đợi SSH sẵn sàng trên các VM
  hosts: cluster_vms
  gather_facts: false
  tasks:
    - name: wait_for SSH port 22
      ansible.builtin.wait_for_connection:
        timeout: 180
        delay: 5
