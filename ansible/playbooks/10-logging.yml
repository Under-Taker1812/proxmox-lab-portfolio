# 10-logging.yml — [new_cluster] A lightweight agent (Fluent Bit) ships logs to the data-collector hub.
#
# Decision: dropped logging-operator + fluentd + a dedicated Elasticsearch/Kibana per test cluster
# (expensive on RAM, unnecessary) in favor of Fluent Bit (the fluent/fluent-bit chart) forwarding
# straight to the data-collector hub's Elasticsearch (see ../vars/hub.yml and
# ../../docs/08-observability-hub.md). This cluster stores no logs locally.
#
# A cluster_name={{ cluster_name }} field is attached to every record via the record_modifier
# filter, and each cluster gets its own index prefix k8s-{{ cluster_name }}-YYYY.MM.DD (instead of
# sharing an ambiguous "k8s-*" with no clear source) — see templates/fluent-bit-values.yaml.j2. Also
# carries forward the ssl_verify fix and the suppress_type_name/ilm_policy fix from an earlier
# ClusterOutput-based version, applied directly to the ES output plugin here.
---
- name: Logging agent (ships logs to the data-collector hub)
  hosts: "{{ (groups['cp_nodes'] | default(['__nohost__']))[0] }}"
  gather_facts: false
  become: true
  vars_files:
    - ../vars/cluster.yml
    - ../vars/hub.yml
  environment:
    KUBECONFIG: "{{ rke2_kubeconfig }}"
    # Hardcoded standard PATH, not ansible_env — undefined when run_only isolates this play (see
    # "A PATH that only worked by accident of execution order" in ../TROUBLESHOOTING.md, same bug
    # detailed in 08-ceph-csi.yml).
    PATH: "{{ rke2_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  tasks:
    - name: helm repo add fluent
      ansible.builtin.command:
        cmd: "helm repo add {{ helm_repos_hub.fluent.name }} {{ helm_repos_hub.fluent.url }}"
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when:
        - repo_add.rc != 0
        - "'already exists' not in repo_add.stderr"

    - name: helm repo update
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    # This playbook can run STANDALONE (outside site.yml), so it can't just rely on site.yml's
    # preflight validation. The non-secret half (hub_instances, vars/hub.yml) is checked separately
    # from the secret half below — a typo'd name might only be missing from one of the two maps
    # (hub_instances or vault_hub_instances), so checking only one side isn't enough.
    - name: Fail if hub_instance isn't in hub_instances
      ansible.builtin.fail:
        msg: >-
          hub_instance="{{ hub_instance }}" is not in hub_instances ({{ hub_instances.keys() | list }})
          — check deploy-config.yml, or add a new entry to vars/hub.yml (see README.md).
      when: hub_instance not in hub_instances

    - name: Fail if vault_hub_instances is missing the selected hub_instance's Elasticsearch password
      ansible.builtin.fail:
        msg: >-
          Missing vault_hub_instances.{{ hub_instance }}.es_password — fill it in under
          group_vars/all/vault.yml (see README.md step 4). Currently selected hub_instance:
          "{{ hub_instance }}" (change it in deploy-config.yml if this is the wrong hub).
      when: >-
        vault_hub_instances is not defined or
        hub_instance not in vault_hub_instances or
        vault_hub_instances[hub_instance].es_password is not defined or
        vault_hub_instances[hub_instance].es_password | length == 0

    # Two different Kubernetes label conventions coexist on a real cluster — `app: pod-name`
    # (a plain string) and `app.kubernetes.io/name: xxx` (the dot gets nested into an object by
    # Fluent Bit's own `kubernetes` filter when it builds the labels map). Whichever record arrives
    # FIRST each day locks in Elasticsearch's inferred type for `kubernetes.labels.app` (string or
    # object) — every later record with the other shape gets outright rejected
    # (mapper_parsing_exception), and Fluent Bit retries that entire chunk forever, because the
    # failure is in the data, not the connection. Fixed at the source (Elasticsearch), not in Fluent
    # Bit — labels/annotations are given the 'flattened' type before fluent-bit ever writes to them.
    #
    # IMPORTANT: this MUST be merged into the EXISTING `k8s-logs-auto-replica` template (created by
    # playbooks/13-data-collector-hub.yml for its own auto_expand_replicas fix) — never create a
    # separate template, even one matching the same "k8s-*" pattern. A composable index template
    # picks exactly ONE winner by priority when a new index is created — it doesn't merge multiple
    # matching templates. A new template at the default priority (lower than 100) would be
    # completely shadowed by `k8s-logs-auto-replica` (priority 100) and have zero effect — a mistake
    # made once already while debugging this.
    - name: Ensure the k8s-logs-auto-replica ES index template maps labels/annotations as 'flattened' (avoids mapper_parsing_exception)
      ansible.builtin.uri:
        url: "{{ hub_logs_es_url }}/_index_template/k8s-logs-auto-replica"
        method: PUT
        user: "{{ hub_es_user }}"
        password: "{{ hub_es_password }}"
        force_basic_auth: true
        validate_certs: "{{ hub_logs_tls_verify }}"
        body_format: json
        body:
          index_patterns: ["k8s-*"]
          priority: 100
          template:
            settings:
              index.auto_expand_replicas: "0-1"
            mappings:
              properties:
                kubernetes:
                  properties:
                    labels:
                      type: flattened
                    annotations:
                      type: flattened
        status_code: [200]
      changed_when: false

    - name: Render the fluent-bit values (ES output to the hub + record_modifier for cluster_name)
      ansible.builtin.template:
        src: ../templates/fluent-bit-values.yaml.j2
        dest: /root/fluent-bit-values.yaml
        mode: "0644"

    - name: helm install fluent-bit (DaemonSet — every node, no nodeSelector pin)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install fluent-bit {{ fluent_bit_chart }}
          --namespace logging --create-namespace
          -f /root/fluent-bit-values.yaml
      register: fb_install
      changed_when: "'STATUS: deployed' in fb_install.stdout"

    # The original check (`grep -v Running | wc -l`) was a false-pass check: (1) a CrashLoopBackOff
    # pod flaps through "Running" between restarts and slips past it; (2) "0/1 Running" also
    # contains the word "Running" and slips past too. This is exactly what let a crash-looping
    # Fluent Bit sail through this play undetected, only to surface later in play 12's verification.
    # Fixed by comparing each pod's own READY x/y count and the DaemonSet's DESIRED vs READY count
    # (which also catches a pod that was never scheduled at all).
    - name: Wait for fluent-bit to be genuinely Ready (DaemonSet DESIRED==READY + every pod's READY x/x)
      ansible.builtin.shell:
        cmd: |
          ds=$(kubectl -n logging get ds --no-headers 2>/dev/null | wc -l)
          dsbad=$(kubectl -n logging get ds --no-headers 2>/dev/null | awk '$2!=$4 || $4==0 {c++} END{print c+0}')
          badpod=$(kubectl -n logging get pods --no-headers 2>/dev/null | awk '$3!="Completed"{split($2,a,"/"); if(a[1]!=a[2]) c++} END{print c+0}')
          echo "ds=$ds dsbad=$dsbad badpod=$badpod"
          [ "$ds" -gt 0 ] && [ "$dsbad" -eq 0 ] && [ "$badpod" -eq 0 ]
      register: fb_pods
      changed_when: false
      retries: 30
      delay: 10
      until: fb_pods.rc == 0

    - name: Print fluent-bit's recent logs (a sanity check — real verification has to happen on the hub side)
      ansible.builtin.command:
        cmd: "kubectl -n logging logs -l app.kubernetes.io/name=fluent-bit --tail=30"
      register: fb_log
      changed_when: false
      failed_when: false

    - name: Show fluent-bit's logs
      ansible.builtin.debug:
        msg: "{{ fb_log.stdout_lines }}"

    - name: Reminder to verify for real (cross-cluster — can't be automated from this playbook)
      ansible.builtin.debug:
        msg: >-
          Final verification has to be done BY HAND on the data-collector hub: open Kibana (the
          hub's NodePort) or run
          curl -sk -u {{ hub_es_user }}:<password> "{{ hub_logs_es_url }}/k8s-{{ cluster_name }}-*/_count",
          and confirm the k8s-{{ cluster_name }}-* index actually has documents. This playbook can
          only verify that the pods are Ready and not crashing — it can't confirm the data actually
          reached the hub.
