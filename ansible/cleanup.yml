# cleanup.yml — Xóa toàn bộ VM + cluster theo tên. GỌI THỦ CÔNG, không tự chạy.
#   ansible-playbook cleanup.yml --ask-vault-pass -e "cluster_name=k8s-demo"
#
# KHÔNG xóa Ceph pool (tránh mất dữ liệu). Chỉ log cảnh báo nếu có pool riêng.
---
- name: Cleanup cluster {{ cluster_name | default('?') }}
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/proxmox.yml
    - vars/network.yml
    - vars/cluster.yml
  vars:
    proxmox_api_url: "https://{{ proxmox_api_host }}:{{ proxmox_api_port }}/api2/json"
    api_headers:
      Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
  tasks:
    - name: Fail nếu thiếu cluster_name
      ansible.builtin.fail:
        msg: "Bắt buộc -e cluster_name=<tên>"
      when: cluster_name is not defined

    - name: Xác nhận xóa (an toàn — chạy với -e confirm_destroy=yes)
      ansible.builtin.fail:
        msg: "Sẽ XÓA mọi VM tên bắt đầu '{{ cluster_name }}-'. Chạy lại kèm -e confirm_destroy=yes để tiếp tục."
      when: confirm_destroy | default('no') != 'yes'

    - name: Probe VM hiện có
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/cluster/resources?type=vm"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
      register: pve_vms

    - name: Lọc VM thuộc cluster
      ansible.builtin.set_fact:
        target_vms: "{{ pve_vms.json.data | selectattr('name', 'defined') | selectattr('name', 'match', '^' + cluster_name + '-') | list }}"

    - name: Báo VM sẽ xóa
      ansible.builtin.debug:
        msg: "{{ target_vms | map(attribute='name') | list }}"

    - name: Stop VM (force)
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ item.node }}/qemu/{{ item.vmid }}/status/stop"
        method: POST
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        status_code: [200, 500]      # 500 nếu đã stopped
      loop: "{{ target_vms }}"
      loop_control:
        label: "{{ item.name }}"
      failed_when: false

    - name: Đợi VM dừng hẳn
      ansible.builtin.pause:
        seconds: 15
      when: target_vms | length > 0

    - name: Destroy VM (purge)
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ item.node }}/qemu/{{ item.vmid }}?purge=1&destroy-unreferenced-disks=1"
        method: DELETE
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        status_code: [200]
      loop: "{{ target_vms }}"
      loop_control:
        label: "{{ item.name }}"

    # --- Xóa downstream cluster trên Rancher (nếu có file .id) ---
    - name: Đọc cluster id (nếu còn file)
      ansible.builtin.set_fact:
        saved_cluster_id: "{{ lookup('file', playbook_dir + '/.cluster_' + cluster_name + '.id', errors='ignore') | default('', true) | trim }}"

    - name: Xóa provisioning cluster qua Rancher API
      ansible.builtin.uri:
        url: "{{ rancher_url }}/v1/provisioning.cattle.io.clusters/fleet-default/{{ cluster_name }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ rancher_api_token }}"
        validate_certs: false
        status_code: [200, 204, 404]
      when: rancher_api_token | default('') | length > 0
      failed_when: false

    - name: Cảnh báo Ceph pool (KHÔNG tự xóa)
      ansible.builtin.debug:
        msg: >-
          {{ 'Pool riêng ' + cluster_name + '-pvc còn tồn tại — xóa THỦ CÔNG nếu chắc chắn: ceph osd pool delete...'
             if ceph_create_pool | default(false) else 'Dùng pool chung kubernetes — không đụng.' }}

    - name: Dọn file state local
      ansible.builtin.file:
        path: "{{ playbook_dir }}/{{ item }}"
        state: absent
      loop:
        - ".vmstatus_{{ cluster_name }}.json"
        - ".hosts_{{ cluster_name }}.ini"
        - ".cluster_{{ cluster_name }}.id"

    - name: Gỡ entry IP tracker của cluster (giữ entry cluster khác)
      ansible.builtin.copy:
        dest: "{{ storage_ip_tracker }}"
        mode: "0644"
        content: >-
          {{ (lookup('file', storage_ip_tracker, errors='ignore') | default('{}', true) | from_json)
             | dict2items | rejectattr('key', 'match', '^' + cluster_name + '-')
             | items2dict | to_nice_json }}
      when: storage_ip_tracker is exists
      failed_when: false
