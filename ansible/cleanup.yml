# cleanup.yml — Deletes every VM + cluster matching a name. CALLED MANUALLY, never runs on its own.
#   ansible-playbook cleanup.yml --ask-vault-pass -e "cluster_name=k8s-demo"
#
# Never deletes the Ceph pool (avoids data loss) — only logs a warning if a dedicated pool exists.
---
- name: "Cleanup cluster {{ cluster_name | default('?') }}"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/proxmox.yml
    - vars/network.yml
    - vars/cluster.yml
  vars:
    proxmox_api_url: "https://{{ proxmox_api_host }}:{{ proxmox_api_port }}/api2/json"
    api_headers:
      Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
  tasks:
    - name: Fail if cluster_name is missing
      ansible.builtin.fail:
        msg: "-e cluster_name=<name> is required"
      when: cluster_name is not defined

    - name: Require confirmation (safety — run with -e confirm_destroy=yes)
      ansible.builtin.fail:
        msg: "This will DELETE every VM whose name starts with '{{ cluster_name }}-'. Re-run with -e confirm_destroy=yes to proceed."
      when: confirm_destroy | default('no') != 'yes'

    - name: Probe existing VMs
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/cluster/resources?type=vm"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
      register: pve_vms

    - name: Filter to VMs belonging to this cluster
      ansible.builtin.set_fact:
        target_vms: "{{ pve_vms.json.data | selectattr('name', 'defined') | selectattr('name', 'match', '^' + cluster_name + '-') | list }}"

    - name: Report which VMs will be deleted
      ansible.builtin.debug:
        msg: "{{ target_vms | map(attribute='name') | list }}"

    - name: Stop the VMs (force)
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ item.node }}/qemu/{{ item.vmid }}/status/stop"
        method: POST
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        status_code: [200, 500]      # 500 if already stopped
      loop: "{{ target_vms }}"
      loop_control:
        label: "{{ item.name }}"
      failed_when: false

    - name: Wait for the VMs to fully stop
      ansible.builtin.pause:
        seconds: 15
      when: target_vms | length > 0

    - name: Destroy the VMs (purge)
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ item.node }}/qemu/{{ item.vmid }}?purge=1&destroy-unreferenced-disks=1"
        method: DELETE
        headers: "{{ api_headers }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
        status_code: [200]
      loop: "{{ target_vms }}"
      loop_control:
        label: "{{ item.name }}"

    # --- Delete the downstream cluster from Rancher (if a saved .id file exists) ---
    - name: Read the saved cluster id, if the file still exists
      ansible.builtin.set_fact:
        saved_cluster_id: "{{ lookup('file', playbook_dir + '/.cluster_' + cluster_name + '.id', errors='ignore') | default('', true) | trim }}"

    - name: Delete the provisioning cluster via the Rancher API
      ansible.builtin.uri:
        url: "{{ rancher_url }}/v1/provisioning.cattle.io.clusters/fleet-default/{{ cluster_name }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ rancher_api_token }}"
        validate_certs: false
        status_code: [200, 204, 404]
      when: rancher_api_token | default('') | length > 0
      failed_when: false

    - name: Warn about the Ceph pool (never auto-deleted)
      ansible.builtin.debug:
        msg: >-
          {{ ('Dedicated pool ' + cluster_name + '-pvc still exists — delete it BY HAND if you are certain: ceph osd pool delete...')
             if ceph_create_pool | default(false) else 'Using the shared kubernetes pool — nothing to touch.' }}

    - name: Clean up local state files
      ansible.builtin.file:
        path: "{{ playbook_dir }}/{{ item }}"
        state: absent
      loop:
        - ".vmstatus_{{ cluster_name }}.json"
        - ".hosts_{{ cluster_name }}.ini"
        - ".cluster_{{ cluster_name }}.id"

    - name: Remove this cluster's entries from the IP tracker (keeps other clusters' entries)
      ansible.builtin.copy:
        dest: "{{ storage_ip_tracker }}"
        mode: "0644"
        content: >-
          {{ (lookup('file', storage_ip_tracker, errors='ignore') | default('{}', true) | from_json)
             | dict2items | rejectattr('key', 'match', '^' + cluster_name + '-')
             | items2dict | to_nice_json }}
      when: storage_ip_tracker is exists
      failed_when: false
