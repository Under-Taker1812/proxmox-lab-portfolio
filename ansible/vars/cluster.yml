# vars/cluster.yml — cluster definition + tuning. Override via -e or a separate file per run.
# This is a 2-NODE SAMPLE TEMPLATE (down from 3 nodes — resources reduced, and the dedicated
# monitoring node was dropped once the monitoring/logging agents got light enough to not need a
# pinned node — see playbooks/09-monitoring.yml).
# (mode / rancher_mode / rancher_url / stage_* live in group_vars/all/vars.yml — global variables.)
---
# The cluster needs a name at run time: -e cluster_name=k8s-demo

# The node list — each item is one VM. role: cp|worker (|rancher for install_new). type: general
# (kept for schema/inventory compatibility — there's no longer a special "monitoring" value handled
# differently; the monitoring/logging agents run fine on any node, no nodeSelector needed).
# The first CP (cp-01) is where manifests get staged.
#
# target_node (optional, any role) — pins this VM to exactly one specific Proxmox node (e.g.
# "proxmox-2"), skipping RAM-based auto-select. Omit it to keep the default auto-select behavior
# for cp/worker ("runs wherever there's enough RAM/CPU"). Used for "central" VMs whose location
# needs to be known in advance (Rancher, and a hub created via playbook 13) — e.g. Rancher pinned to
# proxmox-1, a hub pinned to proxmox-2, while regular CP/worker nodes still auto-pick the least-busy
# of the 4 nodes. A bad node name/offline node fails early during play 01's preflight, before any
# clone starts.
# pin_static_ip (optional, defaults to false) — true makes play 02b
# (playbooks/02b-pin-static-ip.yml) convert this VM's DHCP-assigned IP to static (same IP, DHCP
# client just gets disabled) — for VMs that need a permanently stable IP, like the Rancher
# management node or the data-collector hub (see playbooks/02b-pin-static-ip.yml for the root cause
# this solves). Do NOT enable it for regular CP/worker nodes in a normal multi-node cluster.
# CP sizing: 5120MB/4 cores — 4096MB/2 cores wasn't enough for the RKE2 server bootstrap
# (etcd+kube-apiserver+kube-controller-manager+kube-scheduler+Calico+the Rancher agent all starting
# at once), which starved RAM badly enough that the workload-VLAN DHCP lease was lost mid-join
# ("No route to host"). 6144MB was considered first, but the auto-selected node only had ~9.56GB
# genuinely available (after the 15% buffer) — 6144+4096=10240MB would have exceeded that, so it was
# lowered to 5120MB (9216MB total) to leave the host some headroom.
cluster_nodes:
  - { role: "cp",     ram: 5120, cpu: 4, disk: 40, type: "general" }
  - { role: "worker", ram: 4096, cpu: 2, disk: 40, type: "general" }
  # - { role: "rancher", ram: 8192, cpu: 4, disk: 50, target_node: "proxmox-1", pin_static_ip: true }   # example: pinned node + pinned IP

# --- Ceph CSI ---
# Defaults to CREATING a dedicated '<cluster>-pvc' pool per cluster (data isolation matters more
# here, and the keyring is scoped to that one pool) — a deliberate, accepted exception to generally
# avoiding direct Ceph-layer changes. Set to false to reuse the existing 'kubernetes' pool instead.
ceph_create_pool: true
ceph_pool_reuse_name: "kubernetes"
ceph_pool_reuse_user: "kubernetes"
ceph_pool_pg_num: 32
ceph_pool_quota: "500G"

# --- Disk prep (growpart/LVM) — auto-detect falls back to these real, verified values ---
prep_root_disk: "sda"               # template scsi0 → /dev/sda
prep_root_part: "3"                 # /dev/sda3 = the LVM PV
prep_lvm_vg: "ubuntu-vg"
prep_lvm_lv: "ubuntu-lv"

# --- Resource limits for the monitoring/logging agent stack: see vars/hub.yml (hub_agent_values) ---
# (An earlier version installed a dedicated Prometheus/Grafana/Alertmanager/ES/Kibana stack per
# cluster — dropped in favor of the centralized hub, see playbooks/09-monitoring.yml +
# 10-logging.yml. The old monitoring_values/logging_values vars were removed from here since nothing
# uses them anymore.)
