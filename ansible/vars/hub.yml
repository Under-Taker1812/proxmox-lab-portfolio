# vars/hub.yml — connection info for the data-collector hub(s) (hand-built; see
# ../../docs/08-observability-hub.md for the design). A downstream cluster created by site.yml only
# ever SHIPS data here (via lightweight agents: node-exporter + kube-state-metrics + vmagent for
# metrics, fluent-bit for logs) — it no longer installs a local Prometheus/ES/Kibana stack (unlike
# an earlier version of playbooks/09-monitoring.yml/10-logging.yml).
#
# The lab can have MULTIPLE hubs (each serving a different group of tasks/projects, e.g. one hub for
# a thesis project and a separate one for another task) — which hub a given run uses is chosen via
# deploy-config.yml (`hub_instance: <name>`); this file itself isn't meant to change per run.
#
# To add a new hub: add a key under `hub_instances` below (non-secret info), then add the matching
# real password under `vault_hub_instances.<name>.es_password` (vault.yml/.secrets-test — see
# README.md).
---
hub_instances:
  default:
    # This hub's IP is PINNED STATIC (netplan dhcp4: false, set directly on the VM) after its IP
    # drifted across several different DHCP-assigned addresses within a few days — the exact failure
    # mode playbooks/02b-pin-static-ip.yml now solves automatically for any newly created VM. This
    # particular hub predates that automation and was pinned by hand — it never went through
    # playbook 02b.
    # vmid: this hub's real Proxmox VMID — lets playbooks/01-create-vms.yml look up the REAL node
    # it's currently running on via the API at runtime (instead of blindly trusting the static
    # target_node below) — see the matching comment on rancher_instances.main in
    # group_vars/all/vars.yml.
    vmid: 201
    host: "172.16.2.20"     # the data-collector hub VM, workload VLAN, static IP
    metrics_port: 30900     # Prometheus remote_write receiver (kube-prometheus-stack, enableRemoteWriteReceiver=true)
    logs_port: 30920        # Elasticsearch ingest
    es_user: "elastic"
    logs_tls_verify: false  # the ES chart enables TLS/xpack by default with a self-signed cert — verification is off, same as every other self-signed cert in this lab
    # target_node: this hub was built BY HAND (not through playbook 13) — but its real Proxmox node
    # is still declared here so playbooks/01-create-vms.yml knows to AVOID this node during
    # auto-select for other CP/worker clusters (a past incident nearly ran a node out of RAM because
    # the Rancher management node and this hub ended up on the same node — this avoids any other
    # cluster accidentally landing there too).
    target_node: "proxmox-1"
  # project-x:
  #   host: "<a different hub's IP on the workload VLAN>"
  #   metrics_port: 30900
  #   logs_port: 30920
  #   es_user: "elastic"
  #   logs_tls_verify: false
  #   target_node: "proxmox-2"   # the node this new hub was pinned to via playbooks/13-data-collector-hub.yml

hub_instance: "default"   # override via deploy-config.yml — must match a key in hub_instances above

# --- Facts derived from the selected hub_instance — playbooks/templates use these variables
#     instead of indexing hub_instances[...] directly, so the key doesn't have to be repeated
#     everywhere. ---
hub_host: "{{ hub_instances[hub_instance].host }}"
hub_metrics_port: "{{ hub_instances[hub_instance].metrics_port }}"
hub_logs_port: "{{ hub_instances[hub_instance].logs_port }}"
hub_es_user: "{{ hub_instances[hub_instance].es_user }}"
hub_logs_tls_verify: "{{ hub_instances[hub_instance].logs_tls_verify }}"

hub_metrics_remote_write_url: "http://{{ hub_host }}:{{ hub_metrics_port }}/api/v1/write"
# ⚠️ The metrics endpoint currently has NO basic-auth on the hub side (true for every hub instance)
# — adding it (htpasswd + web.config.file) is a documented idea, not yet implemented or verified
# against the real chart's fields. 09-monitoring.yml's remote_write carries no credential until the
# hub actually enables auth (at which point add
# `vault_hub_instances.<name>.metrics_password` + `-remoteWrite.basicAuth.*` to the playbook,
# following the same pattern as hub_es_password below).

hub_logs_es_url: "https://{{ hub_host }}:{{ hub_logs_port }}"
# The selected hub's ES password — pulled from vault_hub_instances (a secret, loaded via
# -e @.secrets-test or group_vars/all/vault.yml, never stored in this file).
hub_es_password: "{{ vault_hub_instances[hub_instance].es_password }}"

# --- Helm charts for the lightweight agent (shared across every hub instance, doesn't vary by hub) ---
helm_repos_hub:
  prometheus_community: { name: "prometheus-community", url: "https://prometheus-community.github.io/helm-charts" }
  victoria_metrics:     { name: "vm",                    url: "https://victoriametrics.github.io/helm-charts/" }
  fluent:               { name: "fluent",                url: "https://fluent.github.io/helm-charts" }

node_exporter_chart: "prometheus-community/prometheus-node-exporter"
kube_state_metrics_chart: "prometheus-community/kube-state-metrics"
vmagent_chart: "vm/victoria-metrics-agent"
fluent_bit_chart: "fluent/fluent-bit"

# --- Charts installed ON the hub VM itself (playbooks/13-data-collector-hub.yml, when creating a
# NEW hub) — distinct from the two charts above (those are the lightweight agents installed on
# downstream clusters that SEND data to the hub). The prometheus-community repo is already
# registered via helm_repos_hub above and gets reused as-is. The "elastic" repo +
# elasticsearch_chart/kibana_chart already live in vars/versions.yml (helm_repos.elastic) and aren't
# redeclared here. ---
kube_prometheus_stack_chart: "prometheus-community/kube-prometheus-stack"

# --- Resource limits for the lightweight agents (minimal RAM — these ship data out, they don't store it) ---
hub_agent_values:
  node_exporter_mem_request: "20Mi"
  node_exporter_mem_limit: "50Mi"
  kube_state_metrics_mem_request: "50Mi"
  kube_state_metrics_mem_limit: "150Mi"
  vmagent_mem_request: "100Mi"
  vmagent_mem_limit: "300Mi"
  fluent_bit_mem_request: "50Mi"
  fluent_bit_mem_limit: "150Mi"
