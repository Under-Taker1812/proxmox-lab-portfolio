# vars/network.yml — VLAN, CIDR, Ceph MON, storage IP pool
---
# --- VLAN topology ---
net_vlan_mgmt:    { id: 70,  cidr: "10.10.70.0/24" }      # Proxmox UI/SSH/API
net_vlan_vm:      { id: 108, cidr: "172.16.0.0/21" }       # VM/pod workload (DHCP)
net_vlan_storage: { id: 109, cidr: "10.10.109.0/24" }     # Ceph storage

# The CIDR Calico is allowed to autodetect from (workload VLAN only, never the storage VLAN — see
# ../../docs/troubleshooting/networking-and-cni.md, Root cause B)
calico_vm_cidr: "172.16.0.0/21"

# sslip_domain lives in inventories/production/group_vars/all/vars.yml instead of here — it needs to
# be available in EVERY play/host (including localhost in plays 06/12, accessed via hostvars), but
# vars_files only loads into the specific play that declares it, it doesn't propagate to other
# plays/hosts automatically. group_vars/all loads automatically for every play — the right place for
# a "global" variable like this one.

# DNS upstream for RKE2 (never 127.0.0.53/systemd-resolved — meaningless from inside a pod, see
# ../../docs/troubleshooting/networking-and-cni.md Bug #1)
net_dns_upstream:
  - "8.8.8.8"
  - "8.8.4.4"

# --- Ceph (FSID + MONs, both on the storage VLAN, port 3300) ---
ceph_fsid: "00000000-1111-2222-3333-444444444444"
ceph_public_network: "10.10.109.0/24"
ceph_mon_endpoints:
  - "10.10.109.1:3300"
  - "10.10.109.2:3300"
  - "10.10.109.3:3300"
  - "10.10.109.4:3300"

# --- Storage IP pool for new VMs' NIC2 (storage VLAN) ---
# Skips .1-.4 (Proxmox MONs) and .10-.13 (older infrastructure VMs: cp-01/worker-01/02/03).
storage_ip_pool:
  subnet_prefix: "10.10.109"
  netmask_cidr: 24
  range_start: 14
  range_end: 50
  reserved: [1, 2, 3, 4, 10, 11, 12, 13]   # already in use — never reassigned
# Tracker file kept on the control node to avoid handing out the same IP twice across runs.
storage_ip_tracker: "{{ playbook_dir }}/../storage_ip_tracker.json"
