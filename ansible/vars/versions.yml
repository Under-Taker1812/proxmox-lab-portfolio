# vars/versions.yml — pin version để deploy lặp lại được (encode đúng version đã chạy thật)
---
# K3s host cho Rancher (rancher_mode=install_new)
k3s_version: "v1.30.5+k3s1"

# RKE2 downstream — Rancher quản lý version; pin qua kubernetesVersion khi tạo cluster
rke2_version: "v1.35.4+rke2r1"

# Rancher stack
rancher_chart_repo: "https://releases.rancher.com/server-charts/stable"
rancher_chart: "rancher-stable/rancher"
cert_manager_repo: "https://charts.jetstack.io"
cert_manager_version: "v1.16.2"            # crds.enabled=true khi install

# Helm charts hạ tầng
helm_repos:
  ceph_csi:   { name: "ceph-csi", url: "https://ceph.github.io/csi-charts" }
  elastic:    { name: "elastic",  url: "https://helm.elastic.co" }
  jetstack:   { name: "jetstack", url: "https://charts.jetstack.io" }
  rancher:    { name: "rancher-stable", url: "https://releases.rancher.com/server-charts/stable" }

ceph_csi_chart: "ceph-csi/ceph-csi-rbd"
# ceph_csi_image_pull_wait cũ (360s tĩnh) đã bỏ 2026-07-24 — thay bằng ceph_csi_wait_base/
# ceph_csi_wait_per_node (group_vars/all/vars.yml), scale theo số node cluster thay vì cố định.

# Elasticsearch / Kibana (Elastic official — Bitnami bị 403 từ 28/8/2025)
elasticsearch_chart: "elastic/elasticsearch"
kibana_chart: "elastic/kibana"
