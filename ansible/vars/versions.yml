# vars/versions.yml — pinned versions for repeatable deploys (encodes the exact versions actually run)
---
# K3s host for Rancher (rancher_mode=install_new)
k3s_version: "v1.30.5+k3s1"

# Downstream RKE2 — Rancher manages the version; pinned via kubernetesVersion at cluster creation
rke2_version: "v1.35.4+rke2r1"

# Rancher stack
rancher_chart_repo: "https://releases.rancher.com/server-charts/stable"
rancher_chart: "rancher-stable/rancher"
cert_manager_repo: "https://charts.jetstack.io"
cert_manager_version: "v1.16.2"            # installed with crds.enabled=true

# Infrastructure Helm charts
helm_repos:
  ceph_csi:   { name: "ceph-csi", url: "https://ceph.github.io/csi-charts" }
  elastic:    { name: "elastic",  url: "https://helm.elastic.co" }
  jetstack:   { name: "jetstack", url: "https://charts.jetstack.io" }
  rancher:    { name: "rancher-stable", url: "https://releases.rancher.com/server-charts/stable" }

ceph_csi_chart: "ceph-csi/ceph-csi-rbd"
# The old fixed ceph_csi_image_pull_wait (a static 360s) was replaced by ceph_csi_wait_base/
# ceph_csi_wait_per_node (group_vars/all/vars.yml), which scale with cluster node count instead of
# staying fixed.

# Elasticsearch / Kibana (the official Elastic charts — Bitnami's started returning 403s)
elasticsearch_chart: "elastic/elasticsearch"
kibana_chart: "elastic/kibana"
