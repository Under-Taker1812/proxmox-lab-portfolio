# group_vars/all/vars.yml — global NON-SECRET variables, loaded for every host.
# Loads the topic-specific vars/ files and maps secrets in from group_vars/all/vault.yml.
#
# STRUCTURE NOTE: this file MUST live inside the group_vars/all/ directory (not as a standalone
# group_vars/all.yml file) — Ansible only auto-merges MULTIPLE group_vars files when they live
# together in a directory matching the group name ("all"). A real bug happened once from this: a
# vault.yml file placed alongside all.yml (not inside an all/ directory) was NEVER auto-loaded — every
# vault_* variable came back "undefined" on a real run via --ask-vault-pass (only .secrets-test via
# -e avoided it, since that's extra-vars, independent of group_vars). See ../TROUBLESHOOTING.md.
---
# Every topic-specific vars file (proxmox/network/versions/cluster) is loaded via vars_files in
# site.yml. This file only holds shared variables + the bridge between plain vars and vault vars.

# The wildcard-DNS domain used for the Rancher hostname (rancher.<ip>.{{ sslip_domain }}) — no
# internal DNS needed. Change this if a different production environment has a real domain, existing
# internal DNS, or a similar service (e.g. nip.io). Deliberately placed HERE (group_vars/all), not in
# vars/network.yml: this variable needs to be available in EVERY play/host (including localhost when
# plays 06/12 read it via hostvars), but vars_files only loads into the specific play that declares it
# — group_vars/all is the one thing that auto-loads for every play.
sslip_domain: "sslip.io"

# --- RUN CONTROL (GLOBAL — has to live in group_vars so import_playbook's `when` conditions can see
#     it). Override via -e at run time. The stage_* flags default based on mode. ---
mode: "new_cluster"                  # new_cluster | add_node
rancher_mode: "use_existing"         # use_existing | install_new

# --- The lab can have MULTIPLE Rancher servers (each managing its own group of clusters/tasks) ---
# Only used when rancher_mode=use_existing. To add a new Rancher: add a key below (the url isn't a
# secret) plus the matching real token under vault_rancher_instances.<name>.api_token
# (vault.yml/.secrets-test — see README.md). Which instance a given run uses is chosen via
# deploy-config.yml (`rancher_instance: <name>`) — this file itself isn't meant to change per run.
rancher_instances:
  main:
    # This Rancher's IP is PINNED STATIC (netplan dhcp4: false, set directly on the VM) — same IP as
    # before, but no longer dependent on DHCP renewal (done at the same time as the fix for the
    # data-collector hub's own IP, see docs/08-observability-hub.md).
    url: "https://rancher.172.16.2.10.sslip.io"   # the main Rancher, manages the workload clusters + data-collector hub
    # vmid: this Rancher management VM's real Proxmox VMID — having this field lets
    # playbooks/01-create-vms.yml look up the REAL node this VM is running on via the API
    # (cluster/resources?type=vm) at run time, instead of blindly trusting the static target_node
    # below (in case the VM was migrated by hand through the Proxmox UI without updating this
    # config). target_node is kept as a fallback if vmid is missing or the VM isn't found during the probe.
    vmid: 200
    # target_node: the real Proxmox node currently running the Rancher management VM — declared so
    # playbooks/01-create-vms.yml can avoid this node during auto-select for other CP/worker
    # clusters (a past incident nearly ran a node out of RAM because the Rancher management node and
    # the data-collector hub ended up on the same node).
    target_node: "proxmox-1"
  # project-x:
  #   url: "https://rancher.<a-different-ip>.sslip.io"
  #   target_node: "proxmox-2"
rancher_instance: "main"   # override via deploy-config.yml — must match a key in rancher_instances above

# --- CHOOSING WHICH PLAYS RUN — the stage_NN_* variable names carry the play's own number (NN)
#     directly, so run_only (numbers) and the individual named overrides ALWAYS share the same frame
#     of reference, with no separate number↔name lookup table needed. Execution order is still
#     ALWAYS the fixed 01→12 (site.yml) — this only toggles plays on/off, it can't reorder them.
#     Play 02 (discover-ips) and 05 (rancher-setup, gated separately on rancher_mode) have no
#     stage_NN_* variable, since they aren't part of this on/off mechanism (see the notes in
#     site.yml/deploy-config.yml).
#
# run_only: a list of numbers (e.g. [1, 3, 11]) — set once, and every stage_NN_* below derives from
# it automatically. Empty (the default) = unrestricted, each stage_NN_* uses its own default (based on mode). ---
run_only: []

stage_01_create_vms:   "{{ true if not run_only else (1 in run_only) }}"
stage_03_storage_nic:  "{{ true if not run_only else (3 in run_only) }}"
stage_04_prep:         "{{ true if not run_only else (4 in run_only) }}"
stage_06_manifests:    "{{ (mode == 'new_cluster') if not run_only else (6 in run_only) }}"
stage_07_join:         "{{ true if not run_only else (7 in run_only) }}"
stage_08_ceph_csi:     "{{ (mode == 'new_cluster') if not run_only else (8 in run_only) }}"
stage_09_monitoring:   "{{ (mode == 'new_cluster') if not run_only else (9 in run_only) }}"
stage_10_logging:      "{{ (mode == 'new_cluster') if not run_only else (10 in run_only) }}"
stage_11_gitlab_harbor: "{{ true if not run_only else (11 in run_only) }}"
stage_12_verify:       "{{ true if not run_only else (12 in run_only) }}"

# --- SSH into the Ubuntu VMs (a dedicated user, passwordless sudo) ---
vm_ssh_user: "master"
# vm_ssh_password / key: uses the dedicated SSH key installed on Proxmox, pointed to in ansible.cfg.
# If joining with a password instead: vm_ssh_password: "{{ vault_vm_password }}"

# --- Secret mapping (real values live in vault.yml, encrypted) ---
proxmox_api_token_secret: "{{ vault_proxmox_api_token_secret }}"
rancher_bootstrap_password: "{{ vault_rancher_bootstrap_password | default('changeme') }}"
ceph_admin_keyring_note: "ceph commands run on the Proxmox host, which already has the admin keyring"

# --- Rancher URL/token derived from the selected rancher_instance (use_existing). install_new
#     overrides rancher_url/rancher_ip/rancher_api_token in play 05 instead (a Rancher created
#     during THIS SAME run isn't in rancher_instances — see the install_new comment in
#     deploy-config.yml if you want to register that new Rancher for use_existing on a later run). ---
rancher_url: "{{ rancher_instances[rancher_instance].url }}"
rancher_api_token: "{{ (vault_rancher_instances[rancher_instance].api_token | default('')) if (vault_rancher_instances is defined and rancher_instance in vault_rancher_instances) else '' }}"

# rancher.172.16.2.10.sslip.io → 172.16.2.10 (uses sslip_domain from vars/network.yml — never
# hardcoded here as "sslip.io"; if the current play hasn't loaded vars/network.yml yet,
# regex_escape(sslip_domain) fails with "undefined", which is intentional — fail early instead of
# silently using the wrong domain). No hardcoded IP fallback (an earlier version had one, only
# correct for this specific lab) — this stays empty if it can't be determined, and the plays that
# consume it (06-prep-manifests.yml, 12-verify.yml) fail loud on an empty value instead of silently
# using the wrong IP.
rancher_ip: "{{ (rancher_url | regex_search('rancher\\.([0-9.]+)\\.' + (sslip_domain | regex_escape), '\\1') | first) | default('', true) }}"

# --- kubectl shortcut on an RKE2 node (used in shell tasks) ---
rke2_kubectl: "sudo KUBECONFIG=/etc/rancher/rke2/rke2.yaml /var/lib/rancher/rke2/bin/kubectl"
rke2_kubeconfig: "/etc/rancher/rke2/rke2.yaml"
rke2_bin: "/var/lib/rancher/rke2/bin"

# --- Timeouts (seconds) ---
timeout_vm_boot: 120
timeout_rancher_bootstrap: 900
# An earlier 30s value wasn't enough for the very FIRST PVC bind: a "pod Running" status for
# ceph-csi-rbd-nodeplugin does NOT mean "finished registering with kubelet's plugin-watcher" — that
# has its own delay, plus the real round-trip of creating/attaching an RBD image through Ceph.
# Raised to 60s as a buffer; the real fix (waiting for real registration evidence via `csinodes`)
# lives in 08-ceph-csi.yml.
timeout_pvc_bound: 60
timeout_es: 300

# --- Timeouts that SCALE with cluster node count — replacing the old static timeout_rke2_join/
# timeout_ceph_csi (declared but never actually consumed in 07-join-cluster.yml/08-ceph-csi.yml — the
# retries there used to be hardcoded and fixed, regardless of node count). The slow lab network, plus
# several CP/worker nodes joining and pulling images CONCURRENTLY (since the deadlock fix made joins
# near-simultaneous rather than sequential), makes each node take almost linearly longer as the total
# node count grows — a fixed timeout isn't enough once the cluster has more nodes (e.g. 2 CP + 4
# worker obviously needs more time than 1 CP + 1 worker). Formula used wherever this is consumed:
#   retries = base + per_node * (total_node_count - 1)     (the "-1" because base already covers 1 node)
node_ready_retries_base: 20      # retry count when the cluster has only 1 node (a solo CP-01)
node_ready_retries_per_node: 8   # added for EACH additional node in the cluster (CP or worker)
node_ready_delay: 20              # seconds between retries — kept at the same value already verified as sufficient

ceph_csi_wait_base: 240           # seconds — enough to pull the ~760MB ceph-csi image for EXACTLY 1 node
ceph_csi_wait_per_node: 90        # seconds added for EACH additional node (the DaemonSet pulls its image on
                                   # every node concurrently, all sharing the same slow lab network — contention grows with node count)
